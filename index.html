The form creates the ten virtual machines one after another."}, {"t": 89.44, "title": "Ten running", "text": "The first ten virtual machines are running."}, {"t": 92.35, "title": "Batch two", "text": "Repeat the form for batch two, with the prefix demo-dense-b and the same tiny settings."}, {"t": 98.52, "title": "Step 23", "text": ""}, {"t": 100.16, "title": "Step 24", "text": ""}, {"t": 102.55, "title": "Step 25", "text": ""}, {"t": 104.15, "title": "Step 26", "text": ""}, {"t": 105.75, "title": "Step 27", "text": ""}, {"t": 107.35, "title": "Step 28", "text": ""}, {"t": 108.96, "title": "Step 29", "text": ""}, {"t": 110.61, "title": "Step 30", "text": ""}, {"t": 113.02, "title": "Step 31", "text": ""}, {"t": 116.98, "title": "Step 33", "text": "Twenty virtual machines are running. From here on, the video cuts between batches."}, {"t": 123.72, "title": "Cut to forty", "text": "Cut. Two more batches of ten, created off camera with the same settings: forty virtual machines are running."}, {"t": 132.03, "title": "Cut to sixty", "text": "Cut again. After two more batches, sixty small virtual machines are running on this one host."}, {"t": 139.37, "title": "The host refuses", "text": "Cut. In the seventh batch, eight virtual machines start, but the host refuses the other two."}, {"t": 145.24, "title": "Step 40", "text": "Their pods are rejected for too many pods. Each virtual machine runs in its own pod, and the host allows two hundred."}, {"t": 152.18, "title": "Final count", "text": "The final count is sixty-eight running virtual machines. The pod limit, not CPU or memory, stopped this host."}, {"t": 160.59, "title": "Wrap-up", "text": "Overcommit lets a host admit many small virtual machines, at the cost of contention under load. Check the pod limit too, and restore the default ratios when you finish testing."}], "recorded": "2026-11-14 04:20", "version": "SUSE Virtualization v1.10 (x86_64)", "video": "v/39-vm-density/video.mp4?v=1794649287", "poster": "v/39-vm-density/poster.jpg?v=1794649287", "vtt": "v/39-vm-density/captions.vtt?v=1794649287", "num": 41}, {"id": "42-harvey-dr", "title": "Fail over VMs to another cluster with harvey", "category": "Disaster Recovery", "order": 42, "summary": "Fail VMs over to a second SUSE Virtualization cluster with harvey, a community DR tool, on Longhorn and on NetApp SnapMirror storage.", "level": "advanced", "cluster": "retail-store", "prereqs": ["04-create-vm"], "intro": "In this video, you protect virtual machines with harvey, a command-line disaster recovery tool, and fail them over to a second cluster: first on Longhorn, then on NetApp storage.", "duration": 109.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you protect a virtual machine with harvey, a command-line disaster recovery tool, and fail it over to a second SUSE Virtualization cluster."}, {"t": 10.24, "title": "The VM to protect", "text": "On the retail-store cluster, the virtual machine demo-harvey is running. Its disk is a Longhorn volume."}, {"t": 16.84, "title": "Protect the VM", "text": "In a terminal, run harvey protect for demo-harvey. harvey runs on your workstation and talks to both clusters."}, {"t": 26.22, "title": "First backup and restore", "text": "harvey takes a first backup to a shared S3 target and waits until the disaster-recovery cluster restores it."}, {"t": 32.21, "title": "Standby DR volume", "text": "The source volume now backs up every five minutes. On the other cluster, a standby DR volume keeps restoring each backup."}, {"t": 38.84, "title": "Replica VM", "text": "harvey also copies the virtual machine and its cloud-init secret. The replica is created stopped."}, {"t": 45.46, "title": "Open the DR cluster", "text": "On the disaster-recovery cluster, filter the virtual machine list for demo-harvey."}, {"t": 50.65, "title": "The replica waits", "text": "The replica is there, and Off. It uses no compute until you fail over."}, {"t": 55.99, "title": "Replication status", "text": "harvey replication status shows the DR volume in standby and up to date. Lag is the data you would lose right now."}, {"t": 63.5, "title": "Planned failover", "text": "Now run a planned failover of demo-harvey to the disaster-recovery cluster."}, {"t": 69.17, "title": "Stop, sync, promote, start", "text": "harvey stops the VM, takes a final backup, waits for its restore, then promotes the DR volume and starts the VM."}, {"t": 75.63, "title": "Recovery time and point", "text": "The summary shows the total recovery time, split by phase, and a recovery point of zero seconds: no data lost."}, {"t": 82.77, "title": "Running on the DR site", "text": "Back on the disaster-recovery cluster, filter for demo-harvey again."}, {"t": 87.17, "title": "Running on the DR site", "text": "The virtual machine is Running here now, on the restored Longhorn volume."}, {"t": 92.11, "title": "Original stays stopped", "text": "On retail-store, the original is Off, so only one copy runs. harvey reprotect later replicates back the other way."}, {"t": 100.45, "title": "Wrap-up", "text": "demo-harvey now runs on the disaster-recovery cluster, with no data lost. Next, you protect virtual machines with CloudCasa."}], "recorded": "2026-11-13 19:39", "version": "SUSE Virtualization v1.9 and v1.10", "video": "v/42-harvey-dr/video.mp4?v=1794630911", "poster": "v/42-harvey-dr/poster.jpg?v=1794630911", "vtt": "v/42-harvey-dr/captions.vtt?v=1794630911", "num": 42}, {"id": "44-trident-protect-dr", "title": "Fail over a VM with NetApp Trident Protect", "category": "Disaster Recovery", "order": 44, "summary": "Replicate a VM's NetApp volumes to a second cluster with Trident Protect and SnapMirror, then fail it over.", "level": "advanced", "cluster": "retail-store", "prereqs": ["40-netapp-trident"], "intro": "In this video, you replicate a virtual machine's NetApp volume to a second SUSE Virtualization cluster with Trident Protect and SnapMirror, then fail the virtual machine over.", "duration": null, "chapters": [], "recorded": null, "version": "SUSE Virtualization v1.9 and v1.10, Trident 26.06, Trident Protect 26.06", "video": null, "poster": null, "vtt": null, "num": 43}, {"id": "45-kasten-dr", "title": "Restore a VM on another cluster with Veeam Kasten", "category": "Disaster Recovery", "order": 45, "summary": "Export a VM backup with Kasten K10 and import and restore it on a second SUSE Virtualization cluster.", "level": "advanced", "cluster": null, "prereqs": [], "intro": "Export a VM backup with Kasten K10 and import and restore it on a second SUSE Virtualization cluster.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 44}, {"id": "46-cloudcasa-dr", "title": "Run a DR plan with CloudCasa", "category": "Disaster Recovery", "order": 46, "summary": "Define DR clusters and a DR plan in CloudCasa and fail a VM over between clusters using Longhorn.", "level": "advanced", "cluster": null, "prereqs": [], "intro": "Define DR clusters and a DR plan in CloudCasa and fail a VM over between clusters using Longhorn.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 45}, {"id": "40-netapp-trident", "title": "Run VM disks on NetApp ONTAP with Trident", "category": "Ecosystem", "order": 40, "summary": "Create a VM whose disk lives on a NetApp ONTAP StorageClass through Trident, and expand it online.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["17-storage-class", "13-resize-disk"], "intro": "In this video, you give a virtual machine a disk on NetApp ONTAP storage through the Trident CSI driver, then expand that disk while the virtual machine keeps running.", "duration": 136.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you give a virtual machine a disk on NetApp ONTAP storage through the Trident CSI driver, then expand that disk while the virtual machine keeps running."}, {"t": 10.58, "title": "NetApp storage class", "text": "Trident, the NetApp CSI driver, is installed on this cluster. Its storage class netapp-iscsi creates volumes on ONTAP over iSCSI."}, {"t": 20.63, "title": "Online expansion setting", "text": "By default, SUSE Virtualization expands disks of running virtual machines only for Longhorn. The setting csi-online-expand-validation controls this."}, {"t": 29.42, "title": "Edit the setting", "text": "Open its action menu,"}, {"t": 31.81, "title": "Edit the setting", "text": "and select Edit Setting."}, {"t": 34.76, "title": "Add Trident", "text": "Select Add."}, {"t": 37.1, "title": "Add Trident", "text": "For the new provisioner, choose csi.trident.netapp.io,"}, {"t": 42.5, "title": "Allow online expansion", "text": "and keep the value True."}, {"t": 44.52, "title": "Save", "text": "Select Save."}, {"t": 47.1, "title": "Create a virtual machine", "text": "Now create a virtual machine. On the Virtual Machines page, select Create."}, {"t": 52.66, "title": "Namespace and name", "text": "Choose the namespace demo,"}, {"t": 55.55, "title": "Step 14", "text": "and name it demo-netapp."}, {"t": 57.93, "title": "CPU and memory", "text": "Give it one CPU"}, {"t": 59.92, "title": "Step 16", "text": "and two gigabytes of memory."}, {"t": 62.26, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 64.11, "title": "Boot image", "text": "pick the openSUSE Leap image for the root disk. The root disk stays on Longhorn."}, {"t": 70.25, "title": "Add a NetApp volume", "text": "Then select Add Volume for a data disk."}, {"t": 73.57, "title": "NetApp storage class", "text": "Set its storage class to netapp-iscsi,"}, {"t": 77.51, "title": "Size", "text": "and its size to one gigabyte."}, {"t": 79.82, "title": "Create", "text": "Select Create."}, {"t": 83.72, "title": "Running", "text": "Trident creates the volume on ONTAP, and the virtual machine is running."}, {"t": 87.71, "title": "Open the virtual machine", "text": "Open the virtual machine,"}, {"t": 90.14, "title": "Volumes tab", "text": "and its Volumes tab."}, {"t": 93.21, "title": "Disk on NetApp", "text": "The one gigabyte data disk comes from netapp-iscsi, a LUN on the NetApp storage system."}, {"t": 99.97, "title": "Volume actions", "text": "Now grow the NetApp disk while the virtual machine runs. On the Volumes page, open its action menu,"}, {"t": 105.96, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 108.59, "title": "New size", "text": "Change the size to two gigabytes."}, {"t": 111.17, "title": "Save", "text": "Select Save. Trident grows the LUN on ONTAP, and the virtual machine keeps running."}, {"t": 118.2, "title": "2 GiB", "text": "The NetApp volume now shows two gigabytes."}, {"t": 121.97, "title": "Still running", "text": "On the Virtual Machines page, demo-netapp is still running. The disk grew without a restart."}, {"t": 129.01, "title": "Wrap-up", "text": "The NetApp volume grew while the virtual machine kept running. Next, you fail over virtual machines to another cluster with harvey."}], "recorded": "2026-11-13 19:25", "version": "SUSE Virtualization v1.10", "video": "v/40-netapp-trident/video.mp4?v=1794630879", "poster": "v/40-netapp-trident/poster.jpg?v=1794630879", "vtt": "v/40-netapp-trident/captions.vtt?v=1794630879", "num": 46}, {"id": "41-kasten-backup-restore", "title": "Back up and restore a virtual machine with Veeam Kasten", "category": "Ecosystem", "order": 41, "summary": "Use Veeam Kasten, a partner backup product running on the cluster, to back up a virtual machine to S3 and restore it after it is deleted.", "level": "intermediate", "cluster": "kasten-harvester-ai", "prereqs": ["04-create-vm"], "intro": "In this video, you back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted.", "duration": 145.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted."}, {"t": 11.69, "title": "Step 1", "text": ""}, {"t": 13.34, "title": "Kasten sees the VM", "text": "Veeam Kasten runs on the cluster. Its Virtual Machines page lists demo-k10, a running SUSE Virtualization virtual machine."}, {"t": 22.67, "title": "Namespace as application", "text": "Kasten protects applications by namespace. The virtual machine has its own namespace, demo-k10, which is unmanaged so far."}, {"t": 30.53, "title": "Create a policy", "text": "Open its options menu,"}, {"t": 32.99, "title": "Create a policy", "text": "and select Create a Policy."}, {"t": 35.88, "title": "Policy name", "text": "The form fills in the policy name, demo-k10-backup, and the Snapshot action."}, {"t": 40.67, "title": "On demand", "text": "For this demo, set the backup frequency to On Demand. In production, you pick a schedule such as Daily."}, {"t": 47.05, "title": "Enable exports", "text": "Turn on Backups via Snapshot Exports. A snapshot alone stays on the cluster; the export copies it to object storage."}, {"t": 56.51, "title": "Location profile", "text": "Open the export location profile list,"}, {"t": 59.9, "title": "Location profile", "text": "and choose demo-s3, a location profile for an S3 bucket that was configured earlier."}, {"t": 65.87, "title": "Selected namespace", "text": "The demo-k10 namespace is already selected, with all of its resources, including the virtual machine and its disk."}, {"t": 72.33, "title": "Submit", "text": "Select Submit."}, {"t": 75.25, "title": "Run the policy", "text": "The policy is valid. Open its actions,"}, {"t": 79.04, "title": "Run Once", "text": "and select Run Once."}, {"t": 82.1, "title": "Confirm the run", "text": "Confirm. Kasten snapshots the disk, then exports the snapshot and the virtual machine definition to the bucket."}, {"t": 91.53, "title": "Exported restore point", "text": "In Restore Points, the run created a restore point exported to the demo-s3 profile."}, {"t": 96.79, "title": "Delete the VM", "text": "Now simulate a loss. In SUSE Virtualization, open the actions of demo-k10,"}, {"t": 103.61, "title": "Delete the VM", "text": "and select Delete."}, {"t": 105.97, "title": "Delete with its disk", "text": "The disk volume is selected too. Select Delete."}, {"t": 111.11, "title": "Restore", "text": "Back in Kasten, open the actions of the exported restore point,"}, {"t": 115.39, "title": "Restore", "text": "and select Restore."}, {"t": 118.07, "title": "Target namespace", "text": "Keep the original namespace, demo-k10. Kasten restores every artifact, including the volume and the virtual machine."}, {"t": 125.73, "title": "Start the restore", "text": "Select Restore,"}, {"t": 128.2, "title": "Confirm the restore", "text": "and confirm."}, {"t": 131.44, "title": "VM restored", "text": "In SUSE Virtualization, demo-k10 is running again, with its disk restored from the bucket."}, {"t": 138.44, "title": "Wrap-up", "text": "The virtual machine is back, restored from the exported backup. Next, you use NetApp storage with Trident."}], "recorded": "2026-11-13 17:09", "version": "SUSE Virtualization v1.10", "video": "v/41-kasten-backup-restore/video.mp4?v=1794630899", "poster": "v/41-kasten-backup-restore/poster.jpg?v=1794630899", "vtt": "v/41-kasten-backup-restore/captions.vtt?v=1794630899", "num": 47}, {"id": "43-cloudcasa", "title": "Protect VMs with CloudCasa", "category": "Ecosystem", "order": 43, "summary": "Back up SUSE Virtualization VMs with CloudCasa and restore them.", "level": "intermediate", "cluster": "harvester-ai", "prereqs": ["04-create-vm"], "intro": "In this video, you back up a SUSE Virtualization virtual machine with CloudCasa, a backup service, and restore it after it is deleted.", "duration": 201.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you back up a SUSE Virtualization virtual machine with CloudCasa, a backup service, and restore it after it is deleted."}, {"t": 9.37, "title": "The VM to protect", "text": "On the Virtual Machines page, demo-cc is running in its own namespace, also named demo-cc."}, {"t": 15.98, "title": "CloudCasa console", "text": "Open the CloudCasa console. CloudCasa by Catalogic is a backup service for Kubernetes and its virtual machines."}, {"t": 23.73, "title": "Sign in", "text": "Sign in with your CloudCasa account."}, {"t": 26.39, "title": "Sign in", "text": ""}, {"t": 28.04, "title": "Sign in", "text": ""}, {"t": 31.74, "title": "Find the VM", "text": "The VMs page lists the virtual machines of every connected cluster. Filter for demo-cc."}, {"t": 38.6, "title": "Registered cluster", "text": "Its cluster, harvester-ai, was registered earlier as demo-harvester-ai, and the CloudCasa agent runs on it."}, {"t": 45.27, "title": "Define a backup", "text": "Point to the actions of demo-cc, then select Define backup."}, {"t": 50.38, "title": "Define a backup", "text": ""}, {"t": 52.49, "title": "VM selected", "text": "The backup panel opens with demo-cc already selected."}, {"t": 56.0, "title": "Copy to backup storage", "text": "Keep Copy to backup storage. CloudCasa snapshots the disk first, then copies its data off the cluster."}, {"t": 62.78, "title": "Destination storage", "text": "Open Advanced options to choose where the copy goes,"}, {"t": 66.68, "title": "CloudCasa storage", "text": "and choose CloudCasa storage, which the service provides, so you need no bucket of your own."}, {"t": 72.28, "title": "Provider and region", "text": "Then pick a provider and a region for the stored copy."}, {"t": 75.78, "title": "Provider and region", "text": ""}, {"t": 77.42, "title": "Provider and region", "text": ""}, {"t": 79.48, "title": "Provider and region", "text": ""}, {"t": 81.13, "title": "Next", "text": "Select Next to go to the policy step."}, {"t": 85.28, "title": "No policy", "text": "Keep the policy at None, so the backup runs once, on demand. A policy would run it on a schedule."}, {"t": 91.15, "title": "Next", "text": "Select Next again to reach the summary."}, {"t": 94.23, "title": "Name and retention", "text": "In the summary, name the backup demo-cc-backup,"}, {"t": 98.53, "title": "Name and retention", "text": "and keep it for one day. Run now is on."}, {"t": 101.64, "title": "Run the backup", "text": "Select Create and Run to start the backup now."}, {"t": 106.38, "title": "Step 27", "text": ""}, {"t": 108.48, "title": "Recovery point", "text": "When the job finishes, Recovery points lists a copy of demo-cc on demo-harvester-ai, kept for one day."}, {"t": 115.41, "title": "Delete the VM", "text": "Now simulate a loss. Back on the Virtual Machines page, open the actions of demo-cc,"}, {"t": 121.89, "title": "Delete the VM", "text": "and select Delete from the menu."}, {"t": 125.0, "title": "Delete with its disk", "text": "The disk volume is selected too. Select Delete."}, {"t": 130.04, "title": "Restore", "text": "Back in CloudCasa, point to the actions of the recovery point and select Restore."}, {"t": 135.76, "title": "Restore", "text": ""}, {"t": 137.84, "title": "VM to restore", "text": "The restore wizard includes demo-cc from the recovery point."}, {"t": 141.11, "title": "Destination", "text": "Select Next to choose the destination."}, {"t": 145.48, "title": "Destination", "text": "The destination is the original cluster, demo-harvester-ai."}, {"t": 149.71, "title": "Restore transforms", "text": "Select Next to see the restore transforms."}, {"t": 153.58, "title": "Restore transforms", "text": "Leave the namespace unchanged, so the virtual machine returns to demo-cc."}, {"t": 158.17, "title": "VM options", "text": "Then open VM options to check how the virtual machine starts."}, {"t": 162.25, "title": "Run strategy", "text": "The run strategy is Halted by default, which would leave it stopped. Open the list,"}, {"t": 167.87, "title": "Run strategy", "text": "and choose Use strategy from backup, so demo-cc starts again as it ran before."}, {"t": 172.55, "title": "Summary", "text": "Select Next to reach the summary."}, {"t": 176.08, "title": "Name the restore", "text": "Name the restore demo-cc-restore. Run now is on."}, {"t": 180.35, "title": "Start the restore", "text": "Select Save and Restore to start the restore job."}, {"t": 185.32, "title": "VM restored", "text": "When the restore job finishes, demo-cc is running again on the Virtual Machines page, with its disk restored from CloudCasa."}, {"t": 193.76, "title": "Wrap-up", "text": "The virtual machine is back, restored from CloudCasa storage. Next, you use NetApp storage with Trident."}], "recorded": "2026-11-14 00:20", "version": "SUSE Virtualization v1.10", "video": "v/43-cloudcasa/video.mp4?v=1794633713", "poster": "v/43-cloudcasa/poster.jpg?v=1794633713", "vtt": "v/43-cloudcasa/captions.vtt?v=1794633713", "num": 48}, {"id": "47-kasm-workspaces", "title": "Stream desktops and browsers with Kasm Workspaces", "category": "Ecosystem", "order": 47, "summary": "See how Kasm Workspaces runs on SUSE Virtualization, then log in and open a terminal and a browser session.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "In this video, you see how Kasm Workspaces runs on SUSE Virtualization virtual machines, then log in and stream a terminal and a browser.", "duration": 145.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you see how Kasm Workspaces runs on SUSE Virtualization virtual machines, then log in and stream a terminal and a browser."}, {"t": 9.22, "title": "Kasm virtual machines", "text": "Kasm is already installed on this cluster. On the Virtual Machines page, filter for kasm to see the virtual machines it uses."}, {"t": 16.82, "title": "Control plane VM", "text": "The control plane is one Ubuntu virtual machine named kasm. It runs the Kasm database, API, manager and proxy."}, {"t": 25.32, "title": "Autoscaled agents", "text": "The kasm-dynamic-agent virtual machines in the kasm-autoscale namespace were not created by hand. Kasm creates and deletes them through its Harvester provider."}, {"t": 35.44, "title": "Install with cloud-init", "text": "To see how the control plane was installed, open the Advanced Options of the kasm virtual machine."}, {"t": 41.41, "title": "Step 6", "text": "Its cloud-init user data downloads Kasm 1.19 and runs the single-server installer. The passwords on the installer line are blurred."}, {"t": 49.98, "title": "Agent disk image", "text": "New agents are cloned from images in the kasm-autoscale namespace, like this Linux agent image with the workspaces already pulled."}, {"t": 58.08, "title": "Log in to Kasm", "text": "Now open the Kasm portal and log in as the demo user."}, {"t": 61.9, "title": "Step 11", "text": "The password is typed into the masked field, then you select Login."}, {"t": 65.77, "title": "Step 12", "text": ""}, {"t": 67.81, "title": "Workspaces", "text": "The dashboard lists the workspaces this user may start: browsers, Linux desktops, a terminal and Windows Server."}, {"t": 74.53, "title": "Terminal session", "text": "Select the Terminal workspace to open its launch dialog."}, {"t": 78.37, "title": "Step 15", "text": "Then select Launch Session. Kasm starts a container on a Linux agent virtual machine."}, {"t": 86.91, "title": "Step 17", "text": "The terminal streams into the browser tab. Check the kernel, the CPUs and the memory that the session sees."}, {"t": 94.65, "title": "End the session", "text": "When you are done, open the Kasm control panel on the left edge,"}, {"t": 98.64, "title": "Step 19", "text": "select Delete Session, and confirm that you want to delete it."}, {"t": 103.07, "title": "Step 20", "text": ""}, {"t": 105.11, "title": "Browser session", "text": "Next, select the Chrome workspace and launch an isolated browser."}, {"t": 109.82, "title": "Step 22", "text": ""}, {"t": 113.11, "title": "Step 23", "text": "Chrome runs in a container on the Linux agent. Select the Web Store shortcut on the new tab page."}, {"t": 119.1, "title": "Step 24", "text": "The page loads inside the session, so nothing from the website runs on your own computer."}, {"t": 127.1, "title": "Step 25", "text": "Delete this session too when you finish, so its resources go back to the pool."}, {"t": 131.9, "title": "Step 26", "text": ""}, {"t": 133.99, "title": "Step 27", "text": ""}, {"t": 137.34, "title": "Wrap-up", "text": "Kasm streams each workspace from virtual machines on the cluster, and adds or removes agent virtual machines as demand changes."}], "recorded": "2026-11-14 03:31", "version": "SUSE Virtualization v1.10", "video": null, "poster": null, "vtt": null, "num": 49}, {"id": "48-servicenow-inventory", "title": "See your VM inventory in ServiceNow", "category": "Ecosystem", "order": 48, "summary": "Find SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory in an everyday IT workflow.", "level": "intermediate", "cluster": "servicenow-pdi", "prereqs": [], "intro": "In this video, you find your SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory to reclaim storage and give incidents real context.", "duration": 103.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find your SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory to reclaim storage and give incidents real context."}, {"t": 12.29, "title": "The VM inventory", "text": "Virtual Machine Instances lists every VM from your clusters. A script syncs it; the ServiceNow Kubernetes Visibility Agent is the supported path."}, {"t": 20.71, "title": "Grouped by power state", "text": "Grouped by state, the list shows thirty-eight stopped VMs and seventeen running ones."}, {"t": 26.44, "title": "The stopped VMs", "text": "The stopped group lists each VM with its CPUs, memory, disks, and disk size, straight from the cluster."}, {"t": 32.98, "title": "Disk by power state", "text": "This report sums disk size by power state. Stopped VMs hold one thousand five hundred eighty-seven gigabytes, running VMs only six hundred forty-one."}, {"t": 43.32, "title": "Reclaim storage", "text": "This report ranks the stopped VMs that hold the most storage, a short list to review with their owners before you reclaim space."}, {"t": 52.82, "title": "VMs by guest OS", "text": "VMs by guest OS helps with patching and licensing. Empty means the VM runs no guest agent, so its operating system is unknown."}, {"t": 63.65, "title": "One VM and its host", "text": "The form for the VM sqlfci-n1 shows its Runs on relation, the host that runs it right now."}, {"t": 70.52, "title": "Incident context", "text": "The Tasks list ties an open incident to this VM, so the service desk sees the affected VM and its host at once."}, {"t": 78.33, "title": "Dependency map", "text": "The dependency map draws the same chain, from the VM down to its host, and flags the open incident with a warning icon."}, {"t": 86.2, "title": "Labels as tags", "text": "The tags carry the labels from the cluster, such as operating system, namespace, KubeVirt status, cluster, and node."}, {"t": 95.29, "title": "Wrap-up", "text": "The same inventory now drives storage cleanup, reports, and incident triage, without anyone typing VM records by hand."}], "recorded": "2026-11-14 01:59", "version": "SUSE Virtualization v1.10", "video": "v/48-servicenow-inventory/video.mp4?v=1794640215", "poster": "v/48-servicenow-inventory/poster.jpg?v=1794639596", "vtt": "v/48-servicenow-inventory/captions.vtt?v=1794639596", "num": 50}, {"id": "80-kubeovn-vpc-peering-dhcp", "title": "Connect VPCs with peering and DHCP", "category": "Kube-OVN", "order": 80, "summary": "Create two Kube-OVN VPCs with DHCP-enabled subnets, peer them, and show VMs reaching each other across the peering.", "level": "advanced", "cluster": "far-edge", "prereqs": ["35-kubeovn-vpc-nat-gateway"], "intro": "In this video, you create two virtual private clouds with DHCP-enabled subnets on SUSE Virtualization, peer them, and show that virtual machines in each VPC reach each other.", "duration": 263.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create two virtual private clouds with DHCP-enabled subnets on SUSE Virtualization, peer them, and show that virtual machines in each VPC reach each other."}, {"t": 11.9, "title": "Create the first VPC", "text": "The Virtual Private Cloud page lists the VPCs and their subnets. Select Create to add the first VPC."}, {"t": 18.89, "title": "Name", "text": "Name it demo-vpc-a. Routes and peerings come later, so leave the tabs empty for now."}, {"t": 24.84, "title": "Save", "text": "Then select Create to save the VPC."}, {"t": 28.06, "title": "Subnet in VPC A", "text": "In the demo-vpc-a group, select Create Subnet."}, {"t": 32.75, "title": "Name", "text": "Name the subnet demo-subnet-a."}, {"t": 35.53, "title": "CIDR block", "text": "Use the CIDR block 10.210.1.0/24."}, {"t": 40.41, "title": "Provider", "text": "As the provider, select the overlay network demo-net-a. The VPC is already set to demo-vpc-a."}, {"t": 48.51, "title": "Gateway IP", "text": "Set the gateway IP to 10.210.1.1."}, {"t": 52.66, "title": "DHCP", "text": "Enable DHCP, so that virtual machines on this subnet get an address and a default route automatically."}, {"t": 59.16, "title": "Save", "text": "Select Create to save the subnet."}, {"t": 62.42, "title": "Create the second VPC", "text": "Now create the second VPC, which points its peering at the first one."}, {"t": 67.34, "title": "Name", "text": "Name it demo-vpc-b."}, {"t": 69.84, "title": "VPC Peerings", "text": "Open the VPC Peerings tab and add a peering."}, {"t": 72.99, "title": "Step 14", "text": "Each side of a peering gets a connect address from a small link network."}, {"t": 76.61, "title": "Local connect IP", "text": "Enter the local connect IP, 169.254.210.2/30, for demo-vpc-b's end of the link."}, {"t": 83.6, "title": "Remote VPC", "text": "As the remote VPC, select demo-vpc-a."}, {"t": 87.68, "title": "Static route", "text": "The peering alone carries no traffic. On the Static Routes tab, add a route to the other VPC."}, {"t": 93.32, "title": "Step 18", "text": "The route sends traffic for demo-subnet-a across the link."}, {"t": 97.19, "title": "Destination", "text": "Enter the destination, demo-subnet-a's CIDR block, 10.210.1.0/24,"}, {"t": 103.29, "title": "Next hop", "text": "and the next hop, 169.254.210.1, which is demo-vpc-a's end of the peering."}, {"t": 110.32, "title": "Save", "text": "Select Create to save demo-vpc-b with its peering and route."}, {"t": 114.86, "title": "Subnet in VPC B", "text": "Add a subnet to demo-vpc-b the same way. Select Create Subnet in its group."}, {"t": 120.63, "title": "Name", "text": "Name it demo-subnet-b,"}, {"t": 123.41, "title": "CIDR block", "text": "with the CIDR block 10.210.2.0/24,"}, {"t": 127.96, "title": "Provider", "text": "the overlay network demo-net-b as the provider,"}, {"t": 131.87, "title": "Gateway IP", "text": "and the gateway IP 10.210.2.1."}, {"t": 135.74, "title": "DHCP", "text": "Enable DHCP here as well, then save."}, {"t": 139.24, "title": "Save", "text": "Select Create to save demo-subnet-b."}, {"t": 142.85, "title": "Edit the first VPC", "text": "A peering needs both sides. Open the action menu of demo-vpc-a,"}, {"t": 148.47, "title": "Step 30", "text": "and select Edit Config to add the matching peering."}, {"t": 152.61, "title": "Peer with VPC B", "text": "On the VPC Peerings tab, add the other end of the link."}, {"t": 156.57, "title": "Step 32", "text": "This side uses the first address of the same link network."}, {"t": 160.01, "title": "Local connect IP", "text": "Enter 169.254.210.1/30 as the local connect IP,"}, {"t": 165.17, "title": "Remote VPC", "text": "and select demo-vpc-b as the remote VPC."}, {"t": 169.23, "title": "Route to VPC B", "text": "Then add the route back on the Static Routes tab."}, {"t": 172.34, "title": "Step 36", "text": "This route sends traffic for demo-subnet-b across the link."}, {"t": 176.16, "title": "Destination", "text": "The destination is 10.210.2.0/24,"}, {"t": 180.55, "title": "Next hop", "text": "and the next hop is demo-vpc-b's connect IP, 169.254.210.2."}, {"t": 186.61, "title": "Save", "text": "Select Save to apply the peering and the route."}, {"t": 192.56, "title": "One VM per VPC", "text": "To test the peering, two small virtual machines were attached, demo-vm-a to demo-net-a and demo-vm-b to demo-net-b."}, {"t": 200.7, "title": "Addresses from DHCP", "text": "demo-vm-a got 10.210.1.2 from demo-subnet-a's DHCP service,"}, {"t": 205.97, "title": "Step 43", "text": "and demo-vm-b got 10.210.2.2 from demo-subnet-b. Nobody configured either address by hand."}, {"t": 212.04, "title": "Console of VM A", "text": "Open the console of demo-vm-a in WebVNC."}, {"t": 215.91, "title": "Step 45", "text": ""}, {"t": 219.0, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 222.62, "title": "Step 47", "text": ""}, {"t": 225.23, "title": "DHCP lease", "text": "The address and the default route through 10.210.1.1 both came from DHCP."}, {"t": 232.69, "title": "Ping across the peering", "text": "Now ping demo-vm-b, 10.210.2.2, in the other VPC."}, {"t": 243.36, "title": "VPCs connected", "text": "The replies arrive. Traffic leaves through demo-vpc-a's router, crosses the peering, and reaches demo-vpc-b."}, {"t": 252.84, "title": "Wrap-up", "text": "The two VPCs stay isolated from everything else, but their subnets now reach each other through the peering. Next, you isolate virtual machines with microsegmentation."}], "recorded": "2026-11-14 00:56", "version": "SUSE Virtualization v1.10", "video": "v/80-kubeovn-vpc-peering-dhcp/video.mp4?v=1794635973", "poster": "v/80-kubeovn-vpc-peering-dhcp/poster.jpg?v=1794635973", "vtt": "v/80-kubeovn-vpc-peering-dhcp/captions.vtt?v=1794635973", "num": 51}, {"id": "81-kubeovn-microsegmentation", "title": "Isolate VMs with microsegmentation", "category": "Kube-OVN", "order": 81, "summary": "Apply a policy that blocks traffic between two VMs except for one port, and show what gets through and what is dropped.", "level": "advanced", "cluster": "far-edge", "prereqs": ["80-kubeovn-vpc-peering-dhcp"], "intro": "In this video, you add access control rules to a Kube-OVN subnet on SUSE Virtualization, so that one virtual machine reaches another only on a single port.", "duration": 165.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you add access control rules to a Kube-OVN subnet on SUSE Virtualization, so that one virtual machine reaches another only on a single port."}, {"t": 9.37, "title": "Two VMs on one subnet", "text": "demo-web, at 10.220.0.10, serves a small web page on ports 80 and 8080."}, {"t": 15.32, "title": "Step 2", "text": "demo-client, at 10.220.0.20, sits on the same overlay subnet, demo-seg-subnet. No rule limits traffic between them yet."}, {"t": 23.87, "title": "Before the rules", "text": "Open the console of demo-client in WebVNC to test the connection first."}, {"t": 29.26, "title": "Step 4", "text": ""}, {"t": 32.05, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 35.67, "title": "Step 6", "text": ""}, {"t": 38.28, "title": "Everything gets through", "text": "Without rules, both ping and the web page on port 8080 answer."}, {"t": 46.45, "title": "Edit the subnet", "text": "On the Virtual Private Cloud page, open the action menu of demo-seg-subnet,"}, {"t": 51.88, "title": "Step 10", "text": "and select Edit Config to change the subnet."}, {"t": 55.34, "title": "Access Control List", "text": "The Access Control List tab holds OVN rules that the subnet's virtual switch applies to every port."}, {"t": 61.18, "title": "Allow port 80", "text": "Add the first rule, which lets web traffic through."}, {"t": 64.03, "title": "Step 13", "text": "Choose the action Allow-related, so that the replies come back too,"}, {"t": 69.17, "title": "Step 14", "text": "and the direction To-lport, for traffic going to a virtual machine's port."}, {"t": 74.59, "title": "Step 15", "text": "Give it priority 1010. Higher priorities win."}, {"t": 78.66, "title": "Match", "text": "The match selects traffic from demo-client to demo-web on TCP port 80."}, {"t": 82.96, "title": "Drop the rest", "text": "Add a second rule that drops everything else between the two machines."}, {"t": 87.03, "title": "Step 18", "text": "Choose the action Drop,"}, {"t": 90.77, "title": "Step 19", "text": "the same direction, To-lport,"}, {"t": 94.26, "title": "Step 20", "text": "and the lower priority 1000, so the port 80 rule is checked first."}, {"t": 98.12, "title": "Match", "text": "This match covers all traffic from demo-client to demo-web, any protocol, any port."}, {"t": 104.43, "title": "Save", "text": "Select Save. The rules apply right away, with no restart of either machine."}, {"t": 110.14, "title": "Test again", "text": "Go back to Virtual Machines and open the console of demo-client again."}, {"t": 114.96, "title": "Step 24", "text": ""}, {"t": 117.0, "title": "Step 25", "text": ""}, {"t": 119.75, "title": "Ping is dropped", "text": "The session is still logged in. Ping demo-web again."}, {"t": 126.86, "title": "Step 27", "text": "All three packets are lost. The drop rule matches ICMP."}, {"t": 130.84, "title": "Port 80 gets through", "text": "Now request the web page on port 80."}, {"t": 134.83, "title": "Step 29", "text": "The page arrives. The higher-priority allow rule lets port 80 through, and its replies come back."}, {"t": 140.97, "title": "Port 8080 is dropped", "text": "Finally, try port 8080, which answered before the rules."}, {"t": 148.55, "title": "Only port 80 passes", "text": "The connection times out. Only port 80 passes between the two machines; everything else is dropped."}, {"t": 157.48, "title": "Wrap-up", "text": "The subnet's access control list now drops everything from demo-client to demo-web except web traffic on port 80."}], "recorded": "2026-11-14 01:18", "version": "SUSE Virtualization v1.10", "video": "v/81-kubeovn-microsegmentation/video.mp4?v=1794637154", "poster": "v/81-kubeovn-microsegmentation/poster.jpg?v=1794637154", "vtt": "v/81-kubeovn-microsegmentation/captions.vtt?v=1794637154", "num": 52}, {"id": "50-observability-overview", "title": "SUSE Virtualization in SUSE Observability", "category": "Observability", "order": 50, "summary": "Review cluster health, versions, topology, and events of your SUSE Virtualization clusters in SUSE Observability.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["34-suse-observability"], "intro": "In this video, you review what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place.", "duration": 94.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place."}, {"t": 10.78, "title": "Clusters overview", "text": "The SUSE Virtualization Clusters view lists every cluster that reports to SUSE Observability, one row per cluster."}, {"t": 19.63, "title": "Cluster health", "text": "The Health column rolls up the monitors of each cluster. A cluster with an unhealthy monitor shows Deviating."}, {"t": 27.54, "title": "Versions and capacity", "text": "The columns show the SUSE Virtualization version, hosts, running VMs, KubeVirt and Longhorn versions, and etcd and clock checks."}, {"t": 37.65, "title": "Topology", "text": "Select Topology to see the clusters as components on a map."}, {"t": 42.84, "title": "Cluster topology", "text": "Each tile is a cluster, colored by its health state, so an unhealthy cluster stands out at a glance."}, {"t": 50.13, "title": "Events", "text": "Select Events to list what happened to these clusters in the selected time range."}, {"t": 56.21, "title": "Health changes", "text": "Each event names the cluster, shows the change, such as a health state transition, and when it happened."}, {"t": 63.3, "title": "Time range", "text": "The time range at the bottom applies to every perspective. Move it back to see the clusters as they were."}, {"t": 70.49, "title": "Main menu", "text": "Open the main menu."}, {"t": 73.3, "title": "SUSE Virtualization views", "text": "Expand SUSE Virtualization."}, {"t": 76.73, "title": "Views per resource", "text": "Besides Clusters, this section has views for hosts, virtual machines, volumes, VM networks, and VPCs."}, {"t": 86.66, "title": "Wrap-up", "text": "You reviewed your clusters in SUSE Observability. Next, you explore the topology of a single virtual machine."}], "recorded": "2026-11-13 12:31", "version": "SUSE Virtualization v1.10", "video": "v/50-observability-overview/video.mp4?v=1794630921", "poster": "v/50-observability-overview/poster.jpg?v=1794630921", "vtt": "v/50-observability-overview/captions.vtt?v=1794630921", "num": 53}, {"id": "51-vm-topology", "title": "Explore virtual machine topology", "category": "Observability", "order": 51, "summary": "Open a virtual machine in SUSE Observability and follow its relations to the host, volumes, and VM network.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["50-observability-overview"], "intro": "In this video, you open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective.", "duration": 88.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective."}, {"t": 10.26, "title": "Main menu", "text": "Open the main menu."}, {"t": 12.92, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 16.34, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 19.39, "title": "Open a VM", "text": "The view lists the VMs of every connected cluster. Open the VM named kasm, which runs on the far-edge cluster."}, {"t": 29.27, "title": "VM properties", "text": "Highlights opens first. The About card shows the VM's status, host, IP address, vCPUs, memory, and guest operating system."}, {"t": 40.04, "title": "Related resources", "text": "Related resources lists what the VM uses, such as its VM network, its disks, the Longhorn volume, and the virt-launcher pod."}, {"t": 49.83, "title": "Topology", "text": "Select Topology to draw these relations as a map."}, {"t": 54.35, "title": "VM topology", "text": "The VM sits in the Selection row. Its outgoing relations point to its VM network, its host, and its persistent volume claim."}, {"t": 64.33, "title": "Health on the map", "text": "Each component is colored by its health, so a problem in the storage or on the host shows next to the VM."}, {"t": 72.65, "title": "Guest cluster nodes", "text": "A VM that Rancher creates for a guest cluster is also a Kubernetes node, so its map shows the pods inside."}, {"t": 79.27, "title": "Wrap-up", "text": "Each virtual machine is a component with relations to its host, storage, and network. Next, you investigate an unhealthy virtual machine."}], "recorded": "2026-11-13 12:34", "version": "SUSE Virtualization v1.10", "video": "v/51-vm-topology/video.mp4?v=1794630930", "poster": "v/51-vm-topology/poster.jpg?v=1794630930", "vtt": "v/51-vm-topology/captions.vtt?v=1794630930", "num": 54}, {"id": "52-vm-health-monitor", "title": "Investigate an unhealthy virtual machine", "category": "Observability", "order": 52, "summary": "Find a Deviating virtual machine in SUSE Observability, check its metrics, and open the monitor and remediation guide behind its health state.", "level": "intermediate", "cluster": "suse-observability", "prereqs": ["51-vm-topology"], "intro": "In this video, you find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state.", "duration": 107.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state."}, {"t": 10.02, "title": "Main menu", "text": "Open the main menu."}, {"t": 12.73, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 16.12, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 19.28, "title": "A Deviating VM", "text": "This VM shows Deviating. It runs on a host of the harvester-north cluster."}, {"t": 25.63, "title": "Usage metrics", "text": "To the right, the CPU Usage, Memory Usage, and Disk Usage columns show current metrics for each VM."}, {"t": 33.33, "title": "Open the VM", "text": "Open the Deviating VM."}, {"t": 36.98, "title": "Unhealthy monitor", "text": "On the Highlights page, the Monitors card shows which check failed. Here, it is VM disk filling up."}, {"t": 44.41, "title": "Metrics", "text": "Before you open the monitor, select Metrics to see the VM's charts."}, {"t": 50.15, "title": "Guest filesystems", "text": "Guest shows filesystem usage inside the VM, from the QEMU guest agent. Other groups cover network, storage, memory, and CPU."}, {"t": 60.72, "title": "Back to Highlights", "text": "Return to Highlights."}, {"t": 63.62, "title": "Open the monitor", "text": "Select the VM disk filling up monitor."}, {"t": 68.7, "title": "What the monitor checks", "text": "The panel explains the check. It fires when the fullest writable filesystem in the VM is more than eighty percent used."}, {"t": 77.57, "title": "Triggering evidence", "text": "The triggering evidence plots that metric against its threshold. The health state shows Deviating since the trigger time."}, {"t": 85.9, "title": "Remediation guide", "text": "Below, the monitor links a remediation guide with suggested next steps. Review them against your own environment before you act."}, {"t": 96.18, "title": "Close the panel", "text": "Close the panel when you are done."}, {"t": 100.34, "title": "Wrap-up", "text": "You traced an unhealthy virtual machine to the monitor behind its state. Next, you right-size virtual machines."}], "recorded": "2026-11-13 12:37", "version": "SUSE Virtualization v1.10", "video": "v/52-vm-health-monitor/video.mp4?v=1794630944", "poster": "v/52-vm-health-monitor/poster.jpg?v=1794630944", "vtt": "v/52-vm-health-monitor/captions.vtt?v=1794630944", "num": 55}, {"id": "53-vm-rightsizing", "title": "Right-size virtual machines", "category": "Observability", "order": 53, "summary": "Use the VM right-sizing dashboard in SUSE Observability to find oversized, undersized, and idle virtual machines and what they cost.", "level": "intermediate", "cluster": "suse-observability", "prereqs": ["52-vm-health-monitor"], "intro": "In this video, you use the VM right-sizing dashboard in SUSE Observability to find virtual machines that are oversized, undersized, or idle.", "duration": 97.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use the VM right-sizing dashboard in SUSE Observability to find virtual machines that are oversized, undersized, or idle."}, {"t": 11.66, "title": "VM right-sizing", "text": "This dashboard compares the vCPUs and memory each VM is allocated with what it uses, and what the difference costs."}, {"t": 21.21, "title": "Filters", "text": "The Cluster and VM filters scope every panel. Here, it covers all VMs of the harvester-north cluster."}, {"t": 29.83, "title": "Savings", "text": "The Savings row estimates the monthly saving from right-sizing running VMs and from removing idle and stopped ones."}, {"t": 38.66, "title": "Scroll down", "text": "Scroll down for the numbers behind the savings."}, {"t": 42.28, "title": "Step 6", "text": ""}, {"t": 44.28, "title": "What to give back", "text": "The dashboard counts the vCPUs and memory to give back, and the VMs that are undersized, idle, or stopped."}, {"t": 53.2, "title": "Days of data", "text": "Days of data shows how long the measurements cover. Less than a week can miss weekly peaks."}, {"t": 59.66, "title": "What to change", "text": "Per VM, you see allocated and recommended vCPUs and what to give back, with memory below."}, {"t": 67.24, "title": "Per VM evidence", "text": "Scroll further down."}, {"t": 69.47, "title": "Step 11", "text": ""}, {"t": 71.42, "title": "Evidence", "text": "The evidence panels show the measurements behind each recommendation, such as CPU at the ninety-fifth percentile."}, {"t": 79.65, "title": "Step 13", "text": ""}, {"t": 81.6, "title": "Utilisation over time", "text": "At the bottom, charts plot utilisation per VM over time against amber and red threshold lines."}, {"t": 90.47, "title": "Wrap-up", "text": "To apply a recommendation, edit the VM's CPU and memory in SUSE Virtualization, then restart the VM."}], "recorded": "2026-11-13 12:42", "version": "SUSE Virtualization v1.10", "video": "v/53-vm-rightsizing/video.mp4?v=1794630956", "poster": "v/53-vm-rightsizing/poster.jpg?v=1794630956", "vtt": "v/53-vm-rightsizing/captions.vtt?v=1794630956", "num": 56}, {"id": "60-gpu-guest-cluster", "title": "Provision a GPU Kubernetes cluster on SUSE Virtualization", "category": "AI Workloads", "order": 60, "summary": "From Rancher, create an RKE2 guest cluster whose worker VMs get NVIDIA GPUs by PCI passthrough.", "level": "advanced", "cluster": "ranchero-dev", "prereqs": ["24-rancher-guest-cluster", "30-gpu-passthrough"], "intro": "In this video, you use Rancher to create an RKE2 cluster on SUSE Virtualization with a GPU worker pool. The pool's machines get an NVIDIA GPU by PCI passthrough, picked in the Rancher 2.16 form.", "duration": 187.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use Rancher to create an RKE2 cluster on SUSE Virtualization with a GPU worker pool. The pool's machines get an NVIDIA GPU by PCI passthrough, picked in the Rancher 2.16 form."}, {"t": 15.01, "title": "Create a cluster", "text": "In Rancher, open Cluster Management and select Create."}, {"t": 19.47, "title": "SUSE Virtualization provider", "text": "Select SUSE Virtualization as the provider."}, {"t": 23.26, "title": "Cloud credential", "text": "Choose the cloud credential for harvester-ai, the SUSE Virtualization cluster with the GPUs."}, {"t": 29.37, "title": "Step 4", "text": ""}, {"t": 31.56, "title": "Cluster name", "text": "Name the cluster demo-ai."}, {"t": 33.88, "title": "Control plane pool", "text": "The first pool runs etcd, the control plane and regular workloads. Give it four CPUs,"}, {"t": 41.1, "title": "Step 7", "text": "and eight gigabytes of memory."}, {"t": 43.37, "title": "Step 8", "text": "Place the virtual machines in the demo namespace,"}, {"t": 47.32, "title": "Step 9", "text": "set the default user of the Ubuntu cloud image,"}, {"t": 51.19, "title": "Step 10", "text": "pick the Ubuntu 24.04 image,"}, {"t": 55.16, "title": "Step 11", "text": "give it a forty gigabyte disk,"}, {"t": 57.46, "title": "Step 12", "text": "and attach it to a VM network that reaches Rancher."}, {"t": 61.32, "title": "Static address", "text": "The DHCP pool of this lab network is full, so each pool gets a fixed address. Select Show Advanced,"}, {"t": 68.38, "title": "Step 14", "text": "and enter cloud-init network data with a static address, gateway and DNS servers for the control plane machine."}, {"t": 76.65, "title": "GPU worker pool", "text": "Add a second machine pool for the GPU workers."}, {"t": 79.63, "title": "Step 16", "text": "Name it gpu and keep one machine."}, {"t": 82.08, "title": "Worker role only", "text": "Rancher gives the new pool only the Worker role. Keep it: GPU workers run workloads, not etcd or the control plane."}, {"t": 89.63, "title": "Step 18", "text": "Give the GPU workers eight CPUs,"}, {"t": 93.15, "title": "Step 19", "text": "twenty-four gigabytes of memory,"}, {"t": 95.5, "title": "Step 20", "text": "and an eighty gigabyte disk for the GPU driver, the inference images and the model files."}, {"t": 100.97, "title": "Step 21", "text": ""}, {"t": 102.65, "title": "PCI device picker", "text": "Under the advanced settings, the PCI Devices picker is new in Rancher 2.16. This recording uses a Rancher 2.16 dashboard build."}, {"t": 112.23, "title": "Step 23", "text": "Add a row."}, {"t": 114.27, "title": "Step 24", "text": "Pick the NVIDIA T400. The host's A2 is reserved by a stopped virtual machine, so the picker does not offer it."}, {"t": 122.34, "title": "Step 25", "text": "Devices in the same IOMMU group must be selected together, so add a second row"}, {"t": 127.71, "title": "Step 26", "text": "for the T400's audio function."}, {"t": 131.11, "title": "Step 27", "text": "The pool copied the network data of the first pool. Give the GPU worker its own address."}, {"t": 139.41, "title": "Kubernetes version", "text": "Under Cluster Configuration, keep the default RKE2 version and the SUSE Virtualization cloud provider."}, {"t": 146.03, "title": "Create", "text": "Select Create."}, {"t": 150.01, "title": "Cluster provisioned", "text": "Rancher created both node virtual machines on harvester-ai, installed RKE2 and joined them. Both machines are Running."}, {"t": 157.4, "title": "Step 34", "text": "The GPU worker has only the worker role."}, {"t": 161.82, "title": "The GPU worker VM", "text": "In SUSE Virtualization, harvester-ai runs both node virtual machines in the demo namespace. Open the GPU worker."}, {"t": 169.61, "title": "Step 38", "text": ""}, {"t": 171.69, "title": "The T400 is attached", "text": "Its device allocation annotation shows the NVIDIA T400 and its audio function, passed through from the host."}, {"t": 179.77, "title": "Wrap-up", "text": "The cluster has a control plane node and a GPU worker that owns the NVIDIA T400. Next, you deploy SUSE AI on it."}], "recorded": "2026-11-14 00:08", "version": "SUSE Virtualization v1.10", "video": "v/60-gpu-guest-cluster/video.mp4?v=1794632947", "poster": "v/60-gpu-guest-cluster/poster.jpg?v=1794632947", "vtt": "v/60-gpu-guest-cluster/captions.vtt?v=1794632947", "num": 57}, {"id": "61-suse-ai-on-harvester", "title": "Deploy SUSE AI on the GPU cluster", "category": "AI Workloads", "order": 61, "summary": "Install SUSE AI on the guest cluster and serve a model with vLLM.", "level": "advanced", "cluster": "ranchero", "prereqs": ["60-gpu-guest-cluster"], "intro": "In this video, you use SUSE AI Factory in Rancher to deploy an AI stack on the GPU cluster: the NVIDIA GPU Operator, vLLM serving a model, and Open WebUI.", "duration": 124.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use SUSE AI Factory in Rancher to deploy an AI stack on the GPU cluster: the NVIDIA GPU Operator, vLLM serving a model, and Open WebUI."}, {"t": 12.0, "title": "SUSE AI Factory", "text": "In Rancher, SUSE AI Factory deploys AI stacks from blueprints. Each blueprint bundles Helm charts with tested values."}, {"t": 19.99, "title": "Step 2", "text": "Show all catalogs, including custom blueprints,"}, {"t": 23.57, "title": "Step 3", "text": "and search for the blueprint prepared for this lab."}, {"t": 26.81, "title": "The blueprint", "text": "It bundles the NVIDIA GPU Operator, vLLM from the SUSE Application Collection serving Qwen 2.5 0.5B Instruct, and Open WebUI."}, {"t": 34.68, "title": "Step 5", "text": "Select Install."}, {"t": 36.99, "title": "Namespace", "text": "Keep the instance name and deploy into the suse-ai namespace."}, {"t": 41.26, "title": "Step 7", "text": ""}, {"t": 43.32, "title": "Target cluster", "text": "Fleet deploys the bundle to the clusters you select. Clear the cluster the wizard preselects,"}, {"t": 48.86, "title": "Step 9", "text": "and select demo-ai, the GPU cluster on SUSE Virtualization."}, {"t": 53.89, "title": "Step 10", "text": ""}, {"t": 56.03, "title": "Component values", "text": "You can override each component's Helm values here. Keep the blueprint defaults."}, {"t": 62.01, "title": "Step 12", "text": ""}, {"t": 64.11, "title": "Review", "text": "Review the plan. The GPU Operator goes to its own namespace, vLLM and Open WebUI to suse-ai, all on demo-ai."}, {"t": 73.46, "title": "Install", "text": "Select Install."}, {"t": 75.37, "title": "Step 15", "text": ""}, {"t": 77.72, "title": "Workload created", "text": "Open Workloads. The new AI workload is listed, and Fleet rolls out the three components to demo-ai."}, {"t": 85.46, "title": "Running", "text": "The GPU Operator set up the NVIDIA driver on the GPU worker, and vLLM downloaded the model and loaded it onto the T400. The workload is Running."}, {"t": 94.82, "title": "Step 19", "text": "Select Open in Rancher to open the suse-ai namespace on demo-ai."}, {"t": 100.47, "title": "Step 20", "text": "Open its Workloads tab."}, {"t": 103.26, "title": "vLLM serves the model", "text": "The vLLM engine for Qwen 2.5 0.5B Instruct is Active, with the image from the SUSE Application Collection, next to the router and Open WebUI."}, {"t": 114.53, "title": "Wrap-up", "text": "SUSE AI runs on the guest cluster and vLLM serves the model on the passed-through GPU. Next, you query it and watch its metrics."}], "recorded": "2026-11-14 00:40", "version": "SUSE Virtualization v1.10", "video": "v/61-suse-ai-on-harvester/video.mp4?v=1794634866", "poster": "v/61-suse-ai-on-harvester/poster.jpg?v=1794634866", "vtt": "v/61-suse-ai-on-harvester/captions.vtt?v=1794634866", "num": 58}, {"id": "62-query-and-observe-model", "title": "Query the model and watch GPU metrics", "category": "AI Workloads", "order": 62, "summary": "Send prompts to the served model and follow GPU and vLLM metrics in SUSE Observability.", "level": "advanced", "cluster": "suse-observability", "prereqs": ["61-suse-ai-on-harvester", "50-observability-overview"], "intro": "In this video, you chat with the model that vLLM serves on the GPU cluster, then follow the GPU and vLLM metrics of that work in SUSE Observability.", "duration": 104.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you chat with the model that vLLM serves on the GPU cluster, then follow the GPU and vLLM metrics of that work in SUSE Observability."}, {"t": 10.91, "title": "Step 1", "text": "Open WebUI from the SUSE AI stack greets you with its release notes. Close them."}, {"t": 16.33, "title": "Open WebUI", "text": "Open WebUI runs on demo-ai and talks to the vLLM router. The model it offers is Qwen 2.5 0.5B Instruct."}, {"t": 23.51, "title": "Send a prompt", "text": "Ask the model a question and press Enter."}, {"t": 28.63, "title": "The answer", "text": "vLLM generates the answer on the NVIDIA T400 that SUSE Virtualization passes through to the GPU worker."}, {"t": 36.1, "title": "Step 6", "text": "Send a second, longer prompt to give the GPU more work."}, {"t": 39.96, "title": "Step 8", "text": "The second answer streams in the same way."}, {"t": 48.34, "title": "SUSE Observability", "text": "An OpenTelemetry Collector on demo-ai sends vLLM and GPU metrics to SUSE Observability. Under SUSE AI, the vLLM engine of demo-ai is listed."}, {"t": 58.64, "title": "GPU memory", "text": "In the metrics explorer, query the GPU memory in use that the NVIDIA DCGM exporter reports for demo-ai."}, {"t": 64.99, "title": "Step 14", "text": ""}, {"t": 66.64, "title": "Step 15", "text": ""}, {"t": 68.7, "title": "Step 16", "text": "Narrow the time range to the last fifteen minutes."}, {"t": 72.0, "title": "Step 17", "text": ""}, {"t": 73.74, "title": "Step 18", "text": "vLLM keeps a little over three of the T400's four gigabytes in use, for the model weights and its KV cache."}, {"t": 80.21, "title": "Tokens per second", "text": "Now query vLLM's own metric, the generated tokens per second."}, {"t": 84.36, "title": "Step 20", "text": ""}, {"t": 85.97, "title": "Step 21", "text": ""}, {"t": 87.61, "title": "Step 22", "text": "The token rate rises while the model generates the answers you just sent, and falls back to zero when it is idle."}, {"t": 95.4, "title": "Wrap-up", "text": "The model answers from the passed-through GPU, and SUSE Observability shows the GPU and vLLM metrics. Next, you add a GPU worker."}], "recorded": "2026-11-14 00:51", "version": "SUSE Virtualization v1.10", "video": "v/62-query-and-observe-model/video.mp4?v=1794635496", "poster": "v/62-query-and-observe-model/poster.jpg?v=1794635496", "vtt": "v/62-query-and-observe-model/captions.vtt?v=1794635496", "num": 59}, {"id": "63-scale-gpu-workers", "title": "Add a GPU worker to the AI cluster", "category": "AI Workloads", "order": 63, "summary": "Add a second GPU worker pool to the guest cluster from Rancher and watch the new worker join with its own GPU.", "level": "advanced", "cluster": "ranchero", "prereqs": ["60-gpu-guest-cluster", "61-suse-ai-on-harvester"], "intro": "In this video, you add a GPU worker to the demo-ai cluster from Rancher. The host's second GPU is a different model, so the new worker gets its own machine pool.", "duration": null, "chapters": [], "recorded": null, "version": "SUSE Virtualization v1.10", "video": null, "poster": null, "vtt": null, "num": 60}, {"id": "70-terraform-vm", "title": "Create a virtual machine with Terraform", "category": "Automation", "order": 70, "summary": "Use the Harvester Terraform provider to define an image, a network and a VM as code, apply it, and change it with a plan.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm", "19-vlan-network"], "intro": "In this video, you describe an image, a network and a virtual machine as code with the Harvester Terraform provider, create them in SUSE Virtualization, change the virtual machine with a plan, and remove everything again.", "duration": 136.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you describe an image, a network and a virtual machine as code with the Harvester Terraform provider, create them in SUSE Virtualization, change the virtual machine with a plan, and remove everything again."}, {"t": 14.57, "title": "The provider", "text": "main.tf pins the Harvester provider and points it at a kubeconfig. Here it belongs to an account that can only use the demo namespace."}, {"t": 22.75, "title": "An image", "text": "The first resource is an image. The cluster downloads the openSUSE Leap cloud image from this address."}, {"t": 29.74, "title": "A network", "text": "The second is a VLAN network, VLAN one hundred on the management cluster network, with its subnet and gateway."}, {"t": 36.48, "title": "A virtual machine", "text": "The virtual machine uses both. One CPU, two gigabytes of memory, a ten gigabyte disk from the image, a NIC on the network, and cloud-init user data."}, {"t": 46.62, "title": "terraform init", "text": "terraform init downloads the provider version that main.tf asks for."}, {"t": 52.84, "title": "terraform apply", "text": "terraform apply first computes a plan. Each plus sign is an attribute of a resource that does not exist yet."}, {"t": 58.91, "title": "Three resources created", "text": "The plan adds three resources. Terraform creates the network and the image first, then the virtual machine that needs them."}, {"t": 66.21, "title": "The VM in the UI", "text": "In the UI, demo-tf-vm is running with one CPU and two gigabytes of memory, just as main.tf describes it."}, {"t": 73.34, "title": "The network", "text": "The Virtual Machine Networks page lists demo-tf-net, the VLAN network with VLAN ID one hundred."}, {"t": 79.63, "title": "Change the code", "text": "Now change the code. In main.tf, the CPU count goes from one to two, and the memory from two to four gigabytes."}, {"t": 86.9, "title": "terraform plan", "text": "terraform plan compares the code with the cluster. The tilde marks an in-place update of the virtual machine: CPU and memory."}, {"t": 94.92, "title": "Step 24", "text": "Nothing is added or destroyed. One resource changes."}, {"t": 100.47, "title": "Apply the change", "text": "terraform apply makes the change. Because restart_after_update is set, the provider restarts the virtual machine so the new size takes effect."}, {"t": 108.28, "title": "New size in the UI", "text": "In the UI, the details of demo-tf-vm now show two virtual CPUs and four gigabytes of memory, after the restart."}, {"t": 117.84, "title": "terraform destroy", "text": "When you no longer need it, terraform destroy removes the virtual machine, its disk, the network and the image."}, {"t": 125.85, "title": "Wrap-up", "text": "One file now describes the image, the network and the virtual machine, and Terraform keeps the cluster in line with it. Next, you bootstrap a Linux virtual machine with cloud-init."}], "recorded": "2026-11-14 00:53", "version": "SUSE Virtualization v1.10", "video": "v/70-terraform-vm/video.mp4?v=1794635625", "poster": "v/70-terraform-vm/poster.jpg?v=1794635625", "vtt": "v/70-terraform-vm/captions.vtt?v=1794635625", "num": 61}, {"id": "71-cloud-init-linux", "title": "Bootstrap a Linux VM with cloud-init", "category": "Automation", "order": 71, "summary": "Create a Linux VM whose users, packages and first-boot commands come from cloud-init user data, and check the result inside the guest.", "level": "beginner", "cluster": "far-edge", "prereqs": ["04-create-vm", "05-vm-console"], "intro": "In this video, you give a new Linux virtual machine cloud-init user data that creates a user, installs packages and runs a command at first boot. Then you check the result inside the guest.", "duration": 136.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you give a new Linux virtual machine cloud-init user data that creates a user, installs packages and runs a command at first boot. Then you check the result inside the guest."}, {"t": 13.06, "title": "Create a virtual machine", "text": "On the Virtual Machines page, select Create to start a new virtual machine."}, {"t": 18.62, "title": "Basics", "text": "Choose the demo namespace for this virtual machine,"}, {"t": 22.36, "title": "Step 3", "text": "and give it the name demo-cloudinit, so you can find it later."}, {"t": 25.74, "title": "Step 4", "text": "Give the virtual machine one virtual CPU to start with,"}, {"t": 29.81, "title": "Step 5", "text": "and two gigabytes of memory, enough for this small test."}, {"t": 33.79, "title": "Boot image", "text": "Open the Volumes tab to choose the boot image."}, {"t": 36.91, "title": "Step 7", "text": "Select the openSUSE Leap cloud image. It ships with cloud-init, which reads the user data at first boot."}, {"t": 46.53, "title": "Cloud-init user data", "text": "Then open Advanced Options, where the Cloud Configuration section holds the user data."}, {"t": 51.78, "title": "Step 9", "text": "The default user data only installs the guest agent. Replace it with your own."}, {"t": 56.53, "title": "Users, packages, commands", "text": "The users key adds a user named tux with a password. The packages key installs three packages, and runcmd writes a login message and starts the guest agent."}, {"t": 66.07, "title": "Create", "text": "Select Create, and the cluster creates the virtual machine with this user data."}, {"t": 72.9, "title": "First boot", "text": "The virtual machine is running. On its first boot, cloud-init now applies the user data inside the guest."}, {"t": 81.01, "title": "Open the console", "text": "When first boot is done, open the Console menu in its row"}, {"t": 84.96, "title": "Step 15", "text": "and select Open in WebVNC to see the guest screen."}, {"t": 90.02, "title": "Log in as the new user", "text": "At the login prompt, type tux, the user that cloud-init created,"}, {"t": 95.89, "title": "Step 17", "text": "and the password from the user data."}, {"t": 99.94, "title": "The login message", "text": "The login works, and the message from the runcmd command appears right after it."}, {"t": 104.68, "title": "Check user and packages", "text": "Now check the user and the packages. tux is in the wheel group, and all three packages are installed."}, {"t": 111.96, "title": "cloud-init status", "text": "cloud-init status confirms that first boot finished, with no errors."}, {"t": 118.47, "title": "Configured from user data", "text": "Back in the Virtual Machines list, demo-cloudinit keeps running, set up entirely from its user data."}, {"t": 125.72, "title": "Wrap-up", "text": "cloud-init created the user, installed the packages and ran the command on first boot, with no manual steps. Next, you prepare a Windows image with sysprep."}], "recorded": "2026-11-14 02:47", "version": "SUSE Virtualization v1.10", "video": "v/71-cloud-init-linux/video.mp4?v=1794642456", "poster": "v/71-cloud-init-linux/poster.jpg?v=1794642457", "vtt": "v/71-cloud-init-linux/captions.vtt?v=1794642457", "num": 62}, {"id": "72-sysprep-windows-image", "title": "Prepare a Windows image with sysprep", "category": "Automation", "order": 72, "summary": "Generalize a Windows VM with sysprep, turn its disk into a reusable image, and deploy a new VM from it with an unattend answer file.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["10-windows-vm"], "intro": "In this video, you generalize a Windows virtual machine with sysprep, export its disk as an image in SUSE Virtualization, and deploy a new virtual machine from it with an unattend answer file.", "duration": null, "chapters": [], "recorded": null, "version": "SUSE Virtualization v1.10", "video": null, "poster": null, "vtt": null, "num": 63}, {"id": "73-gitops-vm-resize", "title": "Resize VMs through GitOps with Rancher Fleet", "category": "Automation", "order": 73, "summary": "Change a VM manifest in Git, get it reviewed and merged, and watch Rancher Fleet apply it to the cluster with CPU and memory hot-plug.", "level": "advanced", "cluster": "ranchero", "prereqs": ["11-hotplug-cpu-memory"], "intro": "In this video, you resize a virtual machine xt": "The code owner then merged it into the branch that Fleet watches. That commit is now the desired state."}, {"t": 84.09, "title": "Fleet applies the commit", "text": "In Rancher, Continuous Delivery shows the repository at the new merge commit. Fleet picked up the change and is applying it to the cluster."}, {"t": 92.3, "title": "New size", "text": "Back on the virtual machine, the flavor now reads two vCPUs and four gigabytes. The cluster adds them with a live migration."}, {"t": 100.68, "title": "Live migration", "text": "Open the Migration tab to see how the new size reached the running virtual machine."}, {"t": 105.74, "title": "Applied without a reboot", "text": "An automated workload update live-migrated the virtual machine to another node with the extra CPU and memory. It never restarted."}, {"t": 115.9, "title": "Wrap-up", "text": "The resize went from a reviewed pull request to the running virtual machine without a reboot. Git keeps the record of who asked, who approved, and what changed."}], "recorded": "2026-11-14 00:51", "version": "SUSE Virtualization v1.10", "video": "v/73-gitops-vm-resize/video.mp4?v=1794635499", "poster": "v/73-gitops-vm-resize/poster.jpg?v=1794635499", "vtt": "v/73-gitops-vm-resize/captions.vtt?v=1794635499", "num": 64}, {"id": "74-salt-states-mlm", "title": "Reuse Salt states with SUSE Multi-Linux Manager", "category": "Automation", "order": 74, "summary": "Bootstrap a VM with cloud-init, register it with an activation key, apply an existing Salt state from SUSE Multi-Linux Manager, and correct drift.", "level": "advanced", "cluster": null, "prereqs": [], "intro": "Bootstrap a VM with cloud-init, register it with an activation key, apply an existing Salt state from SUSE Multi-Linux Manager, and correct drift.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 65}]; const COLORS = {"Getting Started": "#30BA78", "Virtual Machines": "#2453FF", "Storage": "#FE7C3F", "Backup & Recovery": "#E9B500", "Networking": "#7F3FBF", "Live Migration": "#00A3A3", "Rancher Integration": "#0C322C", "Day-2 Operations": "#C13B78", "Add-ons": "#3F8FDB", "Scale & Limits": "#6B6B6B", "Ecosystem": "#8A5A00", "Observability": "#0F7B6C", "Automation": "#5B3FA0", "Disaster Recovery": "#B3261E", "Kube-OVN": "#1F6FB2", "AI Workloads": "#76B900"}; const TRACKS = ["Getting Started", "Virtual Machines", "Storage", "Backup & Recovery", "Networking", "Live Migration", "Rancher Integration", "Day-2 Operations", "Add-ons", "Scale & Limits", "Disaster Recovery", "Ecosystem", "Kube-OVN", "Observability", "AI Workloads", "Automation"];
const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
