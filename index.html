y. Volumes and virtual machine disks can now use it. Next, you set up cluster networking."}], "recorded": "2026-11-12 22:24", "version": "SUSE Virtualization v1.10", "video": "v/17-storage-class/video.mp4?v=1794608352", "poster": "v/17-storage-class/poster.jpg?v=1794608353", "vtt": "v/17-storage-class/captions.vtt?v=1794608353", "num": 15}, {"id": "15-backup-target", "title": "Configure an S3 backup target", "category": "Backup & Recovery", "order": 15, "summary": "Point SUSE Virtualization at an S3-compatible bucket so that virtual machine backups have somewhere to go.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you configure the backup target in SUSE Virtualization: an S3-compatible bucket that stores virtual machine backups outside the cluster.", "duration": 88.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you configure the backup target in SUSE Virtualization: an S3-compatible bucket that stores virtual machine backups outside the cluster."}, {"t": 10.14, "title": "The backup-target setting", "text": "In Advanced, Settings, the backup-target setting is empty, so backups have nowhere to go yet."}, {"t": 16.78, "title": "Edit the setting", "text": "Open its action menu,"}, {"t": 19.49, "title": "Edit the setting", "text": "and select Edit Setting."}, {"t": 22.35, "title": "Target type", "text": "Choose S3 as the type. NFS is the other option."}, {"t": 27.74, "title": "Endpoint", "text": "Enter the endpoint of the S3-compatible object store, here a Ceph object gateway."}, {"t": 34.27, "title": "Bucket", "text": "Enter the name of an existing bucket,"}, {"t": 37.34, "title": "Region", "text": "and its region."}, {"t": 39.56, "title": "Access key", "text": "Enter the access key ID of an account that can write to the bucket,"}, {"t": 44.31, "title": "Secret key", "text": "and its secret access key. The field is masked."}, {"t": 48.08, "title": "Path-style access", "text": "K  name", "text": "Name the backup."}, {"t": 20.03, "title": "File system freeze", "text": "The guest file system is frozen for at most one second while the snapshot is taken. Keep the default."}, {"t": 27.21, "title": "Create the backup", "text": "Select Create."}, {"t": 29.65, "title": "Backup and Snapshots", "text": "SUSE Virtualization starts the backup. In the menu, open Backup and Snapshots,"}, {"t": 36.87, "title": "Virtual Machine Backups", "text": "and select Virtual Machine Backups."}, {"t": 40.27, "title": "Backup is ready", "text": "The backup is Ready. Its data is stored in the S3 bucket of the backup target, outside the cluster."}, {"t": 47.29, "title": "Restore the backup", "text": "To restore it, select Restore Backup."}, {"t": 50.91, "title": "Create new", "text": "Create new restores the backup as a separate virtual machine and leaves the original untouched."}, {"t": 58.03, "title": "Namespace", "text": "Choose the namespace,"}, {"t": 61.03, "title": "New VM name", "text": "name the new virtual machine,"}, {"t": 63.7, "title": "Pick the backup", "text": "and pick the backup to restore from."}, {"t": 67.38, "title": "Restore options", "text": "Leave both options cleared, so the copy gets a new MAC address and starts after the restore."}, {"t": 73.96, "title": "Create", "text": "Select Create."}, {"t": 77.95, "title": "Restored VM running", "text": "SUSE Virtualization restores the volumes from the backup, and the new virtual machine is running next to the original."}, {"t": 87.79, "title": "Wrap-up", "text": "You restored a virtual machine from a backup. Next, you create a storage class."}], "recorded": "2026-11-12 22:19", "version": "SUSE Virtualization v1.10", "video": "v/16-backup-restore/video.mp4?v=1794612093", "poster": "v/16-backup-restore/poster.jpg?v=1794612093", "vtt": "v/16-backup-restore/captions.vtt?v=1794612093", "num": 17}, {"id": "18-cluster-network", "title": "Create a cluster network and network config", "category": "Networking", "order": 18, "summary": "Create a dedicated cluster network and bind a spare host NIC to it with a network config, ready for VLAN virtual machine networks.", "level": "intermediate", "cluster": "harvester-ai", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you create a cluster network, a dedicated path for virtual machine traffic, and attach a spare network interface of the host to it.", "duration": 88.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a cluster network, a dedicated path for virtual machine traffic, and attach a spare network interface of the host to it."}, {"t": 8.64, "title": "The mgmt network", "text": "Under Networks, Cluster Network Configuration, the built-in mgmt network carries management traffic on every host."}, {"t": 17.52, "title": "Create a cluster network", "text": "To separate virtual machine traffic, select Create a Cluster Network."}, {"t": 23.22, "title": "Name", "text": "Name the cluster network."}, {"t": 25.57, "title": "Create", "text": "Select Create."}, {"t": 28.03, "title": "Empty cluster network", "text": "The new cluster network has no network configuration yet, so no host interface carries its traffic."}, {"t": 35.43, "title": "Create a network config", "text": "Select Create Network Configuration."}, {"t": 39.02, "title": "Name", "text": "Name the network configuration."}, {"t": 41.84, "title": "Node selector", "text": "On the Node Selector tab, keep Select all nodes, so every host joins this cluster network."}, {"t": 48.67, "title": "Uplink", "text": "On the Uplink tab, choose the host interfaces for the cluster network."}, {"t": 54.16, "title": "Uplink NIC", "text": "Select a spare network interface. The list only shows interfaces that are free on all selected nodes."}, {"t": 62.48, "title": "Bond options", "text": "The interface becomes a bond, active-backup by default. Add a second NIC later for redundancy."}, {"t": 69.81, "title": "Create", "text": "Select Create."}, {"t": 72.68, "title": "Uplink is active", "text": "The network configuration is active. The cluster network now has an uplink on every host and is ready for VLAN networks."}, {"t": 83.08, "title": "Wrap-up", "text": "The cluster network is ready. Next, you create a VLAN virtual machine network on it."}], "recorded": "2026-11-13 14:39", "version": "SUSE Virtualization v1.10", "video": "v/18-cluster-network/video.mp4?v=1794608478", "poster": "v/18-cluster-network/poster.jpg?v=1794608478", "vtt": "v/18-cluster-network/captions.vtt?v=1794608478", "num": 18}, {"id": "19-vlan-network", "title": "Create a VLAN virtual machine network", "category": "Networking", "order": 19, "summary": "Create a VLAN-backed virtual machine network on a cluster network so that virtual machines can join an existing VLAN.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["18-cluster-network"], "intro": "In this video, you create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network.", "duration": 61.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network."}, {"t": 7.14, "title": "Create a network", "text": "Under Networks, Virtual Machine Networks, select Create."}, {"t": 11.73, "title": "Namespace", "text": "Choose the namespace that the network belongs to."}, {"t": 16.05, "title": "Name", "text": "Give it a name."}, {"t": 17.97, "title": "L2 VLAN type", "text": "The type is L2VlanNetwork, a layer two network tagged with a VLAN ID."}, {"t": 24.07, "title": "Access mode", "text": "Keep Access mode, so each virtual machine interface carries this one VLAN."}, {"t": 29.65, "title": "VLAN ID", "text": "Enter VLAN ID one hundred."}, {"t": 32.72, "title": "Cluster network", "text": "Select the cluster network that carries the VLAN. Here it is mgmt, the management network."}, {"t": 40.69, "title": "Create", "text": "Select Create."}, {"t": 43.15, "title": "Network is ready", "text": "The new network is listed with its type, VLAN ID, and cluster network. Virtual machines can now attach to it."}, {"t": 52.91, "title": "Wrap-up", "text": "Virtual machines can now use VLAN one hundred. Next, you create an overlay network that needs no VLAN on the switch."}], "recorded": "2026-11-12 22:26", "version": "SUSE Virtualization v1.10", "video": "v/19-vlan-network/video.mp4?v=1794612100", "poster": "v/19-vlan-network/poster.jpg?v=1794612100", "vtt": "v/19-vlan-network/captions.vtt?v=1794612100", "num": 19}, {"id": "20-overlay-network", "title": "Create an overlay network with Kube-OVN", "category": "Networking", "order": 20, "summary": "Create an overlay virtual machine network and give it a Kube-OVN subnet, so virtual machines get a private network that needs no switch configuration.", "level": "advanced", "cluster": "far-edge", "prereqs": ["19-vlan-network"], "intro": "In this video, you create an overlay virtual machine network and a Kube-OVN subnet for it. Overlay traffic is tunneled between hosts, so the switches need no VLANs.", "duration": 102.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create an overlay virtual machine network and a Kube-OVN subnet for it. Overlay traffic is tunneled between hosts, so the switches need no VLANs."}, {"t": 10.54, "title": "Create a network", "text": "Under Networks, Virtual Machine Networks, select Create."}, {"t": 15.16, "title": "Namespace", "text": "Choose the namespace,"}, {"t": 18.15, "title": "Name", "text": "and give the network a name."}, {"t": 20.59, "title": "Overlay type", "text": "Set the type to OverlayNetwork. An overlay network needs no VLAN ID and no cluster network."}, {"t": 28.88, "title": "Create", "text": "Select Create."}, {"t": 31.35, "title": "Overlay network", "text": "The network exists, but it has no IP range yet. A Kube-OVN subnet provides one."}, {"t": 37.95, "title": "Overlay Networks", "text": "Open Overlay Networks,"}, {"t": 40.97, "title": "Virtual Private Cloud", "text": "and select Virtual Private Cloud. The default VPC, ovn-cluster, holds the built-in subnets."}, {"t": 48.72, "title": "Create a subnet", "text": "In the ovn-cluster VPC, select Create Subnet."}, {"t": 53.31, "title": "Subnet name", "text": "Name the subnet."}, {"t": 55.29, "title": "CIDR block", "text": "Enter a CIDR block that does not overlap with other networks."}, {"t": 60.28, "title": "Provider", "text": "As the provider, select the overlay network you just created. This binds the subnet to it."}, {"t": 67.55, "title": "Gateway", "text": "Leave the gateway IP empty. Kube-OVN uses the first address of the block."}, {"t": 73.5, "title": "DHCP", "text": "Enable DHCP, so virtual machines on this network receive their addresses automatically."}, {"t": 80.85, "title": "Create", "text": "Select Create."}, {"t": 83.3, "title": "Subnet is active", "text": "The subnet is active, with its CIDR block and the overlay network as its provider."}, {"t": 91.13, "title": "Wrap-up", "text": "Virtual machines can now attach to the demo-overlay network and get addresses from its subnet. Next, you hot-plug a network interface."}], "recorded": "2026-11-12 22:29", "version": "SUSE Virtualization v1.10", "video": "v/20-overlay-network/video.mp4?v=1794612111", "poster": "v/20-overlay-network/poster.jpg?v=1794612111", "vtt": "v/20-overlay-network/captions.vtt?v=1794612111", "num": 20}, {"id": "21-hotplug-nic", "title": "Hot-plug a network interface", "category": "Networking", "order": 21, "summary": "Add a second network interface to a running virtual machine without restarting it.", "level": "advanced", "cluster": "disaster-recovery", "prereqs": ["19-vlan-network", "04-create-vm"], "intro": "In this video, you add a second network interface to a running virtual machine. SUSE Virtualization plugs it in without a restart.", "duration": 73.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you add a second network interface to a running virtual machine. SUSE Virtualization plugs it in without a restart."}, {"t": 8.68, "title": "Open the VM actions", "text": "The virtual machine is running. Open its action menu,"}, {"t": 13.38, "title": "Edit the configuration", "text": "and select Edit Config."}, {"t": 16.22, "title": "Networks tab", "text": "Open the Networks tab."}, {"t": 19.01, "title": "Current interface", "text": "The virtual machine has one interface, on the management network. You cannot change it while the machine runs."}, {"t": 26.55, "title": "Add a network", "text": "Select Add Network."}, {"t": 29.19, "title": "Pick the network", "text": "Choose the VLAN network for the new interface."}, {"t": 33.48, "title": "Bridge binding", "text": "Keep the bridge type and the virtio model. Hot-plugging works with bridge interfaces."}, {"t": 39.63, "title": "Save", "text": "Select Save."}, {"t": 42.06, "title": "Skip the restart", "text": "SUSE Virtualization offers to restart the virtual machine. A new network interface does not need a restart."}, {"t": 50.01, "title": "Save without restart", "text": "Select Save, not Save and Restart."}, {"t": 55.24, "title": "Networks of the VM", "text": "Open the virtual machine's Networks tab."}, {"t": 58.99, "title": "Second NIC attached", "text": "The virtual machine never stopped, and it now has a second interface on the VLAN network."}, {"t": 66.67, "title": "Wrap-up", "text": "You added a network interface without downtime. Next, you set up a dedicated network for live migration."}], "recorded": "2026-11-12 21:34", "version": "SUSE Virtualization v1.10", "video": "v/21-hotplug-nic/video.mp4?v=1794612120", "poster": "v/21-hotplug-nic/poster.jpg?v=1794612120", "vtt": "v/21-hotplug-nic/captions.vtt?v=1794612120", "num": 21}, {"id": "22-live-migration-network", "title": "Set up a dedicated live migration network", "category": "Live Migration", "order": 22, "summary": "Move live migration traffic onto its own VLAN and IP range with the vm-migration-network setting.", "level": "advanced", "cluster": "disaster-recovery", "prereqs": ["18-cluster-network", "19-vlan-network"], "intro": "In this video, you give live migration traffic its own network in SUSE Virtualization, so moving virtual machines does not compete with other management traffic.", "duration": 81.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you give live migration traffic its own network in SUSE Virtualization, so moving virtual machines does not compete with other management traffic."}, {"t": 10.58, "title": "vm-migration-network", "text": "Under Advanced, Settings, find vm-migration-network. It has no value, so migrations share the management network."}, {"t": 19.21, "title": "Open actions", "text": "Open its actions menu,"}, {"t": 22.06, "title": "Edit Setting", "text": "and select Edit Setting."}, {"t": 24.92, "title": "Enable", "text": "Select Enabled."}, {"t": 27.49, "title": "Cluster network", "text": "Choose the cluster network that carries the traffic. These nodes have one network interface, so pick mgmt."}, {"t": 36.58, "title": "VLAN ID", "text": "Enter a VLAN ID that the physical switch carries between all nodes, here nine nine nine."}, {"t": 43.42, "title": "IP range", "text": "Enter an unused IP range. Each node gets an address from it for migration traffic."}, {"t": 50.02, "title": "Exclude IPs", "text": "Optionally, exclude addresses that are already in use,"}, {"t": 54.26, "title": "Excluded IP", "text": "such as a gateway address."}, {"t": 56.71, "title": "Save", "text": "Select Save."}, {"t": 59.13, "title": "Show the value", "text": "The setting is now marked Modified. Select Show to see its value."}, {"t": 64.58, "title": "Migration network set", "text": "The setting now shows the cluster network, VLAN, and IP range. New live migrations use this dedicated network."}, {"t": 74.64, "title": "Wrap-up", "text": "Live migrations now use the dedicated network. Next, you live-migrate a virtual machine."}], "recorded": "2026-11-12 21:22", "version": "SUSE Virtualization v1.10", "video": "v/22-live-migration-network/video.mp4?v=1794612129", "poster": "v/22-live-migration-network/poster.jpg?v=1794612129", "vtt": "v/22-live-migration-network/captions.vtt?v=1794612129", "num": 22}, {"id": "23-live-migrate-vm", "title": "Live-migrate a virtual machine", "category": "Live Migration", "order": 23, "summary": "Move a running virtual machine to another node with live migration, without stopping it.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["04-create-vm"], "intro": "In this video, you live-migrate a running virtual machine to another node in a SUSE Virtualization cluster, and watch it keep running while it moves.", "duration": 56.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you live-migrate a running virtual machine to another node in a SUSE Virtualization cluster, and watch it keep running while it moves."}, {"t": 10.18, "title": "Running on ser5-blue", "text": "The virtual machine demo-migrate is running. The Node column shows that it runs on ser5-blue."}, {"t": 17.57, "title": "Open actions", "text": "Open the actions menu for the virtual machine,"}, {"t": 21.68, "title": "Migrate", "text": "and select Virtual Machine Migration."}, {"t": 25.2, "title": "Target node", "text": "Choose the target node, here ser5-green. The virtual machine moves to this node."}, {"t": 32.14, "title": "Apply", "text": "Select Apply to start the migration."}, {"t": 37.35, "title": "Running on ser5-green", "text": "SUSE Virtualization copies the memory to the new node while the guest keeps running. The Node column now shows ser5-green."}, {"t": 48.06, "title": "Wrap-up", "text": "The virtual machine now runs on a different node and never stopped. Next, you provision a guest cluster from Rancher."}], "recorded": "2026-11-12 21:13", "version": "SUSE Virtualization v1.10", "video": "v/23-live-migrate-vm/video.mp4?v=1794612135", "poster": "v/23-live-migrate-vm/poster.jpg?v=1794612135", "vtt": "v/23-live-migrate-vm/captions.vtt?v=1794612135", "num": 23}, {"id": "23b-import-harvester-into-rancher", "title": "Import SUSE Virtualization into Rancher", "category": "Rancher Integration", "order": 23.5, "summary": "Register a SUSE Virtualization cluster with Rancher Virtualization Management, so you can manage it and provision guest clusters on it.", "level": "intermediate", "cluster": "ranchero", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you import a SUSE Virtualization cluster into Rancher. Once imported, you manage it from Virtualization Management and can provision Kubernetes clusters on it.", "duration": 89.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you import a SUSE Virtualization cluster into Rancher. Once imported, you manage it from Virtualization Management and can provision Kubernetes clusters on it."}, {"t": 11.93, "title": "Import Existing", "text": "In Rancher, open Virtualization Management and select Import Existing."}, {"t": 18.03, "title": "Cluster name", "text": "Name the cluster as it should appear in Rancher."}, {"t": 21.39, "title": "Description", "text": "Add a description, for example the hardware it runs on."}, {"t": 25.55, "title": "Create", "text": "Select Create."}, {"t": 28.17, "title": "Registration URL", "text": "Rancher shows the steps and a registration URL for this cluster. Copy the URL."}, {"t": 34.97, "title": "SUSE Virtualization settings", "text": "Now open the SUSE Virtualization UI of the cluster you are importing, and go to Advanced, Settings."}, {"t": 43.06, "title": "cluster-registration-url", "text": "Find the cluster registration URL setting and open its menu."}, {"t": 48.23, "title": "Edit Setting", "text": "Select Edit Setting."}, {"t": 50.97, "title": "Paste the URL", "text": "Paste the registration URL. Leave TLS verification on, because Rancher has a trusted certificate."}, {"t": 59.05, "title": "Save", "text": "Select Save."}, {"t": 61.55, "title": "Confirm", "text": "A tip explains how to remove the cluster from Rancher later. Select OK, and the cluster starts connecting to Rancher."}, {"t": 71.67, "title": "Imported", "text": "Back in Virtualization Management, the cluster is active and shows its SUSE Virtualization version and nodes. You can now manage it from Rancher."}, {"t": 83.53, "title": "Wrap-up", "text": "The cluster is imported. Next, you provision a Kubernetes guest cluster on it from Rancher."}], "recorded": "2026-11-13 12:48", "version": "SUSE Virtualization v1.9 \u00b7 SUSE Rancher Prime v2.15", "video": "v/23b-import-harvester-into-rancher/video.mp4?v=1794609141", "poster": "v/23b-import-harvester-into-rancher/poster.jpg?v=1794609141", "vtt": "v/23b-import-harvester-into-rancher/captions.vtt?v=1794609141", "num": 24}, {"id": "24-rancher-guest-cluster", "title": "Provision a Kubernetes cluster on SUSE Virtualization from Rancher", "category": "Rancher Integration", "order": 24, "summary": "Use Rancher to create an RKE2 Kubernetes cluster whose nodes are virtual machines on SUSE Virtualization.", "level": "advanced", "cluster": "ranchero", "prereqs": ["04-create-vm", "19-vlan-network"], "intro": "In this video, you use Rancher to provision an RKE2 Kubernetes cluster on SUSE Virtualization. Rancher creates the node virtual machines for you.", "duration": 99.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use Rancher to provision an RKE2 Kubernetes cluster on SUSE Virtualization. Rancher creates the node virtual machines for you."}, {"t": 10.78, "title": "Create a cluster", "text": "In Rancher, open Cluster Management and select Create."}, {"t": 15.42, "title": "Harvester provider", "text": "Select Harvester, the provider for SUSE Virtualization."}, {"t": 20.31, "title": "Cloud credential", "text": "Choose the cloud credential for the SUSE Virtualization cluster that hosts the nodes, here far-edge."}, {"t": 27.89, "title": "Step 4", "text": ""}, {"t": 30.0, "title": "Cluster name", "text": "Name the cluster."}, {"t": 32.1, "title": "Machine pool", "text": "One machine pool with one machine runs etcd, the control plane, and workloads. That is enough for a test cluster."}, {"t": 40.42, "title": "CPUs", "text": "Give each machine four CPUs,"}, {"t": 43.37, "title": "Memory (GiB)", "text": "and eight gigabytes of memory."}, {"t": 45.96, "title": "Namespace", "text": "Choose the namespace for the virtual machines on SUSE Virtualization,"}, {"t": 51.87, "title": "SSH user", "text": "and the default user of the cloud image."}, {"t": 54.93, "title": "Image", "text": "Pick an Ubuntu cloud image that exists on the cluster,"}, {"t": 59.75, "title": "Disk (GiB)", "text": "and set the root disk to twenty gigabytes."}, {"t": 63.01, "title": "Network", "text": "Attach the machines to a VM network that can reach Rancher."}, {"t": 68.33, "title": "Kubernetes version", "text": "Under Cluster Configuration, keep the default RKE2 version and the Harvester cloud provider."}, {"t": 75.79, "title": "Create", "text": "Select Create."}, {"t": 78.19, "title": "Provisioning", "text": "The cluster appears in the list. Rancher starts provisioning it."}, {"t": 84.37, "title": "Node VM on far-edge", "text": "On far-edge, SUSE Virtualization now runs the node virtual machine that Rancher created."}, {"t": 92.8, "title": "Wrap-up", "text": "Rancher keeps provisioning the cluster until it is Active. You manage it from Cluster Management like any other cluster."}], "recorded": "2026-11-12 22:38", "version": "SUSE Virtualization v1.10", "video": "v/24-rancher-guest-cluster/video.mp4?v=1794612148", "poster": "v/24-rancher-guest-cluster/poster.jpg?v=1794612148", "vtt": "v/24-rancher-guest-cluster/captions.vtt?v=1794612148", "num": 25}, {"id": "25-storage-migration", "title": "Migrate a running virtual machine's volume to another storage class", "category": "Day-2 Operations", "order": 25, "summary": "Move the disk of a running virtual machine from Longhorn to Portworx with online storage migration, without stopping it.", "level": "advanced", "cluster": "disaster-recovery", "prereqs": ["17-storage-class", "23-live-migrate-vm"], "intro": "In this video, you move the disk of a running virtual machine from Longhorn to Portworx with storage migration. The guest keeps running while its data moves.", "duration": 109.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you move the disk of a running virtual machine from Longhorn to Portworx with storage migration. The guest keeps running while its data moves."}, {"t": 9.93, "title": "Volume on Longhorn", "text": "The running virtual machine demo-smig boots from demo-smig-disk-0. Its storage class is a Longhorn class, made for the image."}, {"t": 19.74, "title": "Create the target volume", "text": "First, create the target volume. Select Create."}, {"t": 24.07, "title": "Namespace", "text": "Use the same namespace as the virtual machine,"}, {"t": 28.5, "title": "Name", "text": "and name the volume demo-smig-px."}, {"t": 32.42, "title": "Portworx storage class", "text": "Choose the Portworx storage class px-csi-replicated."}, {"t": 37.7, "title": "Size", "text": "Set the size to ten gigabytes, the same as the source volume."}, {"t": 42.34, "title": "Create", "text": "Select Create."}, {"t": 44.83, "title": "Target volume ready", "text": "The new volume is ready and not attached to any virtual machine."}, {"t": 49.68, "title": "Virtual Machines", "text": "Now open the Virtual Machines page."}, {"t": 53.03, "title": "Open actions", "text": "Open the actions menu for demo-smig,"}, {"t": 56.57, "title": "Storage Migration", "text": "and select Storage Migration."}, {"t": 59.78, "title": "Source volume", "text": "For the source volume, choose demo-smig-disk-0."}, {"t": 64.54, "title": "Target volume", "text": "For the target volume, choose demo-smig-px. The list shows only volumes that no virtual machine uses."}, {"t": 73.51, "title": "Apply", "text": "Select Apply."}, {"t": 76.66, "title": "Migrating", "text": "SUSE Virtualization live-migrates the virtual machine to another node and copies the disk to the new volume."}, {"t": 86.34, "title": "Still running", "text": "The migration is complete. The virtual machine kept running and now runs on a different node."}, {"t": 93.08, "title": "Volumes", "text": "Check the Volumes page."}, {"t": 95.9, "title": "Disk on Portworx", "text": "demo-smig-px, on the Portworx storage class, is now the disk of demo-smig."}, {"t": 103.28, "title": "Wrap-up", "text": "The virtual machine now runs from a Portworx volume and never stopped. Next, you hot-plug a CD-ROM."}], "recorded": "2026-11-13 12:35", "version": "SUSE Virtualization v1.10", "video": "v/25-storage-migration/video.mp4?v=1794612162", "poster": "v/25-storage-migration/poster.jpg?v=1794612162", "vtt": "v/25-storage-migration/captions.vtt?v=1794612162", "num": 26}, {"id": "26-cdrom-hotplug", "title": "Insert and eject a CD-ROM image on a running virtual machine", "category": "Day-2 Operations", "order": 26, "summary": "Insert an ISO image into the empty CD-ROM drive of a running virtual machine, then eject it, without a restart.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["02-upload-image", "12-hotplug-volume"], "intro": "In this video, you insert an ISO image into the CD-ROM drive of a running virtual machine and eject it again, without restarting the virtual machine.", "duration": 76.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you insert an ISO image into the CD-ROM drive of a running virtual machine and eject it again, without restarting the virtual machine."}, {"t": 8.98, "title": "Open the virtual machine", "text": "The virtual machine demo-cdrom is running. Open it."}, {"t": 13.62, "title": "Volumes tab", "text": "Select the Volumes tab."}, {"t": 16.54, "title": "Empty CD-ROM drive", "text": "Below the root disk, the virtual machine has a CD-ROM drive on the SATA bus. It shows No media."}, {"t": 24.49, "title": "Insert Image", "text": "Select Insert Image."}, {"t": 27.4, "title": "Pick the ISO image", "text": "Keep the drive name, cdrom, and choose the Alpine Linux ISO image."}, {"t": 33.62, "title": "Apply", "text": "Select Apply."}, {"t": 37.64, "title": "ISO inserted", "text": "The drive now holds the Alpine ISO image. It was attached live, and the virtual machine is still running."}, {"t": 45.57, "title": "Eject Image", "text": "When you no longer need the media, select Eject Image."}, {"t": 50.09, "title": "Confirm the eject", "text": "Confirm that you want to eject the image from the cdrom drive."}, {"t": 54.97, "title": "Drive empty again", "text": "The drive shows No media again. The drive itself stays in place, ready for the next image."}, {"t": 61.5, "title": "Never restarted", "text": "Throughout both changes, the virtual machine kept running."}, {"t": 67.35, "title": "Wrap-up", "text": "You inserted and ejected an ISO image while the virtual machine kept running. Next, you work with volume snapshots and images."}], "recorded": "2026-11-13 14:48", "version": "SUSE Virtualization v1.10", "video": "v/26-cdrom-hotplug/video.mp4?v=1794612171", "poster": "v/26-cdrom-hotplug/poster.jpg?v=1794612172", "vtt": "v/26-cdrom-hotplug/captions.vtt?v=1794612172", "num": 27}, {"id": "27-volume-operations", "title": "Snapshot, restore, and export a volume", "category": "Day-2 Operations", "order": 27, "summary": "Take a snapshot of a volume, restore it to a new volume, and export the volume to a reusable image.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["12-hotplug-volume", "17-storage-class"], "intro": "In this video, you take a snapshot of a volume, restore it to a new volume, and export the volume to an image for new virtual machines.", "duration": 94.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you take a snapshot of a volume, restore it to a new volume, and export the volume to an image for new virtual machines."}, {"t": 8.73, "title": "Open the action menu", "text": "On the Volumes page, open the action menu of the two gigabyte volume demo-data."}, {"t": 15.04, "title": "Take Snapshot", "text": "Select Take Snapshot."}, {"t": 17.63, "title": "Name the snapshot", "text": "Name the snapshot demo-data-snap,"}, {"t": 20.5, "title": "Create the snapshot", "text": "and select Create."}, {"t": 23.25, "title": "Open the volume", "text": "Open the volume to see its snapshots."}, {"t": 26.79, "title": "Snapshots tab", "text": "Select the Snapshots tab."}, {"t": 29.9, "title": "Snapshot ready", "text": "The snapshot is ready to use. Open its action menu."}, {"t": 35.18, "title": "Restore", "text": "Select Restore."}, {"t": 37.38, "title": "New volume name", "text": "Restoring creates a new volume and leaves the original untouched. Name it demo-data-restored."}, {"t": 43.33, "title": "Storage class", "text": "Keep the default storage class."}, {"t": 46.16, "title": "Create the volume", "text": "Select Create."}, {"t": 48.59, "title": "Restored volume", "text": "On the Volumes page, the restored two gigabyte volume demo-data-restored sits next to the original."}, {"t": 55.14, "title": "Open the action menu", "text": "Next, export the original volume to an image. Open its action menu,"}, {"t": 60.76, "title": "Export Image", "text": "and select Export Image."}, {"t": 63.36, "title": "Image name", "text": "Keep the namespace demo, and name the image demo-data-image."}, {"t": 68.95, "title": "Storage class", "text": "Choose the storage class for the image, here longhorn-v2."}, {"t": 73.53, "title": "Export", "text": "Select Create to start the export."}, {"t": 77.75, "title": "Image ready", "text": "On the Images page, demo-data-image is active. You can now create new virtual machines from it, or download it."}, {"t": 86.66, "title": "Wrap-up", "text": "You now have a snapshot, a restored copy, and an image of the volume. Next, you control where virtual machines run."}], "recorded": "2026-11-13 16:49", "version": "SUSE Virtualization v1.10", "video": "v/27-volume-operations/video.mp4?v=1794606570", "poster": "v/27-volume-operations/poster.jpg?v=1794606570", "vtt": "v/27-volume-operations/captions.vtt?v=1794606570", "num": 28}, {"id": "28-vm-scheduling-rules", "title": "Control where virtual machines run with scheduling rules", "category": "Day-2 Operations", "order": 28, "summary": "Restrict a new virtual machine to chosen hosts with a node rule, and keep it away from another virtual machine with anti-affinity.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["04-create-vm", "23-live-migrate-vm"], "intro": "In this video, you create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine.", "duration": 129.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine."}, {"t": 9.6, "title": "First VM on ser5-green", "text": "The virtual machine demo-sched-1 runs on ser5-green. The second virtual machine must not share its host."}, {"t": 18.0, "title": "Create a virtual machine", "text": "Select Create."}, {"t": 20.43, "title": "Namespace", "text": "Choose the demo namespace,"}, {"t": 23.72, "title": "Name", "text": "and name it demo-sched-2."}, {"t": 26.33, "title": "CPU", "text": "Give it one CPU"}, {"t": 28.72, "title": "Memory (GiB)", "text": "and two gigabytes of memory."}, {"t": 31.33, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 33.71, "title": "Boot image", "text": "select the openSUSE Leap image for the boot disk."}, {"t": 38.34, "title": "Node Scheduling", "text": "Open the Node Scheduling tab. By default, the virtual machine can run on any available node."}, {"t": 45.62, "title": "Scheduling rules", "text": "Select Run virtual machine on nodes matching scheduling rules."}, {"t": 50.46, "title": "Add Node Selector", "text": "Add a node selector. Its priority stays Required, so the rule must be met."}, {"t": 56.67, "title": "Add Rule", "text": "Add a rule."}, {"t": 58.95, "title": "Node label key", "text": "For the key, use the node label kubernetes.io/hostname."}, {"t": 63.87, "title": "Allowed hosts", "text": "Keep the operator in list, and enter ser5-green and ser5-purple. The virtual machine can run only on these two hosts."}, {"t": 73.05, "title": "Virtual Machine Scheduling", "text": "Next, open the Virtual Machine Scheduling tab."}, {"t": 76.72, "title": "Add Workload Selector", "text": "Add a workload selector."}, {"t": 79.53, "title": "Anti-Affinity", "text": "Set the type to Anti-Affinity, and keep the priority Required."}, {"t": 84.89, "title": "Add Rule", "text": "Add a rule that selects the other virtual machine."}, {"t": 88.84, "title": "Label key", "text": "Every virtual machine carries the label harvesterhci.io/vmName."}, {"t": 94.85, "title": "Label value", "text": "Set its value to demo-sched-1."}, {"t": 97.77, "title": "Topology key", "text": "With the topology key kubernetes.io/hostname, the two virtual machines never share a host."}, {"t": 104.95, "title": "Create", "text": "Select Create."}, {"t": 108.97, "title": "Different hosts", "text": "demo-sched-2 runs on ser5-purple. The node rule allowed ser5-green and ser5-purple, and anti-affinity ruled out ser5-green."}, {"t": 121.25, "title": "Wrap-up", "text": "Both rules are part of the virtual machine and also apply when it restarts or migrates. Next, you put a host into maintenance mode."}], "recorded": "2026-11-13 12:44", "version": "SUSE Virtualization v1.10", "video": "v/28-vm-scheduling-rules/video.mp4?v=1794609737", "poster": "v/28-vm-scheduling-rules/poster.jpg?v=1794609737", "vtt": "v/28-vm-scheduling-rules/captions.vtt?v=1794609737", "num": 29}, {"id": "29-host-maintenance-mode", "title": "Put a host into maintenance mode", "category": "Day-2 Operations", "order": 29, "summary": "Enable maintenance mode on a host so its virtual machines live-migrate away, then return the host to service.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["23-live-migrate-vm"], "intro": "In this video, you put a host into maintenance mode. Its virtual machines live-migrate to other hosts, so you can service the host without downtime.", "duration": 89.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you put a host into maintenance mode. Its virtual machines live-migrate to other hosts, so you can service the host without downtime."}, {"t": 9.77, "title": "VM on ser5-purple", "text": "The virtual machine demo-maint is running on the host ser5-purple."}, {"t": 14.97, "title": "Hosts", "text": "Open the Hosts page."}, {"t": 17.85, "title": "ser5-purple is Active", "text": "ser5-purple is Active. Suppose it needs a firmware update or new hardware."}, {"t": 23.89, "title": "Open actions", "text": "Open its actions menu,"}, {"t": 26.74, "title": "Enable Maintenance Mode", "text": "and select Enable Maintenance Mode."}, {"t": 30.17, "title": "Keep Force cleared", "text": "Leave Force cleared. Virtual machines that can live-migrate move to other hosts. Force would shut down the ones that cannot."}, {"t": 38.97, "title": "Apply", "text": "Select Apply."}, {"t": 43.0, "title": "Host in maintenance", "text": "SUSE Virtualization live-migrates the virtual machines away and drains the host. ser5-purple is now in maintenance mode."}, {"t": 52.62, "title": "Virtual Machines", "text": "Back on the Virtual Machines page,"}, {"t": 56.03, "title": "VM moved", "text": "demo-maint kept running. It now runs on another host."}, {"t": 60.31, "title": "Hosts", "text": "When the work on the host is done, return to the Hosts page,"}, {"t": 65.0, "title": "Open actions", "text": "open the actions menu for ser5-purple,"}, {"t": 69.03, "title": "Disable Maintenance Mode", "text": "and select Disable Maintenance Mode."}, {"t": 72.3, "title": "Host Active again", "text": "ser5-purple is Active again and accepts new workloads. The virtual machine stays on its new host."}, {"t": 81.3, "title": "Wrap-up", "text": "The host went into maintenance and came back while the virtual machine kept running. Next, you pass a GPU through to a virtual machine."}], "recorded": "2026-11-13 13:02", "version": "SUSE Virtualization v1.10", "video": "v/29-host-maintenance-mode/video.mp4?v=1794609865", "poster": "v/29-host-maintenance-mode/poster.jpg?v=1794609865", "vtt": "v/29-host-maintenance-mode/captions.vtt?v=1794609866", "num": 30}, {"id": "30-gpu-passthrough", "title": "Pass a GPU through to a virtual machine", "category": "Add-ons", "order": 30, "summary": "Review a GPU enabled for PCI passthrough and attach it, with its audio function, to a virtual machine.", "level": "advanced", "cluster": "far-edge", "prereqs": ["04-create-vm", "11-hotplug-cpu-memory"], "intro": "In this video, you review a GPU that is enabled for PCI passthrough and attach it to a virtual machine, giving the guest direct access to the physical device.", "duration": 116.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review a GPU that is enabled for PCI passthrough and attach it to a virtual machine, giving the guest direct access to the physical device."}, {"t": 9.54, "title": "PCI Devices", "text": "Under Advanced, PCI Devices lists every PCI device on each host. Filter the list for NVIDIA."}, {"t": 16.61, "title": "The GPU", "text": "This NVIDIA Quadro P1000 GPU has passthrough enabled. The host no longer uses it, so a virtual machine can."}, {"t": 23.91, "title": "Its audio function", "text": "The GPU's audio function sits in the same IOMMU group, so it is enabled too. Pass both to the same virtual machine."}, {"t": 31.34, "title": "How it was enabled", "text": "An enabled device's action menu offers Disable Passthrough. Other devices offer Enable Passthrough, which is how this GPU was claimed."}, {"t": 39.28, "title": "Step 5", "text": ""}, {"t": 41.24, "title": "Open actions", "text": "On the Virtual Machines page, open the action menu of demo-gpu,"}, {"t": 46.52, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 49.11, "title": "PCI Devices tab", "text": "Select the PCI Devices tab."}, {"t": 51.87, "title": "Pick the GPU", "text": "In Available PCI Devices, choose the GPU,"}, {"t": 56.34, "title": "Pick its audio function", "text": "and its audio function."}, {"t": 59.69, "title": "Step 12", "text": ""}, {"t": 61.37, "title": "Compatible host", "text": "Both devices sit on host p5820, so the form lists it as the compatible host. The virtual machine will run there."}, {"t": 68.29, "title": "Save", "text": "Select Save."}, {"t": 70.64, "title": "Save and Restart", "text": "A PCI device is attached at boot, so select Save and Restart."}, {"t": 76.66, "title": "Running with the GPU", "text": "The virtual machine restarted on host p5820 and is running again, now with the GPU attached."}, {"t": 83.01, "title": "Open the console", "text": "To check from inside the guest, open the console,"}, {"t": 86.83, "title": "Step 19", "text": "in WebVNC."}, {"t": 90.18, "title": "Log in", "text": "Log in as sles,"}, {"t": 92.08, "title": "Step 21", "text": "with the password that cloud-init set."}, {"t": 95.82, "title": "lspci in the guest", "text": "List the PCI devices of the guest and filter for NVIDIA."}, {"t": 100.82, "title": "GPU visible", "text": "The guest lists the Quadro P1000 GPU and its audio function as its own PCI devices."}, {"t": 109.71, "title": "Wrap-up", "text": "The virtual machine runs with the physical GPU passed through. Next, you use local LVM storage."}], "recorded": "2026-11-13 17:02", "version": "SUSE Virtualization v1.10", "video": "v/30-gpu-passthrough/video.mp4?v=1794607372", "poster": "v/30-gpu-passthrough/poster.jpg?v=1794607372", "vtt": "v/30-gpu-passthrough/captions.vtt?v=1794607372", "num": 31}, {"id": "31-lvm-local-storage", "title": "Use local LVM storage for virtual machines", "category": "Add-ons", "order": 31, "summary": "Enable the LVM add-on, turn a spare host disk into a volume group, and run a virtual machine on a local LVM volume.", "level": "advanced", "cluster": "far-edge", "prereqs": ["17-storage-class", "04-create-vm"], "intro": "In this video, you enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it.", "duration": 198.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it."}, {"t": 9.5, "title": "LVM add-on", "text": "Under Advanced, Add-ons, open the action menu of harvester-csi-driver-lvm."}, {"t": 16.69, "title": "Enable", "text": "Select Enable. SUSE Virtualization deploys the LVM CSI driver."}, {"t": 24.66, "title": "Add-on deployed", "text": "The add-on reports Deploy Successful."}, {"t": 29.31, "title": "Edit the host", "text": "Next, give LVM a disk. On the Hosts page, open the action menu of host p5820,"}, {"t": 37.61, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 40.67, "title": "Storage tab", "text": "Select the Storage tab."}, {"t": 43.75, "title": "Add Disk", "text": "Select Add Disk,"}, {"t": 46.07, "title": "Pick /dev/sdc", "text": "and choose the spare disk, /dev/sdc, one hundred twelve gigabytes."}, {"t": 52.57, "title": "Provisioner LVM", "text": "Change the provisioner from Longhorn to LVM."}, {"t": 57.17, "title": "New volume group", "text": "For Volume Group, select Create New."}, {"t": 61.48, "title": "Name it demo-vg", "text": "Name the volume group demo-vg,"}, {"t": 64.48, "title": "Create", "text": "and select Create."}, {"t": 66.75, "title": "Save", "text": "Select Save. SUSE Virtualization adds the disk to the new volume group."}, {"t": 74.17, "title": "Open the host", "text": "Open the host,"}, {"t": 76.7, "title": "Storage tab", "text": "and its Storage tab."}, {"t": 79.35, "title": "Disk provisioned", "text": "The disk /dev/sdc is now provisioned with LVM. Next, create a storage class on the volume group."}, {"t": 88.28, "title": "Create a storage class", "text": "On the Storage Classes page, select Create."}, {"t": 92.23, "title": "Name", "text": "Name it demo-lvm."}, {"t": 94.66, "title": "Provisioner LVM", "text": "Choose the LVM provisioner."}, {"t": 98.38, "title": "Node", "text": "LVM volumes are local, so the class is tied to one host. Choose node p5820,"}, {"t": 106.78, "title": "Volume group", "text": "and the volume group demo-vg."}, {"t": 110.56, "title": "dm-thin", "text": "Keep the volume group type dm-thin. Thin volumes allocate space on write and support snapshots and clones."}, {"t": 118.77, "title": "Create", "text": "Select Create."}, {"t": 121.23, "title": "LVM storage class", "text": "The new storage class uses the LVM provisioner."}, {"t": 125.64, "title": "Create a virtual machine", "text": "Now create a virtual machine that uses it. On the Virtual Machines page, select Create."}, {"t": 132.9, "title": "Namespace and name", "text": "Choose the namespace demo,"}, {"t": 136.4, "title": "Step 32", "text": "and name it demo-lvm-vm."}, {"t": 139.18, "title": "CPU and memory", "text": "Give it one CPU"}, {"t": 141.59, "title": "Step 34", "text": "and two gigabytes of memory."}, {"t": 144.18, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 146.63, "title": "Boot image", "text": "pick the openSUSE Leap image for the root disk."}, {"t": 151.24, "title": "Add a data volume", "text": "Then select Add Volume for a second disk."}, {"t": 154.75, "title": "LVM storage class", "text": "Set its storage class to demo-lvm,"}, {"t": 159.15, "title": "Size", "text": "and its size to two gigabytes."}, {"t": 161.98, "title": "Create", "text": "Select Create."}, {"t": 166.05, "title": "Running", "text": "The virtual machine is scheduled on host p5820, where the volume group lives, and it is running."}, {"t": 173.75, "title": "Open the virtual machine", "text": "Open the virtual machine,"}, {"t": 176.64, "title": "Volumes tab", "text": "and its Volumes tab."}, {"t": 179.67, "title": "Local LVM volume", "text": "Below the root disk, the two gigabyte data volume comes from demo-lvm, a thin logical volume on the local disk."}, {"t": 190.24, "title": "Wrap-up", "text": "The virtual machine runs with a local LVM volume. Next, you monitor virtual machine metrics."}], "recorded": "2026-11-13 13:02", "version": "SUSE Virtualization v1.10", "video": "v/31-lvm-local-storage/video.mp4?v=1794612201", "poster": "v/31-lvm-local-storage/poster.jpg?v=1794612201", "vtt": "v/31-lvm-local-storage/captions.vtt?v=1794612201", "num": 32}, {"id": "32-monitoring-vm-metrics", "title": "Enable monitoring and view VM metrics", "category": "Add-ons", "order": 32, "summary": "Enable the rancher-monitoring add-on and view the CPU, memory, and storage metrics of a virtual machine and of the cluster.", "level": "beginner", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "In this video, you enable the monitoring add-on in SUSE Virtualization, then view the metrics that it collects for a running virtual machine.", "duration": 100.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you enable the monitoring add-on in SUSE Virtualization, then view the metrics that it collects for a running virtual machine."}, {"t": 8.52, "title": "Add-ons", "text": "Add-ons, under Advanced, lists optional components. The rancher-monitoring add-on is disabled."}, {"t": 15.67, "title": "Open actions", "text": "Open its actions menu."}, {"t": 18.5, "title": "Enable", "text": "Select Enable. SUSE Virtualization deploys Prometheus, Grafana, and Alertmanager into the cluster."}, {"t": 27.62, "title": "Deployed", "text": "After a few minutes, the add-on state changes to Deploy Successful."}, {"t": 33.87, "title": "Virtual machines", "text": "Next, open Virtual Machines."}, {"t": 37.01, "title": "Open the VM", "text": "Select the running virtual machine demo-metrics."}, {"t": 41.26, "title": "Metrics tab", "text": "A new Virtual Machine Metrics tab is now available. Select it."}, {"t": 48.2, "title": "VM metrics", "text": "Grafana panels show this virtual machine's CPU and memory usage, and its storage traffic, latency, and IOPS."}, {"t": 59.45, "title": "Dashboard", "text": "The cluster dashboard also gains metrics. Open Dashboard."}, {"t": 64.87, "title": "Cluster Metrics", "text": "Below the capacity summary, select Cluster Metrics."}, {"t": 70.69, "title": "Cluster metrics", "text": "Cluster Metrics charts CPU utilization, load average, and memory utilization of the hosts."}, {"t": 77.92, "title": "VM metrics overview", "text": "Virtual Machine Metrics compares resource usage across virtual machines."}, {"t": 85.3, "title": "All VMs", "text": "The charts show CPU, memory, and storage usage for up to ten virtual machines."}, {"t": 92.97, "title": "Wrap-up", "text": "Monitoring is enabled and the virtual machine reports its metrics. Next, you balance virtual machines automatically."}], "recorded": "2026-11-13 13:19", "version": "SUSE Virtualization v1.10", "video": "v/32-monitoring-vm-metrics/video.mp4?v=1794612215", "poster": "v/32-monitoring-vm-metrics/poster.jpg?v=1794612215", "vtt": "v/32-monitoring-vm-metrics/captions.vtt?v=1794612215", "num": 33}, {"id": "33-vm-auto-balance", "title": "Balance virtual machines automatically", "category": "Add-ons", "order": 33, "summary": "Review the virtual-machine-auto-balance add-on, which uses the Kubernetes Descheduler to rebalance virtual machines across hosts.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["23-live-migrate-vm"], "intro": "In this video, you review the virtual machine auto balance add-on, which uses the Kubernetes Descheduler to move virtual machines away from busy hosts.", "duration": 109.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review the virtual machine auto balance add-on, which uses the Kubernetes Descheduler to move virtual machines away from busy hosts."}, {"t": 9.06, "title": "Add-ons", "text": "On the Add-ons page, the virtual-machine-auto-balance add-on is enabled. It runs the Kubernetes Descheduler."}, {"t": 17.23, "title": "Open the add-on", "text": "Open the add-on,"}, {"t": 19.9, "title": "Show Configuration", "text": "and select Show Configuration to view its settings."}, {"t": 24.18, "title": "Descheduler policy", "text": "The descheduler policy is in the valuesContent field, further down in the YAML."}, {"t": 30.71, "title": "Descheduler policy", "text": ""}, {"t": 32.38, "title": "valuesContent", "text": "The valuesContent field holds the descheduler settings and its policy."}, {"t": 37.77, "title": "Every five minutes", "text": "The descheduler runs every five minutes."}, {"t": 41.05, "title": "Eviction limit", "text": "Each run evicts at most five pods from a host."}, {"t": 45.05, "title": "Only virtual machines", "text": "The label selector limits evictions to virt-launcher pods, so only virtual machines move. Each eviction becomes a live migration."}, {"t": 54.93, "title": "System namespaces excluded", "text": "System namespaces are excluded from eviction."}, {"t": 58.69, "title": "Low thresholds", "text": "The LowNodeUtilization plugin compares reserved CPU and memory. A host below thirty percent of both counts as underutilized."}, {"t": 68.51, "title": "Target thresholds", "text": "A host above fifty percent counts as overutilized. The descheduler evicts virtual machines from it, so they move to underutilized hosts."}, {"t": 78.74, "title": "Close", "text": "Close the panel."}, {"t": 81.17, "title": "Hosts", "text": "Open the Hosts page to compare these thresholds with the reserved resources."}, {"t": 87.47, "title": "No host underutilized", "text": "Every host reserves more than thirty percent of its CPU. No host is underutilized, so the descheduler moves nothing."}, {"t": 97.36, "title": "Wrap-up", "text": "The descheduler checks the hosts every five minutes and live-migrates virtual machines only when a host crosses the thresholds. Next, you connect the cluster to SUSE Observability."}], "recorded": "2026-11-13 12:52", "version": "SUSE Virtualization v1.10", "video": "v/33-vm-auto-balance/video.mp4?v=1794612227", "poster": "v/33-vm-auto-balance/poster.jpg?v=1794612227", "vtt": "v/33-vm-auto-balance/captions.vtt?v=1794612228", "num": 34}, {"id": "34-suse-observability", "title": "Connect to SUSE Observability", "category": "Add-ons", "order": 34, "summary": "Review the suse-observability-agent add-on that connects the cluster to a SUSE Observability server.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you review the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring.", "duration": 84.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring."}, {"t": 10.3, "title": "Add-ons", "text": "On the Add-ons page, the experimental suse-observability-agent add-on is enabled, and its state is Deploy Successful."}, {"t": 19.28, "title": "Open the add-on", "text": "Open the add-on to see its details."}, {"t": 22.71, "title": "Namespace", "text": "The add-on installs the SUSE Observability agents in the suse-observability namespace."}, {"t": 29.52, "title": "Show Configuration", "text": "Select Show Configuration to view the add-on resource as YAML."}, {"t": 35.29, "title": "Configuration YAML", "text": "The configuration opens in a side panel. The last applied configuration shows the add-on as it was first created."}, {"t": 43.91, "title": "Chart and repository", "text": "It installs the suse-observability-agent chart from the SUSE Observability Helm repository."}, {"t": 51.24, "title": "Three values to fill", "text": "Its values start with three empty fields, apiKey, cluster name, and url."}, {"t": 57.65, "title": "Edit YAML", "text": "With Edit YAML, you fill them with the service token, a cluster name, and the receiver URL from SUSE Observability."}, {"t": 66.93, "title": "Close", "text": "This cluster is already connected, so close the panel without changes."}, {"t": 73.66, "title": "Wrap-up", "text": "The agent add-on is enabled and deployed, and it reports this cluster to SUSE Observability. Next, you create a VPC NAT gateway with Kube-OVN."}], "recorded": "2026-11-13 12:56", "version": "SUSE Virtualization v1.10", "video": "v/34-suse-observability/video.mp4?v=1794610552", "poster": "v/34-suse-observability/poster.jpg?v=1794610552", "vtt": "v/34-suse-observability/captions.vtt?v=1794610552", "num": 35}, {"id": "35-kubeovn-vpc-nat-gateway", "title": "Give a VPC internet access with a NAT gateway", "category": "Add-ons", "order": 35, "summary": "Create a custom VPC and subnet, add a VPC NAT gateway with an external IP and a source NAT rule, and reach the internet from a virtual machine in the VPC.", "level": "advanced", "cluster": "far-edge", "prereqs": ["20-overlay-network"], "intro": "In this video, you create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet.", "duration": 268.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet."}, {"t": 9.52, "title": "Create a VPC", "text": "Under Overlay Networks, Virtual Private Cloud lists the VPCs. Select Create."}, {"t": 16.42, "title": "Name", "text": "Name the VPC demo-vpc."}, {"t": 19.47, "title": "Add a static route", "text": "On the Static Routes tab, select Add."}, {"t": 22.76, "title": "Default route", "text": "Route all destinations, zero dot zero dot zero dot zero slash zero,"}, {"t": 28.69, "title": "Next hop", "text": "to 172.31.10.254. The NAT gateway uses this address inside the VPC."}, {"t": 38.0, "title": "Create", "text": "Select Create."}, {"t": 42.38, "title": "Create a subnet", "text": "In the demo-vpc group, select Create Subnet."}, {"t": 47.67, "title": "Name", "text": "Name the subnet demo-vpc-subnet."}, {"t": 52.17, "title": "CIDR block", "text": "Enter the CIDR block 172.31.10.0/24."}, {"t": 58.16, "title": "Provider", "text": "As the provider, select the overlay network demo-vpc-net. The VPC is already set to demo-vpc."}, {"t": 67.45, "title": "Gateway IP", "text": "Set the gateway IP to 172.31.10.1."}, {"t": 72.15, "title": "DHCP", "text": "Enable DHCP, so that virtual machines get an address and a default route."}, {"t": 78.32, "title": "NAT Outgoing", "text": "Enable NAT Outgoing, as the documentation recommends for tenant subnets."}, {"t": 84.5, "title": "Create", "text": "Select Create."}, {"t": 86.95, "title": "Subnet ready", "text": "demo-vpc-subnet now belongs to demo-vpc. Without a gateway, it has no route out of the VPC."}, {"t": 95.08, "title": "NAT & Internet", "text": "Next, open NAT and Internet, under Overlay Networks."}, {"t": 100.08, "title": "Gateways", "text": "Select Gateways,"}, {"t": 102.7, "title": "Create a NAT gateway", "text": "and then Create."}, {"t": 105.09, "title": "Name", "text": "Name the gateway demo-gw."}, {"t": 108.03, "title": "Internal tenant network", "text": "Select the internal tenant network demo-vpc-net,"}, {"t": 112.99, "title": "VPC", "text": "the VPC demo-vpc,"}, {"t": 116.65, "title": "Subnet", "text": "and the subnet demo-vpc-subnet."}, {"t": 120.83, "title": "LAN IP", "text": "The LAN IP is the gateway's address in the subnet, 172.31.10.254, the next hop of the VPC route."}, {"t": 130.78, "title": "External Subnets", "text": "Open the External Subnets tab."}, {"t": 133.67, "title": "External subnet", "text": "Select the external subnet demo-ext-subnet. In this lab, it stands in for an underlay VLAN with outbound NAT through the host."}, {"t": 144.45, "title": "Create", "text": "Select Create."}, {"t": 148.19, "title": "Gateway running", "text": "SUSE Virtualization starts the gateway as a pod with one leg in the VPC subnet and one in the external subnet."}, {"t": 156.9, "title": "External IPs", "text": "Next, give the gateway an external IP. Select External IPs,"}, {"t": 163.88, "title": "Create an external IP", "text": "and then Create."}, {"t": 166.28, "title": "Name", "text": "Name it demo-eip."}, {"t": 168.82, "title": "NAT gateway", "text": "Select the NAT gateway demo-gw,"}, {"t": 173.27, "title": "External subnet", "text": "and the external subnet. Leave V4 IP empty to take the next free address."}, {"t": 180.31, "title": "Create", "text": "Select Create."}, {"t": 182.77, "title": "Source rules", "text": "Finally, add a source NAT rule. Select Source Rules,"}, {"t": 187.95, "title": "Create a source rule", "text": "and then Create."}, {"t": 190.35, "title": "Name", "text": "Name it demo-snat."}, {"t": 192.61, "title": "EIP", "text": "Select the external IP demo-eip."}, {"t": 196.49, "title": "Internal CIDR", "text": "Enter the subnet CIDR, 172.31.10.0/24. Traffic from it leaves with the external IP as its source."}, {"t": 206.66, "title": "Create", "text": "Select Create."}, {"t": 210.7, "title": "VM in the VPC", "text": "To test the path, a small virtual machine, demo-vpc-vm, was attached to the overlay network demo-vpc-net. Open Virtual Machines."}, {"t": 222.01, "title": "Address from the subnet", "text": "Its address comes from demo-vpc-subnet, assigned by the subnet's DHCP service."}, {"t": 228.88, "title": "Console", "text": "Open its console,"}, {"t": 231.47, "title": "Step 45", "text": "in WebVNC."}, {"t": 235.23, "title": "Log in", "text": "Log in as sles,"}, {"t": 237.4, "title": "Step 47", "text": "with the password that cloud-init set."}, {"t": 241.33, "title": "Ping the internet", "text": "Ping a public address on the internet, 8.8.8.8."}, {"t": 251.29, "title": "Internet reachable", "text": "The replies arrive. Traffic leaves the VPC through demo-gw, with demo-eip as its source address."}, {"t": 261.44, "title": "Wrap-up", "text": "The virtual machine in demo-vpc reaches the internet through the NAT gateway. Next, you manage hosts out of band."}], "recorded": "2026-11-13 13:29", "version": "SUSE Virtualization v1.10", "video": "v/35-kubeovn-vpc-nat-gateway/video.mp4?v=1794611940", "poster": "v/35-kubeovn-vpc-nat-gateway/poster.jpg?v=1794611940", "vtt": "v/35-kubeovn-vpc-nat-gateway/captions.vtt?v=1794611940", "num": 36}, {"id": "36-seeder-out-of-band", "title": "Manage hosts out of band with the Seeder add-on", "category": "Add-ons", "order": 36, "summary": "Enable the harvester-seeder add-on and connect a host to its BMC, so that SUSE Virtualization reads hardware details and events over Redfish and offers IPMI power actions.", "level": "advanced", "cluster": "harvester-ai", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you enable the harvester-seeder add-on and give a host its BMC address and credentials, so that SUSE Virtualization can manage the hardware out of band.", "duration": 133.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you enable the harvester-seeder add-on and give a host its BMC address and credentials, so that SUSE Virtualization can manage the hardware out of band."}, {"t": 10.14, "title": "Seeder add-on", "text": "Under Advanced, Add-ons, open the action menu of harvester-seeder."}, {"t": 14.9, "title": "Enable", "text": "Select Enable. Seeder talks to the baseboard management controller of each host, over IPMI and Redfish."}, {"t": 23.67, "title": "Add-on deployed", "text": "The add-on reports Deploy Successful."}, {"t": 27.0, "title": "Edit the host", "text": "On the Hosts page, open the action menu of r640-1,"}, {"t": 32.31, "title": "Edit the host", "text": "and select Edit Config."}, {"t": 34.91, "title": "Out-of-band Access", "text": "Open the Out-of-band Access tab. The tab appears once the add-on is enabled."}, {"t": 40.24, "title": "Enable access", "text": "Select Enabled."}, {"t": 42.68, "title": "BMC address", "text": "Enter the address of the host's BMC, here a Dell iDRAC nine."}, {"t": 47.74, "title": "IPMI port", "text": "Enter port six two three, the IPMI over LAN port."}, {"t": 51.41, "title": "Insecure TLS", "text": "Select Insecure TLS, because this iDRAC uses a self-signed certificate."}, {"t": 56.76, "title": "Credentials secret", "text": "The credentials live in a secret. Open the Secret list and choose Create a New."}, {"t": 62.7, "title": "Secret name", "text": "Name the secret demo-idrac-r640. It is created in the default namespace."}, {"t": 68.74, "title": "BMC user", "text": "Enter the user name of a BMC account that may control power,"}, {"t": 72.77, "title": "BMC password", "text": "and its password."}, {"t": 74.44, "title": "Save the secret", "text": "Save the secret."}, {"t": 76.71, "title": "Hardware events", "text": "Event is Enabled, so Seeder polls Redfish for hardware events every hour."}, {"t": 81.84, "title": "Save", "text": "Select Save."}, {"t": 85.62, "title": "Hardware inventory", "text": "The host details now show the manufacturer, serial number, and model that Seeder read from the BMC over Redfish."}, {"t": 91.4, "title": "Out-of-band settings", "text": "The Out-of-band Access tab shows the saved BMC connection."}, {"t": 96.48, "title": "Hardware events", "text": "Open the Events tab."}, {"t": 99.02, "title": "Redfish events", "text": "It lists the hardware events that Seeder reads from Redfish, such as temperature health and failed components. Events are kept for one hour."}, {"t": 107.47, "title": "Power actions", "text": "Open the action menu of the host again."}, {"t": 110.38, "title": "Out-of-band power", "text": "Shut Down, Power On, and Reboot over IPMI appear here once the host is in maintenance mode. This single-node cluster stays running."}, {"t": 118.0, "title": "Step 29", "text": ""}, {"t": 120.98, "title": "Wrap-up", "text": "The host is connected to its BMC. SUSE Virtualization now shows hardware details and events, and offers out-of-band power actions for hosts in maintenance mode."}], "recorded": "2026-11-13 18:20", "version": "SUSE Virtualization v1.10", "video": "v/36-seeder-out-of-band/video.mp4?v=1794612079", "poster": "v/36-seeder-out-of-band/poster.jpg?v=1794612079", "vtt": "v/36-seeder-out-of-band/captions.vtt?v=1794612080", "num": 37}, {"id": "37-migrate-from-vsphere", "title": "Migrate a virtual machine from VMware vSphere", "category": "Add-ons", "order": 37, "summary": "Use the SUSE VM Migration Toolkit add-on to migrate a powered-off Linux virtual machine from VMware vSphere with a cold migration plan.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "In this video, you migrate a Linux virtual machine from VMware vSphere to SUSE Virtualization with a cold migration plan in the SUSE VM Migration Toolkit add-on.", "duration": 183.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you migrate a Linux virtual machine from VMware vSphere to SUSE Virtualization with a cold migration plan in the SUSE VM Migration Toolkit add-on."}, {"t": 11.35, "title": "VM Migration menu", "text": "The SUSE VM Migration Toolkit add-on adds the Virtual Machine Migration menu."}, {"t": 18.29, "title": "Providers", "text": "Select Providers."}, {"t": 20.98, "title": "vSphere provider", "text": "The vsphere provider connects to vCenter and is Ready. The host provider is this cluster, the migration target."}, {"t": 28.94, "title": "Back to the menu", "text": "Expand the Virtual Machine Migration menu again,"}, {"t": 33.24, "title": "Migration Overview", "text": "open Migration Overview, which lists the migration plans,"}, {"t": 38.18, "title": "Create Migration", "text": "and select Create Migration."}, {"t": 41.3, "title": "Source provider", "text": "In step one, select the existing provider vsphere instead of creating a new one."}, {"t": 48.12, "title": "Proceed", "text": "The form fills in the vCenter URL and credentials from the provider. Select Proceed."}, {"t": 55.33, "title": "Find the VM", "text": "Step two lists the virtual machines in vCenter. Search for ubuntu-nfs-src,"}, {"t": 62.0, "title": "Select the VM", "text": "a small, powered-off Ubuntu virtual machine with one CPU, two gigabytes of memory, and a ten gigabyte disk. Select it."}, {"t": 71.21, "title": "Proceed", "text": "Select Proceed."}, {"t": 73.82, "title": "Network mapping", "text": "Step three maps vSphere resources to SUSE Virtualization. Map the port group VM Network to the management network,"}, {"t": 83.81, "title": "Storage mapping", "text": "and the datastore ssd to the harvester-longhorn storage class."}, {"t": 89.75, "title": "Volume mode", "text": "The mapping defaults to Filesystem volumes. Select Edit to change the volume mode."}, {"t": 96.28, "title": "Block volumes", "text": "Choose Block, the volume mode that SUSE Virtualization virtual machine disks normally use. Keep ReadWriteMany for live migration."}, {"t": 107.09, "title": "Apply", "text": "Select Apply Override."}, {"t": 109.63, "title": "Proceed", "text": "Select Proceed."}, {"t": 112.25, "title": "Plan name", "text": "Step four reviews the plan. Name it demo-ubuntu-plan,"}, {"t": 116.67, "title": "Target namespace", "text": "and create the virtual machine in the namespace demo."}, {"t": 121.24, "title": "Cold migration", "text": "This is a cold migration. Source virtual machines are powered off during the copy. This one is already off."}, {"t": 129.25, "title": "Create and Start", "text": "Select Create and Start."}, {"t": 132.3, "title": "Migration running", "text": "The plan starts. Its row shows each step, from disk allocation and guest conversion to the disk copy."}, {"t": 141.18, "title": "Migration finished", "text": "After the copy, the plan shows Succeeded, and the virtual machine exists in SUSE Virtualization."}, {"t": 148.49, "title": "Virtual machines", "text": "Open Virtual Machines."}, {"t": 151.45, "title": "Migrated VM", "text": "ubuntu-nfs-src is in the namespace demo. It is off, like its source in vSphere."}, {"t": 158.22, "title": "Start it", "text": "Open its actions menu,"}, {"t": 161.04, "title": "Step 33", "text": "and select Start."}, {"t": 165.02, "title": "Running", "text": "The migrated Ubuntu virtual machine is running in SUSE Virtualization, converted by virt-v2v for KubeVirt."}, {"t": 175.18, "title": "Wrap-up", "text": "The virtual machine from vSphere now runs in SUSE Virtualization. Next, you find the largest virtual machine you can run."}], "recorded": "2026-11-13 14:06", "version": "SUSE Virtualization v1.10", "video": "v/37-migrate-from-vsphere/video.mp4?v=1794612260", "poster": "v/37-migrate-from-vsphere/poster.jpg?v=1794612260", "vtt": "v/37-migrate-from-vsphere/captions.vtt?v=1794612260", "num": 38}, {"id": "38-largest-vm", "title": "Create the largest virtual machine on a host", "category": "Scale & Limits", "order": 38, "summary": "Create a virtual machine with 512 vCPUs and 160 GiB of memory on one ARM64 host, and learn where those limits come from.", "level": "advanced", "cluster": "altra-ai", "prereqs": ["04-create-vm"], "intro": "In this video, you create the largest virtual machine a single ARM64 host in SUSE Virtualization accepts: 512 virtual CPUs and 160 gigabytes of memory.", "duration": 125.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create the largest virtual machine a single ARM64 host in SUSE Virtualization accepts: 512 virtual CPUs and 160 gigabytes of memory."}, {"t": 12.05, "title": "Host capacity", "text": "Each host in this cluster is an Ampere Altra server with one hundred sixty cores and about one hundred twenty gigabytes of allocatable memory."}, {"t": 20.31, "title": "Create a virtual machine", "text": "Go to Virtual Machines"}, {"t": 22.57, "title": "Step 3", "text": "and select Create."}, {"t": 32.76, "title": "Basics", "text": "Choose the namespace"}, {"t": 35.5, "title": "Step 5", "text": "and a name."}, {"t": 37.15, "title": "512 vCPUs", "text": "Enter five hundred twelve CPUs. That is the hard ceiling of the ARM64 virt machine type, even on a host with fewer cores."}, {"t": 44.94, "title": "160 GiB memory", "text": "Enter one hundred sixty gigabytes of memory, more than the host can allocate."}, {"t": 63.08, "title": "Boot image", "text": "On the Volumes tab,"}, {"t": 64.92, "title": "Step 11", "text": "select the openSUSE Leap ARM64 cloud image."}, {"t": 70.42, "title": "Console password", "text": "On Advanced Options,"}, {"t": 72.46, "title": "Step 13", "text": "select a cloud configuration template that creates a demo user with a console password."}, {"t": 78.08, "title": "Create", "text": "Select Create."}, {"t": 81.71, "title": "Running", "text": "The virtual machine is running with five hundred twelve CPUs and one hundred sixty gigabytes, on a single host."}, {"t": 89.01, "title": "Open the console", "text": "The guest has finished booting. Open its console."}, {"t": 92.65, "title": "Step 18", "text": ""}, {"t": 95.95, "title": "Log in", "text": "Log in as the demo user"}, {"t": 98.34, "title": "Step 20", "text": "and the password from the template."}, {"t": 103.4, "title": "The guest sees 512 CPUs", "text": "Check the processor count and the memory."}, {"t": 115.23, "title": "Wrap-up", "text": "The host has only one hundred sixty cores, so these CPUs are overcommitted and suit testing more than production. Next, you pack many small virtual machines onto the cluster with overcommit."}], "recorded": "2026-11-13 17:22", "version": "SUSE Virtualization v1.9 (ARM64)", "video": "v/38-largest-vm/video.mp4?v=1794608557", "poster": "v/38-largest-vm/poster.jpg?v=1794608557", "vtt": "v/38-largest-vm/captions.vtt?v=1794608557", "num": 39}, {"id": "39-vm-density", "title": "Pack more virtual machines with overcommit", "category": "Scale & Limits", "order": 39, "summary": "Raise the CPU, memory, and storage overcommit ratios, then create ten small virtual machines at once with Multiple Instance.", "level": "advanced", "cluster": "altra-ai", "prereqs": ["38-largest-vm"], "intro": "In this video, you raise the overcommit ratios in SUSE Virtualization and create ten small virtual machines at once, so each one reserves less of its host.", "duration": 106.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you raise the overcommit ratios in SUSE Virtualization and create ten small virtual machines at once, so each one reserves less of its host."}, {"t": 9.62, "title": "The overcommit-config setting", "text": "In Advanced, Settings, overcommit-config sets how much CPU, memory, and storage the scheduler may promise beyond physical capacity."}, {"t": 17.53, "title": "Edit the setting", "text": "Open its action menu,"}, {"t": 19.93, "title": "Step 3", "text": "and select Edit Setting."}, {"t": 22.85, "title": "Raise the ratios", "text": "For this demo, raise CPU from one thousand to four thousand percent,"}, {"t": 27.24, "title": "Step 5", "text": "memory from one hundred fifty to three hundred percent,"}, {"t": 30.32, "title": "Step 6", "text": "and storage to four hundred percent. These values are deliberately exaggerated."}, {"t": 34.79, "title": "Save", "text": "Select Save."}, {"t": 37.27, "title": "Multiple instances", "text": "Now go to Virtual Machines"}, {"t": 39.77, "title": "Step 10", "text": "and select Create."}, {"t": 50.02, "title": "Step 11", "text": "Select Multiple Instance."}, {"t": 52.69, "title": "Step 12", "text": "Choose the namespace,"}, {"t": 55.59, "title": "Step 13", "text": "a name prefix,"}, {"t": 57.45, "title": "Step 14", "text": "and a count of ten, the most the form creates at once."}, {"t": 60.72, "title": "Tiny virtual machines", "text": "Give each one CPU"}, {"t": 62.99, "title": "Step 16", "text": "and one gigabyte of memory."}, {"t": 65.53, "title": "Step 17", "text": "On the Volumes tab,"}, {"t": 67.38, "title": "Step 18", "text": "select the openSUSE Leap ARM64 image"}, {"t": 72.45, "title": "Step 19", "text": "and shrink the root disk to two gigabytes. Volumes are thin-provisioned, so they hold only what the guest writes."}, {"t": 79.23, "title": "Create ten", "text": "Select Create. The form creates the ten virtual machines one after another."}, {"t": 86.5, "title": "Ten running", "text": "All ten virtual machines are running. With three hundred percent memory overcommit, each one requests only a third of its memory from the scheduler."}, {"t": 95.61, "title": "Wrap-up", "text": "Overcommit lets each host admit more small virtual machines, at the cost of contention under load. Restore the default ratios when you finish testing."}], "recorded": "2026-11-13 17:01", "version": "SUSE Virtualization v1.9 (ARM64)", "video": "v/39-vm-density/video.mp4?v=1794607333", "poster": "v/39-vm-density/poster.jpg?v=1794607333", "vtt": "v/39-vm-density/captions.vtt?v=1794607333", "num": 40}, {"id": "40-netapp-trident", "title": "Run VM disks on NetApp ONTAP with Trident", "category": "Ecosystem", "order": 40, "summary": "Create a VM whose disk lives on a NetApp ONTAP StorageClass through Trident, and expand it online.", "level": "intermediate", "cluster": null, "prereqs": [], "intro": "Create a VM whose disk lives on a NetApp ONTAP StorageClass through Trident, and expand it online.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 41}, {"id": "41-kasten-backup-restore", "title": "Back up and restore a virtual machine with Veeam Kasten", "category": "Ecosystem", "order": 41, "summary": "Use Veeam Kasten, a partner backup product running on the cluster, to back up a virtual machine to S3 and restore it after it is deleted.", "level": "intermediate", "cluster": "kasten-harvester-ai", "prereqs": ["04-create-vm"], "intro": "In this video, you back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted.", "duration": 144.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted."}, {"t": 11.69, "title": "Step 1", "text": ""}, {"t": 13.34, "title": "Kasten sees the VM", "text": "Veeam Kasten runs on the cluster. Its Virtual Machines page lists demo-k10, a running SUSE Virtualization virtual machine."}, {"t": 21.63, "title": "Namespace as application", "text": "Kasten protects applications by namespace. The virtual machine has its own namespace, demo-k10, which is unmanaged so far."}, {"t": 29.5, "title": "Create a policy", "text": "Open its options menu,"}, {"t": 31.96, "title": "Create a policy", "text": "and select Create a Policy."}, {"t": 34.85, "title": "Policy name", "text": "The form fills in the policy name, demo-k10-backup, and the Snapshot action."}, {"t": 39.63, "title": "On demand", "text": "For this demo, set the backup frequency to On Demand. In production, you pick a schedule such as Daily."}, {"t": 46.01, "title": "Enable exports", "text": "Turn on Backups via Snapshot Exports. A snapshot alone stays on the cluster; the export copies it to object storage."}, {"t": 55.48, "title": "Location profile", "text": "Open the export location profile list,"}, {"t": 58.86, "title": "Location profile", "text": "and choose demo-s3, a location profile for an S3 bucket that was configured earlier."}, {"t": 64.83, "title": "Selected namespace", "text": "The demo-k10 namespace is already selected, with all of its resources, including the virtual machine and its disk."}, {"t": 71.3, "title": "Submit", "text": "Select Submit."}, {"t": 74.21, "title": "Run the policy", "text": "The policy is valid. Open its actions,"}, {"t": 78.0, "title": "Run Once", "text": "and select Run Once."}, {"t": 81.07, "title": "Confirm the run", "text": "Confirm. Kasten snapshots the disk, then exports the snapshot and the virtual machine definition to the bucket."}, {"t": 90.49, "title": "Exported restore point", "text": "In Restore Points, the run created a restore point exported to the demo-s3 profile."}, {"t": 95.75, "title": "Delete the VM", "text": "Now simulate a loss. In SUSE Virtualization, open the actions of demo-k10,"}, {"t": 102.57, "title": "Delete the VM", "text": "and select Delete."}, {"t": 104.94, "title": "Delete with its disk", "text": "The disk volume is selected too. Select Delete."}, {"t": 110.07, "title": "Restore", "text": "Back in Kasten, open the actions of the exported restore point,"}, {"t": 114.35, "title": "Restore", "text": "and select Restore."}, {"t": 117.03, "title": "Target namespace", "text": "Keep the original namespace, demo-k10. Kasten restores every artifact, including the volume and the virtual machine."}, {"t": 124.7, "title": "Start the restore", "text": "Select Restore,"}, {"t": 127.16, "title": "Confirm the restore", "text": "and confirm."}, {"t": 130.4, "title": "VM restored", "text": "In SUSE Virtualization, demo-k10 is running again, with its disk restored from the bucket."}, {"t": 137.4, "title": "Wrap-up", "text": "The virtual machine is back, restored from the exported backup. Next, you use NetApp storage with Trident."}], "recorded": "2026-11-13 17:09", "version": "SUSE Virtualization v1.10", "video": "v/41-kasten-backup-restore/video.mp4?v=1794607834", "poster": "v/41-kasten-backup-restore/poster.jpg?v=1794607834", "vtt": "v/41-kasten-backup-restore/captions.vtt?v=1794607834
