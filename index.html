 VM's disk", "text": "The virtual machine demo-resize is running. Its root disk, demo-resize-disk-0, is ten gigabytes."}, {"t": 20.45, "title": "Volume actions", "text": "On the Volumes page, open the disk's action menu,"}, {"t": 24.87, "title": "Edit Config", "text": "and select Edit Config. You don't stop the virtual machine."}, {"t": 29.77, "title": "New size", "text": "Change the size to twelve gigabytes. A disk can grow but never shrink."}, {"t": 35.07, "title": "Save", "text": "Select Save. Longhorn expands the volume while the virtual machine keeps running."}, {"t": 41.87, "title": "12 GiB", "text": "The volume now shows twelve gigabytes."}, {"t": 45.28, "title": "Open the console", "text": "The guest still sees the old partition size. Open the virtual machine's console,"}, {"t": 51.79, "title": "Step 10", "text": "in WebVNC."}, {"t": 55.47, "title": "Log in", "text": "Log in as sles,"}, {"t": 57.65, "title": "Step 12", "text": "with the password set by cloud-init."}, {"t": 61.58, "title": "Disk is bigger", "text": "lsblk shows the disk is now twelve gigabytes, but the root partition, vda3, still has the old size."}, {"t": 72.2, "title": "Grow partition and filesystem", "text": "Grow partition three into the free space, then grow the X F S root filesystem. Both work while it is mounted."}, {"t": 86.55, "title": "More space", "text": "The root filesystem now has the extra space, and the virtual machine never stopped."}, {"t": 96.53, "title": "Wrap-up", "text": "You expanded a disk online. Next, you take and restore a virtual machine snapshot."}], "recorded": "2026-11-13 14:37", "version": "SUSE Virtualization v1.10", "video": "v/13-resize-disk/video.mp4?v=1794598647", "poster": "v/13-resize-disk/poster.jpg?v=1794598647", "vtt": "v/13-resize-disk/captions.vtt?v=1794598647", "num": 13}, {"id": "14-vm-snapshot", "title": "Take and restore a virtual machine snapshot", "category": "Storage", "order": 14, "summary": "Capture a point-in-time snapshot of a running vir etworking", "order": 18, "summary": "Create a dedicated cluster network and bind a spare host NIC to it with a network config, ready for VLAN virtual machine networks.", "level": "intermediate", "cluster": "harvester-ai", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you create a cluster network, a dedicated path for virtual machine traffic, and attach a spare network interface of the host to it.", "duration": 92.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a cluster network, a dedicated path for virtual machine traffic, and attach a spare network interface of the host to it."}, {"t": 10.96, "title": "The mgmt network", "text": "Under Networks, Cluster Network Configuration, the built-in mgmt network carries management traffic on every host."}, {"t": 19.84, "title": "Create a cluster network", "text": "To separate virtual machine traffic, select Create a Cluster Network."}, {"t": 25.54, "title": "Name", "text": "Name the cluster network."}, {"t": 27.89, "title": "Create", "text": "Select Create."}, {"t": 30.35, "title": "Empty cluster network", "text": "The new cluster network has no network configuration yet, so no host interface carries its traffic."}, {"t": 37.75, "title": "Create a network config", "text": "Select Create Network Configuration."}, {"t": 41.34, "title": "Name", "text": "Name the network configuration."}, {"t": 44.16, "title": "Node selector", "text": "On the Node Selector tab, keep Select all nodes, so every host joins this cluster network."}, {"t": 50.99, "title": "Uplink", "text": "On the Uplink tab, choose the host interfaces for the cluster network."}, {"t": 56.48, "title": "Uplink NIC", "text": "Select a spare network interface. The list only shows interfaces that are free on all selected nodes."}, {"t": 64.8, "title": "Bond options", "text": "The interface becomes a bond, active-backup by default. Add a second NIC later for redundancy."}, {"t": 72.13, "title": "Create", "text": "Select Create."}, {"t": 75.0, "title": "Uplink is active", "text": "The network configuration is active. The cluster network now has an uplink on every host and is ready for VLAN networks."}, {"t": 85.4, "title": "Wrap-up", "text": "The cluster network is ready. Next, you create a VLAN virtual machine network on it."}], "recorded": "2026-11-13 14:39", "version": "SUSE Virtualization v1.10", "video": "v/18-cluster-network/video.mp4?v=1794598779", "poster": "v/18-cluster-network/poster.jpg?v=1794598779", "vtt": "v/18-cluster-network/captions.vtt?v=1794598779", "num": 18}, {"id": "19-vlan-network", "title": "Create a VLAN virtual machine network", "category": "Networking", "order": 19, "summary": "Create a VLAN-backed virtual machine network on a cluster network so that virtual machines can join an existing VLAN.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["18-cluster-network"], "intro": "In this video, you create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network.", "duration": 65.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network."}, {"t": 9.98, "title": "Create a network", "text": "Under Networks, Virtual Machine Networks, select Create."}, {"t": 14.57, "title": "Namespace", "text": "Choose the namespace that the network belongs to."}, {"t": 18.89, "title": "Name", "text": "Give it a name."}, {"t": 20.81, "title": "L2 VLAN type", "text": "The type is L2VlanNetwork, a layer two network tagged with a VLAN ID."}, {"t": 26.91, "title": "Access mode", "text": "Keep Access mode, so each virtual machine interface carries this one VLAN."}, {"t": 32.53, "title": "VLAN ID", "text": "Enter VLAN ID one hundred."}, {"t": 35.52, "title": "Cluster network", "text": "Select the cluster network that carries the VLAN. Here it is mgmt, the management network."}, {"t": 43.49, "tit Introduction", "text": "In this video, you add a second network interface to a running virtual machine. SUSE Virtualization plugs it in without a restart."}, {"t": 10.55, "title": "Open the VM actions", "text": "The virtual machine is running. Open its action menu,"}, {"t": 15.25, "title": "Edit the configuration", "text": "and select Edit Config."}, {"t": 18.09, "title": "Networks tab", "text": "Open the Networks tab."}, {"t": 20.88, "title": "Current interface", "text": "The virtual machine has one interface, on the management network. You cannot change it while the machine runs."}, {"t": 28.42, "title": "Add a network", "text": "Select Add Network."}, {"t": 31.06, "title": "Pick the network", "text": "Choose the VLAN network for the new interface."}, {"t": 35.35, "title": "Bridge binding", "text": "Keep the bridge type and the virtio model. Hot-plugging works with bridge interfaces."}, {"t": 41.5, "title": "Save", "text": "Select Save."}, {"t": 43.97, "title": "Skip the restart", "text": "SUSE Virtualization offers to restart the virtual machine. A new network interface does not need a restart."}, {"t": 51.96, "title": "Save without restart", "text": "Select Save, not Save and Restart."}, {"t": 56.99, "title": "Networks of the VM", "text": "Open the virtual machine's Networks tab."}, {"t": 60.74, "title": "Second NIC attached", "text": "The virtual machine never stopped, and it now has a second interface on the VLAN network."}, {"t": 68.48, "title": "Wrap-up", "text": "You added a network interface without downtime. Next, you set up a dedicated network for live migration."}], "recorded": "2026-11-12 21:34", "version": "SUSE Virtualization v1.10", "video": "v/21-hotplug-nic/video.mp4?v=1794585707", "poster": "v/21-hotplug-nic/poster.jpg?v=1794585707", "vtt": "v/21-hotplug-nic/captions.vtt?v=1794585707", "num": 21}, {"id": "22-live-migration-network", "title": "Set up a dedicated live migration network", "category": "Live Migration", "order": 22, "summary": "Move l 1.10", "video": "v/23-live-migrate-vm/video.mp4?v=1794585731", "poster": "v/23-live-migrate-vm/poster.jpg?v=1794585731", "vtt": "v/23-live-migrate-vm/captions.vtt?v=1794585732", "num": 23}, {"id": "23b-import-harvester-into-rancher", "title": "Import SUSE Virtualization into Rancher", "category": "Rancher Integration", "order": 23.5, "summary": "Register a SUSE Virtualization cluster with Rancher Virtualization Management, so you can manage it and provision guest clusters on it.", "level": "intermediate", "cluster": "ranchero", "prereqs": ["01-dashboard-tour"], "intro": "In this video, you import a SUSE Virtualization cluster into Rancher. Once imported, you manage it from Virtualization Management and can provision Kubernetes clusters on it.", "duration": 92.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you import a SUSE Virtualization cluster into Rancher. Once imported, you manage it from Virtualization Management and can provision Kubernetes clusters on it."}, {"t": 13.37, "title": "Import Existing", "text": "In Rancher, open Virtualization Management and select Import Existing."}, {"t": 19.47, "title": "Cluster name", "text": "Name the cluster as it should appear in Rancher."}, {"t": 22.83, "title": "Description", "text": "Add a description, for example the hardware it runs on."}, {"t": 26.99, "title": "Create", "text": "Select Create."}, {"t": 29.61, "title": "Registration URL", "text": "Rancher shows the steps and a registration URL for this cluster. Copy the URL."}, {"t": 36.42, "title": "SUSE Virtualization settings", "text": "Now open the SUSE Virtualization UI of the cluster you are importing, and go to Advanced, Settings."}, {"t": 44.51, "title": "cluster-registration-url", "text": "Find the cluster registration URL setting and open its menu."}, {"t": 49.71, "title": "Edit Setting", "text": "Select Edit Setting."}, {"t": 52.45, "title": "Paste the URL", "text": "Paste the registration URL. Leave TLS verification on, because  "Empty CD-ROM drive", "text": "Below the root disk, the virtual machine has a CD-ROM drive on the SATA bus. It shows No media."}, {"t": 27.98, "title": "Insert Image", "text": "Select Insert Image."}, {"t": 30.79, "title": "Pick the ISO image", "text": "Keep the drive name, cdrom, and choose the Alpine Linux ISO image."}, {"t": 37.01, "title": "Apply", "text": "Select Apply."}, {"t": 41.03, "title": "ISO inserted", "text": "The drive now holds the Alpine ISO image. It was attached live, and the virtual machine is still running."}, {"t": 48.96, "title": "Eject Image", "text": "When you no longer need the media, select Eject Image."}, {"t": 53.48, "title": "Confirm the eject", "text": "Confirm that you want to eject the image from the cdrom drive."}, {"t": 58.36, "title": "Drive empty again", "text": "The drive shows No media again. The drive itself stays in place, ready for the next image."}, {"t": 64.89, "title": "Never restarted", "text": "Throughout both changes, the virtual machine kept running."}, {"t": 70.74, "title": "Wrap-up", "text": "You inserted and ejected an ISO image while the virtual machine kept running. Next, you work with volume snapshots and images."}], "recorded": "2026-11-13 14:48", "version": "SUSE Virtualization v1.10", "video": "v/26-cdrom-hotplug/video.mp4?v=1794599353", "poster": "v/26-cdrom-hotplug/poster.jpg?v=1794599353", "vtt": "v/26-cdrom-hotplug/captions.vtt?v=1794599353", "num": 27}, {"id": "27-volume-operations", "title": "Snapshot, restore, and export a volume", "category": "Day-2 Operations", "order": 27, "summary": "Take a snapshot of a volume, restore it to a new volume, and export the volume to a reusable image.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["12-hotplug-volume", "17-storage-class"], "intro": "In this video, you take a snapshot of a volume, restore it to a new volume, and export the volume to an image for new virtual machines.", "duration": null, "chapters": [], "recorded": null, "version": "SUSE Virtualization v1.10", "video": null, "poster": null, "vtt": null, "num": 28}, {"id": "28-vm-scheduling-rules", "title": "Control where virtual machines run with scheduling rules", "category": "Day-2 Operations", "order": 28, "summary": "Restrict a new virtual machine to chosen hosts with a node rule, and keep it away from another virtual machine with anti-affinity.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["04-create-vm", "23-live-migrate-vm"], "intro": "In this video, you create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine.", "duration": 134.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine."}, {"t": 12.95, "title": "First VM on ser5-green", "text": "The virtual machine demo-sched-1 runs on ser5-green. The second virtual machine must not share its host."}, {"t": 21.39, "title": "Create a virtual machine", "text": "Select Create."}, {"t": 23.82, "title": "Namespace", "text": "Choose the demo namespace,"}, {"t": 27.11, "title": "Name", "text": "and name it demo-sched-2."}, {"t": 29.72, "title": "CPU", "text": "Give it one CPU"}, {"t": 32.11, "title": "Memory (GiB)", "text": "and two gigabytes of memory."}, {"t": 34.72, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 37.1, "title": "Boot image", "text": "select the openSUSE Leap image for the boot disk."}, {"t": 41.73, "title": "Node Scheduling", "text": "Open the Node Scheduling tab. By default, the virtual machine can run on any available node."}, {"t": 49.01, "title": "Scheduling rules", "text": "Select Run virtual machine on nodes matching scheduling rules."}, {"t": 53.85, "title": "Add Node Selector", "text": "Add a node selector. Its priority stays Required, so the rule must be met."}, {"t": 60.0 ts new host."}, {"t": 83.11, "title": "Wrap-up", "text": "The host went into maintenance and came back while the virtual machine kept running. Next, you pass a GPU through to a virtual machine."}], "recorded": "2026-11-13 13:02", "version": "SUSE Virtualization v1.10", "video": "v/29-host-maintenance-mode/video.mp4?v=1794592984", "poster": "v/29-host-maintenance-mode/poster.jpg?v=1794592984", "vtt": "v/29-host-maintenance-mode/captions.vtt?v=1794592984", "num": 30}, {"id": "30-gpu-passthrough", "title": "Pass a GPU through to a virtual machine", "category": "Add-ons", "order": 30, "summary": "Review a GPU enabled for PCI passthrough and attach it, with its audio function, to a virtual machine.", "level": "advanced", "cluster": "far-edge", "prereqs": ["04-create-vm", "11-hotplug-cpu-memory"], "intro": "In this video, you review a GPU that is enabled for PCI passthrough and attach it to a virtual machine, giving the guest direct access to the physical device.", "duration": null, "chapters": [], "recorded": null, "version": "SUSE Virtualization v1.10", "video": null, "poster": null, "vtt": null, "num": 31}, {"id": "31-lvm-local-storage", "title": "Use local LVM storage for virtual machines", "category": "Add-ons", "order": 31, "summary": "Enable the LVM add-on, turn a spare host disk into a volume group, and run a virtual machine on a local LVM volume.", "level": "advanced", "cluster": "far-edge", "prereqs": ["17-storage-class", "04-create-vm"], "intro": "In this video, you enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it.", "duration": 200.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it."}, {"t": 11.85, "title": "LVM add-on", "text": "Under Advanced, Add-ons, open the action menu of harvester-csi-driver-lvm."}, {"t": 19.04, "title": "Enable", "t r"], "intro": "In this video, you review the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring.", "duration": 88.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring."}, {"t": 12.84, "title": "Add-ons", "text": "On the Add-ons page, the experimental suse-observability-agent add-on is enabled, and its state is Deploy Successful."}, {"t": 21.82, "title": "Open the add-on", "text": "Open the add-on to see its details."}, {"t": 25.25, "title": "Namespace", "text": "The add-on installs the SUSE Observability agents in the suse-observability namespace."}, {"t": 32.06, "title": "Show Configuration", "text": "Select Show Configuration to view the add-on resource as YAML."}, {"t": 37.83, "title": "Configuration YAML", "text": "The configuration opens in a side panel. The last applied configuration shows the add-on as it was first created."}, {"t": 46.45, "title": "Chart and repository", "text": "It installs the suse-observability-agent chart from the SUSE Observability Helm repository."}, {"t": 53.78, "title": "Three values to fill", "text": "Its values start with three empty fields, apiKey, cluster name, and url."}, {"t": 60.19, "title": "Edit YAML", "text": "With Edit YAML, you fill them with the service token, a cluster name, and the receiver URL from SUSE Observability."}, {"t": 69.47, "title": "Close", "text": "This cluster is already connected, so close the panel without changes."}, {"t": 76.3, "title": "Wrap-up", "text": "The agent add-on is enabled and deployed, and it reports this cluster to SUSE Observability. Next, you create a VPC NAT gateway with Kube-OVN."}], "recorded": "2026-11-13 12:56", "version": "SUSE Virtualization v1.10", "video": "v/34-suse-observability/video.mp4?v=1794592597", "poster": "v/34-suse-observability/poster.jpg?v=1794592597", "vtt": "v/34-suse-observability/captions.vtt?v=1794592598", "num": 35}, {"id": "35-kubeovn-vpc-nat-gateway", "title": "Give a VPC internet access with a NAT gateway", "category": "Add-ons", "order": 35, "summary": "Create a custom VPC and subnet, add a VPC NAT gateway with an external IP and a source NAT rule, and reach the internet from a virtual machine in the VPC.", "level": "advanced", "cluster": "far-edge", "prereqs": ["20-overlay-network"], "intro": "In this video, you create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet.", "duration": 271.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet."}, {"t": 12.53, "title": "Create a VPC", "text": "Under Overlay Networks, Virtual Private Cloud lists the VPCs. Select Create."}, {"t": 19.42, "title": "Name", "text": "Name the VPC demo-vpc."}, {"t": 22.47, "title": "Add a static route", "text": "On the Static Routes tab, select Add."}, {"t": 25.76, "title": "Default route", "text": "Route all destinations, zero dot zero dot zero dot zero slash zero,"}, {"t": 31.69, "title": "Next hop", "text": "to 172.31.10.254. The NAT gateway uses this address inside the VPC."}, {"t": 41.0, "title": "Create", "text": "Select Create."}, {"t": 45.38, "title": "Create a subnet", "text": "In the demo-vpc group, select Create Subnet."}, {"t": 50.67, "title": "Name", "text": "Name the subnet demo-vpc-subnet."}, {"t": 53.88, "title": "CIDR block", "text": "Enter the CIDR block 172.31.10.0/24."}, {"t": 59.87, "title": "Provider", "text": "As the provider, select the overlay network demo-vpc-net. The VPC is already set to demo-vpc."}, {"t": 69.16, "title": "Gateway IP", "text": "Set the gateway IP to 172.31.10.1."}, {"t": 73.86, "title": "DHCP", "text": "Enable DHCP, ol from Rancher and watch the new worker join.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 52}]; const COLORS = {"Getting Started": "#30BA78", "Virtual Machines": "#2453FF", "Storage": "#FE7C3F", "Backup & Recovery": "#E9B500", "Networking": "#7F3FBF", "Live Migration": "#00A3A3", "Rancher Integration": "#0C322C", "Day-2 Operations": "#C13B78", "Add-ons": "#3F8FDB", "Scale & Limits": "#6B6B6B", "Ecosystem": "#8A5A00", "Observability": "#0F7B6C", "AI Workloads": "#76B900"}; const TRACKS = ["Getting Started", "Virtual Machines", "Storage", "Backup & Recovery", "Networking", "Live Migration", "Rancher Integration", "Day-2 Operations", "Add-ons", "Scale & Limits", "Ecosystem", "Observability", "AI Workloads"];
const byId = Object.fromEntries(DATA.map(d => [d.id, d]));

      <ol class="tl">${items.map(d => `<li data-id="${d.id}" class="${d.video ? '' : 'soon'} ${seen.has(d.id) ? 'seen' : ''} ${cur && cur.id === d.id ? 'active' : ''}">
