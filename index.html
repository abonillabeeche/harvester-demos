ter-ai. The namespace demo-k10dr holds a running virtual machine and its disk."}, {"t": 21.11, "title": "Create a policy", "text": "Open the options menu of the namespace and select Create a Policy."}, {"t": 26.14, "title": "Step 4", "text": ""}, {"t": 28.15, "title": "Export on demand", "text": "The form fills in the name demo-k10dr-backup. For this demo, set the frequency to On Demand."}, {"t": 34.8, "title": "Step 6", "text": "Turn on Backups via Snapshot Exports, so the backup leaves the cluster."}, {"t": 39.74, "title": "Step 7", "text": "Open the export location profile list,"}, {"t": 43.14, "title": "Step 8", "text": "and choose object-store, an S3 bucket that the second cluster can reach too."}, {"t": 48.33, "title": "Submit and run", "text": "Submit the policy. Kasten creates it and generates the import data for other clusters."}, {"t": 53.75, "title": "Step 10", "text": "Open the actions of the new policy and select Run Once."}, {"t": 58.54, "title": "Step 11", "text": ""}, {"t": 60.58, "title": "Step 12", "text": "Confirm. Kasten snapshots the disk and exports the snapshot and the virtual machine to the bucket."}, {"t": 69.38, "title": "Import data", "text": "When the export is done, open the policy actions again and select View Import Data."}, {"t": 75.04, "title": "Step 15", "text": ""}, {"t": 77.16, "title": "Step 16", "text": "The import token tells another Kasten instance where the exported data is and how to decrypt it. Copy it."}, {"t": 84.32, "title": "Step 19", "text": ""}, {"t": 86.0, "title": "The target cluster", "text": "Now switch to Kasten on the second cluster, far-edge. On the Policies page, select Create New Policy."}, {"t": 92.45, "title": "Step 21", "text": "Name the policy demo-k10dr-import,"}, {"t": 95.72, "title": "Import policy", "text": "and choose the Import action instead of Snapshot."}, {"t": 99.06, "title": "Step 23", "text": "Run it on demand as well. A schedule would keep importing new restore points."}, {"t": 103.67, "title": "Step 24", "text": "Paste the import token into Config Data for Import."}, {"t": 107.42, "title": "Step 25", "text": "For the profile, choose demo-object-store, which points at the same bucket."}, {"t": 112.54, "title": "Step 26", "text": ""}, {"t": 114.18, "title": "Step 27", "text": "Submit the import policy."}, {"t": 117.13, "title": "Run the import", "text": "Open its actions and select Run Once to import the restore point."}, {"t": 122.48, "title": "Step 29", "text": ""}, {"t": 124.56, "title": "Step 30", "text": "Confirm the run."}, {"t": 128.2, "title": "Imported restore point", "text": "In Restore Points, the imported restore point of demo-k10dr is ready on far-edge."}, {"t": 133.54, "title": "Restore", "text": "Open its actions and select Restore."}, {"t": 137.18, "title": "Step 35", "text": ""}, {"t": 139.22, "title": "Step 36", "text": "Keep the namespace demo-k10dr. Kasten creates it on this cluster."}, {"t": 144.66, "title": "Change the storage class", "text": "The disk used the lvm-thin class, which far-edge doesn't have. Turn on transforms for the restored resources,"}, {"t": 151.53, "title": "Step 38", "text": "and add a reference to an existing transform set."}, {"t": 155.21, "title": "Step 39", "text": ""}, {"t": 157.29, "title": "Step 40", "text": "Pick demo-to-longhorn. It moves every restored volume to the harvester-longhorn storage class."}, {"t": 162.83, "title": "Step 41", "text": ""}, {"t": 164.47, "title": "Skip the class", "text": "In the artifact list, deselect the lvm-thin storage class itself. This cluster can't use it."}, {"t": 170.97, "title": "Start the restore", "text": "Select Restore,"}, {"t": 173.43, "title": "Step 44", "text": "and confirm. Kasten copies the disk data from the bucket and recreates the virtual machine."}, {"t": 180.94, "title": "Running on far-edge", "text": "In SUSE Virtualization on far-edge, demo-k10dr is running, restored from the backup that harvester-ai exported."}, {"t": 189.99, "title": "Wrap-up", "text": "The virtual machine runs on the second cluster, restored from the exported backup in the shared bucket. Next, you run a DR plan with CloudCasa."}], "recorded": "2026-11-14 08:29", "version": "SUSE Virtualization v1.10", "video": "v/45-kasten-dr/video.mp4?v=1794663067", "poster": "v/45-kasten-dr/poster.jpg?v=1794663067", "vtt": "v/45-kasten-dr/captions.vtt?v=1794663067", "num": 44}, {"id": "46-cloudcasa-dr", "title": "Run a DR plan with CloudCasa", "category": "Disaster Recovery", "order": 46, "summary": "Define DR clusters and a DR plan in CloudCasa and fail a VM over between clusters using Longhorn.", "level": "advanced", "cluster": "far-edge", "prereqs": ["43-cloudcasa"], "intro": "Learn how to define DR clusters and a DR plan in CloudCasa, then fail a virtual machine over to a second cluster. CloudCasa also brokers DR with HPE and Dell storage replication, which this lab cannot show, so the video uses Longhorn disaster recovery volumes.", "duration": 246.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you define DR clusters and a DR plan in CloudCasa, then fail a virtual machine over to a second cluster. CloudCasa also brokers DR with HPE and Dell storage replication, which this lab cannot show, so the video uses Longhorn disaster recovery volumes."}, {"t": 17.99, "title": "The VM to protect", "text": "On far-edge, the source cluster, demo-ccdr runs on a Longhorn volume. Longhorn backs it up every five minutes to an S3 target that harvester-ai also reads."}, {"t": 27.8, "title": "CloudCasa console", "text": "Open the CloudCasa console, where the DR clusters, storage systems, plans and recovery jobs live."}, {"t": 33.39, "title": "Sign in", "text": "Sign in with your CloudCasa account."}, {"t": 36.05, "title": "Sign in", "text": ""}, {"t": 37.71, "title": "Sign in", "text": ""}, {"t": 41.31, "title": "DR clusters", "text": "The DR Clusters page lists both clusters, registered with CloudCasa DR enabled: demo-far-edge as the source and demo-harvester-ai as the target."}, {"t": 51.03, "title": "Link storage", "text": "Open demo-far-edge to link the storage system that holds its volumes."}, {"t": 56.0, "title": "Link storage", "text": "Select Link storage system. Each cluster's Longhorn was added earlier as a storage system."}, {"t": 61.89, "title": "Link storage", "text": "Open the list and choose demo-lh-far-edge, the Longhorn of the source cluster,"}, {"t": 67.69, "title": "Link storage", "text": ""}, {"t": 69.33, "title": "Link storage", "text": "and select Save to link it to the cluster."}, {"t": 73.25, "title": "Link storage", "text": "Do the same for demo-harvester-ai, the target cluster."}, {"t": 77.28, "title": "Link storage", "text": ""}, {"t": 79.33, "title": "Link storage", "text": "This time, choose its own Longhorn system, demo-lh-harvester-ai, and save."}, {"t": 84.87, "title": "Link storage", "text": ""}, {"t": 86.52, "title": "Link storage", "text": ""}, {"t": 88.59, "title": "Storage linked", "text": "Both clusters now know which storage replicates their volumes."}, {"t": 93.02, "title": "Add a DR plan", "text": "Next, on the Plans page, select Add DR plan."}, {"t": 97.36, "title": "Source cluster", "text": "Choose demo-far-edge as the source cluster,"}, {"t": 100.88, "title": "Source cluster", "text": ""}, {"t": 102.52, "title": "Source cluster", "text": "and its Longhorn storage system, demo-lh-far-edge."}, {"t": 107.43, "title": "Source cluster", "text": ""}, {"t": 109.07, "title": "Destination cluster", "text": ""}, {"t": 111.13, "title": "Destination cluster", "text": "Select Next, then choose demo-harvester-ai as the destination,"}, {"t": 115.6, "title": "Destination cluster", "text": ""}, {"t": 117.25, "title": "Destination cluster", "text": "with its storage system, demo-lh-harvester-ai."}, {"t": 121.28, "title": "Destination cluster", "text": ""}, {"t": 122.92, "title": "Selections", "text": ""}, {"t": 124.96, "title": "Selections", "text": "In Selections, open the VMs tab. A plan can also protect whole namespaces, deployments, or stateful sets."}, {"t": 133.81, "title": "Selections", "text": "Select demo-ccdr in the demo-ccdr namespace."}, {"t": 137.8, "title": "Summary", "text": ""}, {"t": 139.84, "title": "Name and inventory", "text": "Select Next, and name the plan demo-ccdr-plan."}, {"t": 144.75, "title": "Name and inventory", "text": "The inventory PVC, prepared in the cloudcasa-io namespace on the same Longhorn class, records the plan's resources and replicates with them."}, {"t": 153.49, "title": "Create the plan", "text": "Select Create. CloudCasa starts its DR agent on far-edge and takes a first inventory."}, {"t": 161.2, "title": "Plan ready", "text": "The inventory is complete, and the next Longhorn backups have brought the DR volumes on harvester-ai up to date."}, {"t": 167.49, "title": "Fail over", "text": "Now fail over. On the Recovery jobs page, select Add DR recovery,"}, {"t": 173.4, "title": "Fail over", "text": "and pick the plan demo-ccdr-plan."}, {"t": 177.87, "title": "VM options", "text": ""}, {"t": 179.92, "title": "VM options", "text": "Select Next and open VM options. The run strategy is Halted by default, which would leave the VM stopped."}, {"t": 187.55, "title": "Run strategy", "text": "Open the list and choose Use strategy from backup, so demo-ccdr starts on harvester-ai."}, {"t": 194.98, "title": "Run strategy", "text": ""}, {"t": 196.66, "title": "Summary", "text": ""}, {"t": 198.71, "title": "Summary", "text": "Select Next, and name the job demo-ccdr-failover."}, {"t": 202.77, "title": "Stop the source", "text": "Keep Stop workloads before failover on, so CloudCasa shuts down demo-ccdr on far-edge first."}, {"t": 209.04, "title": "Run now", "text": "Turn on Run now, then select Create to start the failover."}, {"t": 213.27, "title": "Run now", "text": ""}, {"t": 216.51, "title": "Failover done", "text": "The recovery job has stopped the source VM, activated the DR volumes on harvester-ai, and restored the VM there."}, {"t": 223.49, "title": "Running on harvester-ai", "text": "On harvester-ai, the target cluster, demo-ccdr is running from its activated Longhorn DR volume."}, {"t": 230.06, "title": "Source stopped", "text": "Back on far-edge, the original demo-ccdr is off, so only one copy of the VM runs."}, {"t": 237.25, "title": "Wrap-up", "text": "The virtual machine now runs on harvester-ai from its replicated Longhorn volume. To fail back, set up Longhorn replication in the other direction and create a new plan."}], "recorded": "2026-11-14 13:38", "version": "SUSE Virtualization v1.10", "video": "v/46-cloudcasa-dr/video.mp4?v=1794681718", "poster": "v/46-cloudcasa-dr/poster.jpg?v=1794681718", "vtt": "v/46-cloudcasa-dr/captions.vtt?v=1794681718", "num": 45}, {"id": "40-netapp-trident", "title": "Run VM disks on NetApp ONTAP with Trident", "category": "Ecosystem", "order": 40, "summary": "Create a VM whose disk lives on a NetApp ONTAP StorageClass through Trident, and expand it online.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["17-storage-class", "13-resize-disk"], "intro": "In this video, you give a virtual machine a disk on NetApp ONTAP storage through the Trident CSI driver, then expand that disk while the virtual machine keeps running.", "duration": 139.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you give a virtual machine a disk on NetApp ONTAP storage through the Trident CSI driver, then expand that disk while the virtual machine keeps running."}, {"t": 10.14, "title": "NetApp storage class", "text": "Trident, the NetApp CSI driver, is installed on this cluster. Its storage class netapp-iscsi creates volumes on ONTAP over iSCSI."}, {"t": 20.19, "title": "Online expansion setting", "text": "By default, SUSE Virtualization expands disks of running virtual machines only for Longhorn. The setting csi-online-expand-validation controls this."}, {"t": 29.62, "title": "Edit the setting", "text": "Open its action menu,"}, {"t": 32.01, "title": "Edit the setting", "text": "and select Edit Setting."}, {"t": 35.31, "title": "Add Trident", "text": "Select Add."}, {"t": 37.66, "title": "Add Trident", "text": "For the new provisioner, choose csi.trident.netapp.io,"}, {"t": 43.06, "title": "Allow online expansion", "text": "and keep the value True."}, {"t": 45.68, "title": "Save", "text": "Select Save."}, {"t": 48.46, "title": "Create a virtual machine", "text": "Now create a virtual machine. On the Virtual Machines page, select Create."}, {"t": 54.02, "title": "Namespace and name", "text": "Choose the namespace demo,"}, {"t": 56.9, "title": "Step 14", "text": "and name it demo-netapp."}, {"t": 59.29, "title": "CPU and memory", "text": "Give it one CPU"}, {"t": 61.27, "title": "Step 16", "text": "and two gigabytes of memory."}, {"t": 63.62, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 65.47, "title": "Boot image", "text": "pick the openSUSE Leap image for the root disk. The root disk stays on Longhorn."}, {"t": 71.6, "title": "Add a NetApp volume", "text": "Then select Add Volume for a data disk."}, {"t": 75.14, "title": "NetApp storage class", "text": "Set its storage class to netapp-iscsi,"}, {"t": 79.09, "title": "Size", "text": "and its size to one gigabyte."}, {"t": 81.59, "title": "Create", "text": "Select Create."}, {"t": 85.28, "title": "Running", "text": "Trident creates the volume on ONTAP, and the virtual machine is running."}, {"t": 89.3, "title": "Open the virtual machine", "text": "Open the virtual machine,"}, {"t": 91.74, "title": "Volumes tab", "text": "and its Volumes tab."}, {"t": 94.81, "title": "Disk on NetApp", "text": "The one gigabyte data disk comes from netapp-iscsi, a LUN on the NetApp storage system."}, {"t": 101.56, "title": "Volume actions", "text": "Now grow the NetApp disk while the virtual machine runs. On the Volumes page, open its action menu,"}, {"t": 107.99, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 110.85, "title": "New size", "text": "Change the size to two gigabytes."}, {"t": 113.55, "title": "Save", "text": "Select Save. Trident grows the LUN on ONTAP, and the virtual machine keeps running."}, {"t": 120.82, "title": "2 GiB", "text": "The NetApp volume now shows two gigabytes."}, {"t": 124.59, "title": "Still running", "text": "On the Virtual Machines page, demo-netapp is still running. The disk grew without a restart."}, {"t": 131.63, "title": "Wrap-up", "text": "The NetApp volume grew while the virtual machine kept running. Next, you fail over virtual machines to another cluster with harvey."}], "recorded": "2026-11-13 19:25", "version": "SUSE Virtualization v1.10", "video": "v/40-netapp-trident/video.mp4?v=1794999285", "poster": "v/40-netapp-trident/poster.jpg?v=1794999285", "vtt": "v/40-netapp-trident/captions.vtt?v=1794999285", "num": 46}, {"id": "41-kasten-backup-restore", "title": "Back up and restore a virtual machine with Veeam Kasten", "category": "Ecosystem", "order": 41, "summary": "Use Veeam Kasten, a partner backup product running on the cluster, to back up a virtual machine to S3 and restore it after it is deleted.", "level": "intermediate", "cluster": "kasten-harvester-ai", "prereqs": ["04-create-vm"], "intro": "Learn how to back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted.", "duration": 145.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you back up a SUSE Virtualization virtual machine to an S3 bucket with Veeam Kasten, a partner product, then restore it after it is deleted."}, {"t": 11.69, "title": "Step 1", "text": ""}, {"t": 13.34, "title": "Kasten sees the VM", "text": "Veeam Kasten runs on the cluster. Its Virtual Machines page lists demo-k10, a running SUSE Virtualization virtual machine."}, {"t": 22.67, "title": "Namespace as application", "text": "Kasten protects applications by namespace. The virtual machine has its own namespace, demo-k10, which is unmanaged so far."}, {"t": 30.53, "title": "Create a policy", "text": "Open its options menu,"}, {"t": 32.99, "title": "Create a policy", "text": "and select Create a Policy."}, {"t": 35.88, "title": "Policy name", "text": "The form fills in the policy name, demo-k10-backup, and the Snapshot action."}, {"t": 40.67, "title": "On demand", "text": "For this demo, set the backup frequency to On Demand. In production, you pick a schedule such as Daily."}, {"t": 47.05, "title": "Enable exports", "text": "Turn on Backups via Snapshot Exports. A snapshot alone stays on the cluster; the export copies it to object storage."}, {"t": 56.51, "title": "Location profile", "text": "Open the export location profile list,"}, {"t": 59.9, "title": "Location profile", "text": "and choose demo-s3, a location profile for an S3 bucket that was configured earlier."}, {"t": 65.87, "title": "Selected namespace", "text": "The demo-k10 namespace is already selected, with all of its resources, including the virtual machine and its disk."}, {"t": 72.33, "title": "Submit", "text": "Select Submit."}, {"t": 75.25, "title": "Run the policy", "text": "The policy is valid. Open its actions,"}, {"t": 79.04, "title": "Run Once", "text": "and select Run Once."}, {"t": 82.1, "title": "Confirm the run", "text": "Confirm. Kasten snapshots the disk, then exports the snapshot and the virtual machine definition to the bucket."}, {"t": 91.53, "title": "Exported restore point", "text": "In Restore Points, the run created a restore point exported to the demo-s3 profile."}, {"t": 96.79, "title": "Delete the VM", "text": "Now simulate a loss. In SUSE Virtualization, open the actions of demo-k10,"}, {"t": 103.61, "title": "Delete the VM", "text": "and select Delete."}, {"t": 105.97, "title": "Delete with its disk", "text": "The disk volume is selected too. Select Delete."}, {"t": 111.11, "title": "Restore", "text": "Back in Kasten, open the actions of the exported restore point,"}, {"t": 115.39, "title": "Restore", "text": "and select Restore."}, {"t": 118.07, "title": "Target namespace", "text": "Keep the original namespace, demo-k10. Kasten restores every artifact, including the volume and the virtual machine."}, {"t": 125.73, "title": "Start the restore", "text": "Select Restore,"}, {"t": 128.2, "title": "Confirm the restore", "text": "and confirm."}, {"t": 131.44, "title": "VM restored", "text": "In SUSE Virtualization, demo-k10 is running again, with its disk restored from the bucket."}, {"t": 138.44, "title": "Wrap-up", "text": "The virtual machine is back, restored from the exported backup. Next, you use NetApp storage with Trident."}], "recorded": "2026-11-13 17:09", "version": "SUSE Virtualization v1.10", "video": "v/41-kasten-backup-restore/video.mp4?v=1794630899", "poster": "v/41-kasten-backup-restore/poster.jpg?v=1794630899", "vtt": "v/41-kasten-backup-restore/captions.vtt?v=1794630899", "num": 47}, {"id": "43-cloudcasa", "title": "Protect VMs with CloudCasa", "category": "Ecosystem", "order": 43, "summary": "Back up SUSE Virtualization VMs with CloudCasa and restore them.", "level": "intermediate", "cluster": "harvester-ai", "prereqs": ["04-create-vm"], "intro": "Here, you back up a SUSE Virtualization virtual machine with CloudCasa, a backup service, and restore it after it is deleted.", "duration": 201.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you back up a SUSE Virtualization virtual machine with CloudCasa, a backup service, and restore it after it is deleted."}, {"t": 9.37, "title": "The VM to protect", "text": "On the Virtual Machines page, demo-cc is running in its own namespace, also named demo-cc."}, {"t": 15.98, "title": "CloudCasa console", "text": "Open the CloudCasa console. CloudCasa by Catalogic is a backup service for Kubernetes and its virtual machines."}, {"t": 23.73, "title": "Sign in", "text": "Sign in with your CloudCasa account."}, {"t": 26.39, "title": "Sign in", "text": ""}, {"t": 28.04, "title": "Sign in", "text": ""}, {"t": 31.74, "title": "Find the VM", "text": "The VMs page lists the virtual machines of every connected cluster. Filter for demo-cc."}, {"t": 38.6, "title": "Registered cluster", "text": "Its cluster, harvester-ai, was registered earlier as demo-harvester-ai, and the CloudCasa agent runs on it."}, {"t": 45.27, "title": "Define a backup", "text": "Point to the actions of demo-cc, then select Define backup."}, {"t": 50.38, "title": "Define a backup", "text": ""}, {"t": 52.49, "title": "VM selected", "text": "The backup panel opens with demo-cc already selected."}, {"t": 56.0, "title": "Copy to backup storage", "text": "Keep Copy to backup storage. CloudCasa snapshots the disk first, then copies its data off the cluster."}, {"t": 62.78, "title": "Destination storage", "text": "Open Advanced options to choose where the copy goes,"}, {"t": 66.68, "title": "CloudCasa storage", "text": "and choose CloudCasa storage, which the service provides, so you need no bucket of your own."}, {"t": 72.28, "title": "Provider and region", "text": "Then pick a provider and a region for the stored copy."}, {"t": 75.78, "title": "Provider and region", "text": ""}, {"t": 77.42, "title": "Provider and region", "text": ""}, {"t": 79.48, "title": "Provider and region", "text": ""}, {"t": 81.13, "title": "Next", "text": "Select Next to go to the policy step."}, {"t": 85.28, "title": "No policy", "text": "Keep the policy at None, so the backup runs once, on demand. A policy would run it on a schedule."}, {"t": 91.15, "title": "Next", "text": "Select Next again to reach the summary."}, {"t": 94.23, "title": "Name and retention", "text": "In the summary, name the backup demo-cc-backup,"}, {"t": 98.53, "title": "Name and retention", "text": "and keep it for one day. Run now is on."}, {"t": 101.64, "title": "Run the backup", "text": "Select Create and Run to start the backup now."}, {"t": 106.38, "title": "Step 27", "text": ""}, {"t": 108.48, "title": "Recovery point", "text": "When the job finishes, Recovery points lists a copy of demo-cc on demo-harvester-ai, kept for one day."}, {"t": 115.41, "title": "Delete the VM", "text": "Now simulate a loss. Back on the Virtual Machines page, open the actions of demo-cc,"}, {"t": 121.89, "title": "Delete the VM", "text": "and select Delete from the menu."}, {"t": 125.0, "title": "Delete with its disk", "text": "The disk volume is selected too. Select Delete."}, {"t": 130.04, "title": "Restore", "text": "Back in CloudCasa, point to the actions of the recovery point and select Restore."}, {"t": 135.76, "title": "Restore", "text": ""}, {"t": 137.84, "title": "VM to restore", "text": "The restore wizard includes demo-cc from the recovery point."}, {"t": 141.11, "title": "Destination", "text": "Select Next to choose the destination."}, {"t": 145.48, "title": "Destination", "text": "The destination is the original cluster, demo-harvester-ai."}, {"t": 149.71, "title": "Restore transforms", "text": "Select Next to see the restore transforms."}, {"t": 153.58, "title": "Restore transforms", "text": "Leave the namespace unchanged, so the virtual machine returns to demo-cc."}, {"t": 158.17, "title": "VM options", "text": "Then open VM options to check how the virtual machine starts."}, {"t": 162.25, "title": "Run strategy", "text": "The run strategy is Halted by default, which would leave it stopped. Open the list,"}, {"t": 167.87, "title": "Run strategy", "text": "and choose Use strategy from backup, so demo-cc starts again as it ran before."}, {"t": 172.55, "title": "Summary", "text": "Select Next to reach the summary."}, {"t": 176.08, "title": "Name the restore", "text": "Name the restore demo-cc-restore. Run now is on."}, {"t": 180.35, "title": "Start the restore", "text": "Select Save and Restore to start the restore job."}, {"t": 185.32, "title": "VM restored", "text": "When the restore job finishes, demo-cc is running again on the Virtual Machines page, with its disk restored from CloudCasa."}, {"t": 193.76, "title": "Wrap-up", "text": "The virtual machine is back, restored from CloudCasa storage. Next, you use NetApp storage with Trident."}], "recorded": "2026-11-14 00:20", "version": "SUSE Virtualization v1.10", "video": "v/43-cloudcasa/video.mp4?v=1794633713", "poster": "v/43-cloudcasa/poster.jpg?v=1794633713", "vtt": "v/43-cloudcasa/captions.vtt?v=1794633713", "num": 48}, {"id": "47-kasm-workspaces", "title": "Stream desktops and browsers with Kasm Workspaces", "category": "Ecosystem", "order": 47, "summary": "See how Kasm Workspaces runs on SUSE Virtualization, then log in and open a terminal, a Windows desktop and a browser session.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "In this video, you see how Kasm Workspaces runs on SUSE Virtualization virtual machines, then log in and stream a terminal, a Windows desktop and a browser.", "duration": 175.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you see how Kasm Workspaces runs on SUSE Virtualization virtual machines, then log in and stream a terminal, a Windows desktop and a browser."}, {"t": 10.78, "title": "Kasm virtual machines", "text": "Kasm is already installed on this cluster. On the Virtual Machines page, filter for kasm to see the virtual machines it uses."}, {"t": 18.38, "title": "Control plane VM", "text": "The control plane is one Ubuntu virtual machine named kasm. It runs the Kasm database, API, manager and proxy."}, {"t": 26.92, "title": "Autoscaled agents", "text": "The kasm-dynamic-agent virtual machines in the kasm-autoscale namespace were not created by hand. Kasm creates and deletes them through its Harvester provider."}, {"t": 37.08, "title": "Install with cloud-init", "text": "To see how the control plane was installed, open the Advanced Options of the kasm virtual machine."}, {"t": 43.13, "title": "Step 6", "text": "Its cloud-init user data downloads Kasm 1.19 and runs the single-server installer. The passwords on the installer line are blurred."}, {"t": 51.71, "title": "Agent disk image", "text": "New agents are cloned from images in the kasm-autoscale namespace, like this Linux agent image with the workspaces already pulled."}, {"t": 59.8, "title": "Log in to Kasm", "text": "Now open the Kasm portal and log in as the demo user."}, {"t": 63.67, "title": "Step 11", "text": "The password is typed into the masked field, then you select Login."}, {"t": 67.53, "title": "Step 12", "text": ""}, {"t": 69.57, "title": "Workspaces", "text": "The dashboard lists the workspaces this user may start: browsers, Linux desktops, a terminal and Windows Server."}, {"t": 76.23, "title": "Terminal session", "text": "Select the Terminal workspace to open its launch dialog."}, {"t": 80.08, "title": "Step 15", "text": "Then select Launch Session. Kasm starts a container on a Linux agent virtual machine."}, {"t": 88.21, "title": "Step 17", "text": "The terminal streams into the browser tab. Check the kernel, the CPUs and the memory that the session sees."}, {"t": 95.96, "title": "End the session", "text": "When you are done, open the Kasm control panel on the left edge,"}, {"t": 99.96, "title": "Step 19", "text": "select Delete Session, and confirm that you want to delete it."}, {"t": 104.35, "title": "Step 20", "text": ""}, {"t": 106.42, "title": "Windows desktop", "text": "Next, select the Windows Server 2025 workspace and launch it."}, {"t": 111.49, "title": "Step 22", "text": "Kasm hands you a ready Windows virtual machine and connects to it over RDP."}, {"t": 118.98, "title": "Step 24", "text": "The Windows desktop runs in the same browser tab, with no client to install."}, {"t": 123.56, "title": "Step 25", "text": "End it the same way, from the control panel with Delete Session."}, {"t": 127.82, "title": "Step 26", "text": ""}, {"t": 129.87, "title": "Step 27", "text": "Kasm deletes this Windows virtual machine and prepares a fresh one for the next user."}, {"t": 134.96, "title": "Browser session", "text": "Next, select the Chrome workspace and launch an isolated browser."}, {"t": 139.68, "title": "Step 29", "text": ""}, {"t": 142.98, "title": "Step 30", "text": "Chrome runs in a container on the Linux agent. Select the Web Store shortcut on the new tab page."}, {"t": 148.97, "title": "Step 31", "text": "The page loads inside the session, so nothing from the website runs on your own computer."}, {"t": 156.97, "title": "Step 32", "text": "Delete this session too when you finish, so its resources go back to the pool."}, {"t": 161.77, "title": "Step 33", "text": ""}, {"t": 163.85, "title": "Step 34", "text": ""}, {"t": 167.89, "title": "Wrap-up", "text": "Kasm streams each workspace from virtual machines on the cluster, and adds or removes agent virtual machines as demand changes."}], "recorded": "2026-11-14 08:01", "version": "SUSE Virtualization v1.10", "video": "v/47-kasm-workspaces/video.mp4?v=1794661320", "poster": "v/47-kasm-workspaces/poster.jpg?v=1794661320", "vtt": "v/47-kasm-workspaces/captions.vtt?v=1794661320", "num": 49}, {"id": "48-servicenow-inventory", "title": "See your VM inventory in ServiceNow", "category": "Ecosystem", "order": 48, "summary": "Find SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory in an everyday IT workflow.", "level": "intermediate", "cluster": "servicenow-pdi", "prereqs": [], "intro": "Find your SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory to reclaim storage and give incidents real context.", "duration": 155.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find your SUSE Virtualization VMs in the ServiceNow CMDB, and use that inventory to reclaim storage and give incidents real context."}, {"t": 12.29, "title": "The VM inventory", "text": "Virtual Machine Instances lists every VM from your clusters. A script syncs it; the ServiceNow Kubernetes Visibility Agent is the supported path."}, {"t": 20.71, "title": "Grouped by power state", "text": "Grouped by state, the list shows thirty-eight stopped VMs and seventeen running ones."}, {"t": 26.44, "title": "The stopped VMs", "text": "The stopped group lists each VM with its CPUs, memory, disks, and disk size, straight from the cluster."}, {"t": 32.98, "title": "Disk by power state", "text": "This report sums disk size by power state. Stopped VMs hold one thousand five hundred eighty-seven gigabytes, running VMs only six hundred forty-one."}, {"t": 43.32, "title": "Reclaim storage", "text": "This report ranks the stopped VMs that hold the most storage, a short list to review with their owners before you reclaim space."}, {"t": 52.82, "title": "VMs by guest OS", "text": "VMs by guest OS helps with patching and licensing. Empty means the VM runs no guest agent, so its operating system is unknown."}, {"t": 63.65, "title": "One VM and its host", "text": "The form for the VM sqlfci-n1 shows its Runs on relation, the host that runs it right now."}, {"t": 70.52, "title": "Incident context", "text": "The Tasks list ties an open incident to this VM, so the service desk sees the affected VM and its host at once."}, {"t": 78.33, "title": "Dependency map", "text": "The dependency map draws the same chain, from the VM down to its host, and flags the open incident with a warning icon."}, {"t": 86.2, "title": "Labels as tags", "text": "The tags carry the labels from the cluster, such as operating system, namespace, KubeVirt status, cluster, and node."}, {"t": 95.29, "title": "Part 2: Kubernetes Visibility Agent", "text": "Part two uses the ServiceNow Kubernetes Visibility Agent, the supported way to bring KubeVirt inventory into the CMDB. It now runs on all four clusters."}, {"t": 106.35, "title": "One informer per cluster", "text": "Kubernetes Informers lists one informer for each cluster, far-edge, retail-store, disaster-recovery, and harvester-ai. Each one has completed a full discovery."}, {"t": 116.92, "title": "KubeVirt VMs in the CMDB", "text": "KubeVirt Virtual Machines lists the VMs the agent discovered, with their cluster, namespace, and Kubernetes UID, and whether each one is running."}, {"t": 126.25, "title": "Sizing from the cluster", "text": "The CPUs, Disks, and Memory columns come straight from each VM's spec, so the sizing stays current without a separate sync."}, {"t": 135.4, "title": "Keyed on the KubeVirt UID", "text": "The agent's record for sqlfci-n1 uses the KubeVirt UID as its object ID, the same key as the record the script created in part one. Both describe the same VM."}, {"t": 147.34, "title": "Wrap-up", "text": "The agent keeps the KubeVirt inventory current on its own. Its records are the same VMs that the script fed in part one."}], "recorded": "2026-11-14 01:59 + 2026-11-14 13:54", "version": "SUSE Virtualization v1.10", "video": "v/48-servicenow-inventory/video.mp4?v=1794682529", "poster": "v/48-servicenow-inventory/poster.jpg?v=1794682529", "vtt": "v/48-servicenow-inventory/captions.vtt?v=1794682529", "num": 50}, {"id": "79-kubeovn-enable-addon", "title": "Turn on Kube-OVN", "category": "Kube-OVN", "order": 79, "summary": "Find the kubeovn-operator add-on that turns on Kube-OVN, and see what it adds to the UI, the default VPC and the overlay network menus.", "level": "advanced", "cluster": "far-edge", "prereqs": ["19-vlan-network"], "intro": "This video shows where to find the add-on that turns on Kube-OVN in SUSE Virtualization, and what it adds: virtual private clouds, subnets, and NAT gateways for virtual machine networks.", "duration": 79.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find the add-on that turns on Kube-OVN in SUSE Virtualization, and see what it adds: virtual private clouds, subnets, and NAT gateways for virtual machine networks."}, {"t": 12.66, "title": "The add-on", "text": "Under Advanced, Add-ons, Kube-OVN ships as the experimental add-on kubeovn-operator. On this cluster, it is already enabled, and its state is Deploy Successful."}, {"t": 22.91, "title": "Enable or disable", "text": "Open its action menu."}, {"t": 25.45, "title": "Step 3", "text": "On a cluster where the add-on is off, this item reads Enable. Selecting it installs the Kube-OVN operator, which deploys Kube-OVN next to the default cluster network. Here it is already on, so leave the menu."}, {"t": 38.35, "title": "Step 4", "text": ""}, {"t": 41.01, "title": "Overlay Networks", "text": "The add-on also adds the Overlay Networks menu."}, {"t": 44.75, "title": "Default VPC", "text": "Select Virtual Private Cloud."}, {"t": 47.76, "title": "Step 7", "text": "Kube-OVN starts with the default VPC, ovn-cluster. Its subnet ovn-default and the join subnet are created by Kube-OVN itself. The other VPCs and subnets on this page belong to other workloads in this lab."}, {"t": 60.39, "title": "What you can build", "text": "From these pages, you create your own VPCs and subnets, connect VPCs with peering, and give them internet access with NAT gateways. The next videos build them step by step."}, {"t": 71.97, "title": "Wrap-up", "text": "Kube-OVN is on, with its default VPC and subnets. Next, you build your own VPC with several subnets."}], "recorded": "2026-11-14 18:02", "version": "SUSE Virtualization v1.10", "video": "v/79-kubeovn-enable-addon/video.mp4?v=1794697345", "poster": "v/79-kubeovn-enable-addon/poster.jpg?v=1794697345", "vtt": "v/79-kubeovn-enable-addon/captions.vtt?v=1794697345", "num": 51}, {"id": "80-kubeovn-vpc-peering-dhcp", "title": "Connect VPCs with peering and DHCP", "category": "Kube-OVN", "order": 80, "summary": "Create two Kube-OVN VPCs with DHCP-enabled subnets, peer them, and show VMs reaching each other across the peering.", "level": "advanced", "cluster": "far-edge", "prereqs": ["35-kubeovn-vpc-nat-gateway"], "intro": "Create two virtual private clouds with DHCP-enabled subnets on SUSE Virtualization, peer them, and check that virtual machines in each VPC reach each other.", "duration": 263.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you create two virtual private clouds with DHCP-enabled subnets on SUSE Virtualization, peer them, and show that virtual machines in each VPC reach each other."}, {"t": 11.9, "title": "Create the first VPC", "text": "The Virtual Private Cloud page lists the VPCs and their subnets. Select Create to add the first VPC."}, {"t": 18.89, "title": "Name", "text": "Name it demo-vpc-a. Routes and peerings come later, so leave the tabs empty for now."}, {"t": 24.84, "title": "Save", "text": "Then select Create to save the VPC."}, {"t": 28.06, "title": "Subnet in VPC A", "text": "In the demo-vpc-a group, select Create Subnet."}, {"t": 32.75, "title": "Name", "text": "Name the subnet demo-subnet-a."}, {"t": 35.53, "title": "CIDR block", "text": "Use the CIDR block 10.210.1.0/24."}, {"t": 40.41, "title": "Provider", "text": "As the provider, select the overlay network demo-net-a. The VPC is already set to demo-vpc-a."}, {"t": 48.51, "title": "Gateway IP", "text": "Set the gateway IP to 10.210.1.1."}, {"t": 52.66, "title": "DHCP", "text": "Enable DHCP, so that virtual machines on this subnet get an address and a default route automatically."}, {"t": 59.16, "title": "Save", "text": "Select Create to save the subnet."}, {"t": 62.42, "title": "Create the second VPC", "text": "Now create the second VPC, which points its peering at the first one."}, {"t": 67.34, "title": "Name", "text": "Name it demo-vpc-b."}, {"t": 69.84, "title": "VPC Peerings", "text": "Open the VPC Peerings tab and add a peering."}, {"t": 72.99, "title": "Step 14", "text": "Each side of a peering gets a connect address from a small link network."}, {"t": 76.61, "title": "Local connect IP", "text": "Enter the local connect IP, 169.254.210.2/30, for demo-vpc-b's end of the link."}, {"t": 83.6, "title": "Remote VPC", "text": "As the remote VPC, select demo-vpc-a."}, {"t": 87.68, "title": "Static route", "text": "The peering alone carries no traffic. On the Static Routes tab, add a route to the other VPC."}, {"t": 93.32, "title": "Step 18", "text": "The route sends traffic for demo-subnet-a across the link."}, {"t": 97.19, "title": "Destination", "text": "Enter the destination, demo-subnet-a's CIDR block, 10.210.1.0/24,"}, {"t": 103.29, "title": "Next hop", "text": "and the next hop, 169.254.210.1, which is demo-vpc-a's end of the peering."}, {"t": 110.32, "title": "Save", "text": "Select Create to save demo-vpc-b with its peering and route."}, {"t": 114.86, "title": "Subnet in VPC B", "text": "Add a subnet to demo-vpc-b the same way. Select Create Subnet in its group."}, {"t": 120.63, "title": "Name", "text": "Name it demo-subnet-b,"}, {"t": 123.41, "title": "CIDR block", "text": "with the CIDR block 10.210.2.0/24,"}, {"t": 127.96, "title": "Provider", "text": "the overlay network demo-net-b as the provider,"}, {"t": 131.87, "title": "Gateway IP", "text": "and the gateway IP 10.210.2.1."}, {"t": 135.74, "title": "DHCP", "text": "Enable DHCP here as well, then save."}, {"t": 139.24, "title": "Save", "text": "Select Create to save demo-subnet-b."}, {"t": 142.85, "title": "Edit the first VPC", "text": "A peering needs both sides. Open the action menu of demo-vpc-a,"}, {"t": 148.47, "title": "Step 30", "text": "and select Edit Config to add the matching peering."}, {"t": 152.61, "title": "Peer with VPC B", "text": "On the VPC Peerings tab, add the other end of the link."}, {"t": 156.57, "title": "Step 32", "text": "This side uses the first address of the same link network."}, {"t": 160.01, "title": "Local connect IP", "text": "Enter 169.254.210.1/30 as the local connect IP,"}, {"t": 165.17, "title": "Remote VPC", "text": "and select demo-vpc-b as the remote VPC."}, {"t": 169.23, "title": "Route to VPC B", "text": "Then add the route back on the Static Routes tab."}, {"t": 172.34, "title": "Step 36", "text": "This route sends traffic for demo-subnet-b across the link."}, {"t": 176.16, "title": "Destination", "text": "The destination is 10.210.2.0/24,"}, {"t": 180.55, "title": "Next hop", "text": "and the next hop is demo-vpc-b's connect IP, 169.254.210.2."}, {"t": 186.61, "title": "Save", "text": "Select Save to apply the peering and the route."}, {"t": 192.56, "title": "One VM per VPC", "text": "To test the peering, two small virtual machines were attached, demo-vm-a to demo-net-a and demo-vm-b to demo-net-b."}, {"t": 200.7, "title": "Addresses from DHCP", "text": "demo-vm-a got 10.210.1.2 from demo-subnet-a's DHCP service,"}, {"t": 205.97, "title": "Step 43", "text": "and demo-vm-b got 10.210.2.2 from demo-subnet-b. Nobody configured either address by hand."}, {"t": 212.04, "title": "Console of VM A", "text": "Open the console of demo-vm-a in WebVNC."}, {"t": 215.91, "title": "Step 45", "text": ""}, {"t": 219.0, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 222.62, "title": "Step 47", "text": ""}, {"t": 225.23, "title": "DHCP lease", "text": "The address and the default route through 10.210.1.1 both came from DHCP."}, {"t": 232.69, "title": "Ping across the peering", "text": "Now ping demo-vm-b, 10.210.2.2, in the other VPC."}, {"t": 243.36, "title": "VPCs connected", "text": "The replies arrive. Traffic leaves through demo-vpc-a's router, crosses the peering, and reaches demo-vpc-b."}, {"t": 252.84, "title": "Wrap-up", "text": "The two VPCs stay isolated from everything else, but their subnets now reach each other through the peering. Next, you isolate virtual machines with microsegmentation."}], "recorded": "2026-11-14 00:56", "version": "SUSE Virtualization v1.10", "video": "v/80-kubeovn-vpc-peering-dhcp/video.mp4?v=1794635973", "poster": "v/80-kubeovn-vpc-peering-dhcp/poster.jpg?v=1794635973", "vtt": "v/80-kubeovn-vpc-peering-dhcp/captions.vtt?v=1794635973", "num": 52}, {"id": "81-kubeovn-microsegmentation", "title": "Isolate VMs with microsegmentation", "category": "Kube-OVN", "order": 81, "summary": "Apply a policy that blocks traffic between two VMs except for one port, and show what gets through and what is dropped.", "level": "advanced", "cluster": "far-edge", "prereqs": ["80-kubeovn-vpc-peering-dhcp"], "intro": "Learn how to add access control rules to a Kube-OVN subnet on SUSE Virtualization, so that one virtual machine reaches another only on a single port.", "duration": 165.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you add access control rules to a Kube-OVN subnet on SUSE Virtualization, so that one virtual machine reaches another only on a single port."}, {"t": 9.37, "title": "Two VMs on one subnet", "text": "demo-web, at 10.220.0.10, serves a small web page on ports 80 and 8080."}, {"t": 15.32, "title": "Step 2", "text": "demo-client, at 10.220.0.20, sits on the same overlay subnet, demo-seg-subnet. No rule limits traffic between them yet."}, {"t": 23.87, "title": "Before the rules", "text": "Open the console of demo-client in WebVNC to test the connection first."}, {"t": 29.26, "title": "Step 4", "text": ""}, {"t": 32.05, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 35.67, "title": "Step 6", "text": ""}, {"t": 38.28, "title": "Everything gets through", "text": "Without rules, both ping and the web page on port 8080 answer."}, {"t": 46.45, "title": "Edit the subnet", "text": "On the Virtual Private Cloud page, open the action menu of demo-seg-subnet,"}, {"t": 51.88, "title": "Step 10", "text": "and select Edit Config to change the subnet."}, {"t": 55.34, "title": "Access Control List", "text": "The Access Control List tab holds OVN rules that the subnet's virtual switch applies to every port."}, {"t": 61.18, "title": "Allow port 80", "text": "Add the first rule, which lets web traffic through."}, {"t": 64.03, "title": "Step 13", "text": "Choose the action Allow-related, so that the replies come back too,"}, {"t": 69.17, "title": "Step 14", "text": "and the direction To-lport, for traffic going to a virtual machine's port."}, {"t": 74.59, "title": "Step 15", "text": "Give it priority 1010. Higher priorities win."}, {"t": 78.66, "title": "Match", "text": "The match selects traffic from demo-client to demo-web on TCP port 80."}, {"t": 82.96, "title": "Drop the rest", "text": "Add a second rule that drops everything else between the two machines."}, {"t": 87.03, "title": "Step 18", "text": "Choose the action Drop,"}, {"t": 90.77, "title": "Step 19", "text": "the same direction, To-lport,"}, {"t": 94.26, "title": "Step 20", "text": "and the lower priority 1000, so the port 80 rule is checked first."}, {"t": 98.12, "title": "Match", "text": "This match covers all traffic from demo-client to demo-web, any protocol, any port."}, {"t": 104.43, "title": "Save", "text": "Select Save. The rules apply right away, with no restart of either machine."}, {"t": 110.14, "title": "Test again", "text": "Go back to Virtual Machines and open the console of demo-client again."}, {"t": 114.96, "title": "Step 24", "text": ""}, {"t": 117.0, "title": "Step 25", "text": ""}, {"t": 119.75, "title": "Ping is dropped", "text": "The session is still logged in. Ping demo-web again."}, {"t": 126.86, "title": "Step 27", "text": "All three packets are lost. The drop rule matches ICMP."}, {"t": 130.84, "title": "Port 80 gets through", "text": "Now request the web page on port 80."}, {"t": 134.83, "title": "Step 29", "text": "The page arrives. The higher-priority allow rule lets port 80 through, and its replies come back."}, {"t": 140.97, "title": "Port 8080 is dropped", "text": "Finally, try port 8080, which answered before the rules."}, {"t": 148.55, "title": "Only port 80 passes", "text": "The connection times out. Only port 80 passes between the two machines; everything else is dropped."}, {"t": 157.48, "title": "Wrap-up", "text": "The subnet's access control list now drops everything from demo-client to demo-web except web traffic on port 80."}], "recorded": "2026-11-14 01:18", "version": "SUSE Virtualization v1.10", "video": "v/81-kubeovn-microsegmentation/video.mp4?v=1794637154", "poster": "v/81-kubeovn-microsegmentation/poster.jpg?v=1794637154", "vtt": "v/81-kubeovn-microsegmentation/captions.vtt?v=1794637154", "num": 53}, {"id": "82-kubeovn-vpc-tiers", "title": "Build a VPC with several subnets", "category": "Kube-OVN", "order": 82, "summary": "Create a Kube-OVN VPC with three subnets for the web, app and database tiers of an application, and show that virtual machines in one VPC reach each other across subnets.", "level": "advanced", "cluster": "far-edge", "prereqs": ["79-kubeovn-enable-addon"], "intro": "In this video, you build a virtual private cloud with three subnets, one for each tier of an application: web, app, and database. Then you check that the tiers reach each other inside the VPC.", "duration": 176.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you build a virtual private cloud with three subnets, one for each tier of an application: web, app, and database. Then you check that the tiers reach each other inside the VPC."}, {"t": 11.86, "title": "Create a VPC", "text": "Under Overlay Networks, open Virtual Private Cloud and select Create."}, {"t": 16.98, "title": "Name", "text": "Name the VPC demo-3tier. A VPC is a separate router, and its address space is isolated from every other VPC."}, {"t": 24.77, "title": "Save", "text": "Select Create."}, {"t": 27.12, "title": "Web subnet", "text": "In the demo-3tier group, select Create Subnet to add the first tier."}, {"t": 32.21, "title": "Name", "text": "Name it demo-web."}, {"t": 34.23, "title": "CIDR block", "text": "The web tier gets the CIDR block 10.230.1.0/24."}, {"t": 40.01, "title": "Provider", "text": "As the provider, select the overlay network demo-web-net. Virtual machines attach to this network, and Kube-OVN gives them addresses from this subnet."}, {"t": 50.38, "title": "Gateway IP", "text": "The gateway, 10.230.1.1, is the VPC router's port in this subnet."}, {"t": 56.02, "title": "DHCP", "text": "Enable DHCP, so that virtual machines get their address and route automatically."}, {"t": 61.08, "title": "Save", "text": "Select Create."}, {"t": 63.42, "title": "App subnet", "text": "Add the app tier the same way,"}, {"t": 66.15, "title": "Step 12", "text": ""}, {"t": 67.8, "title": "Step 13", "text": "with the name demo-app, the CIDR block 10.230.2.0/24,"}, {"t": 73.5, "title": "Step 14", "text": "the overlay network demo-app-net,"}, {"t": 76.78, "title": "Step 15", "text": "the gateway 10.230.2.1,"}, {"t": 80.84, "title": "Step 16", "text": "and DHCP enabled."}, {"t": 83.04, "title": "Step 17", "text": ""}, {"t": 85.08, "title": "Database subnet", "text": "Then the database tier,"}, {"t": 87.82, "title": "Step 19", "text": ""}, {"t": 89.48, "title": "Step 20", "text": "demo-db, with 10.230.3.0/24,"}, {"t": 94.22, "title": "Step 21", "text": "the overlay network demo-db-net,"}, {"t": 97.75, "title": "Step 22", "text": "the gateway 10.230.3.1,"}, {"t": 102.3, "title": "Step 23", "text": "and DHCP."}, {"t": 104.26, "title": "Step 24", "text": ""}, {"t": 106.3, "title": "Three tiers, one VPC", "text": "The demo-3tier VPC now lists its three subnets."}, {"t": 112.76, "title": "One VM per tier", "text": "To test the network, three small virtual machines were created with kubectl, one on each tier's overlay network. Each runs a small web service, on port 80, 8080, or 5432."}, {"t": 124.93, "title": "Addresses per subnet", "text": "demo-web got 10.230.1.10 in the web subnet,"}, {"t": 129.97, "title": "Step 29", "text": "and demo-db got 10.230.3.10 in the database subnet."}, {"t": 134.92, "title": "Test from the web tier", "text": "Open the console of demo-web in WebVNC."}, {"t": 138.83, "title": "Step 31", "text": ""}, {"t": 142.14, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 146.2, "title": "Step 34", "text": ""}, {"t": 148.8, "title": "Across subnets", "text": "Ping demo-db, and request the page on its port 5432."}, {"t": 156.07, "title": "Tiers connected", "text": "Both answer. Subnets in the same VPC route to each other through the VPC router, with no extra configuration. That is convenient, but every tier also reaches the database."}, {"t": 169.11, "title": "Wrap-up", "text": "One VPC now holds three subnets, and its router connects them. Next, you make the database subnet private."}], "recorded": "2026-11-14 20:27", "version": "SUSE Virtualization v1.10", "video": "v/82-kubeovn-vpc-tiers/video.mp4?v=1794994056", "poster": "v/82-kubeovn-vpc-tiers/poster.jpg?v=1794994056", "vtt": "v/82-kubeovn-vpc-tiers/captions.vtt?v=1794994056", "num": 54}, {"id": "83-kubeovn-private-subnet", "title": "Make a subnet private", "category": "Kube-OVN", "order": 83, "summary": "Turn on Private Subnet for the database subnet of a Kube-OVN VPC and allow only the app subnet, so the web tier can no longer reach the database.", "level": "advanced", "cluster": "far-edge", "prereqs": ["82-kubeovn-vpc-tiers"], "intro": "Make the database subnet of a VPC private, so that only the app tier can reach it.", "duration": 105.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you make the database subnet of a VPC private, so that only the app tier can reach it."}, {"t": 7.43, "title": "Three tiers", "text": "The VPC demo-3tier has a web, an app, and a database subnet, with one virtual machine in each. Right now, every subnet reaches every other one."}, {"t": 17.23, "title": "Edit the database subnet", "text": "Open the action menu of the demo-db subnet,"}, {"t": 21.82, "title": "Step 3", "text": "and select Edit Config."}, {"t": 24.39, "title": "Private Subnet", "text": "Under Private Subnet, select Enabled. A private subnet drops all traffic that comes from outside the subnet."}, {"t": 30.73, "title": "Allow the app tier", "text": "Add an exception for the subnets that may still connect."}, {"t": 34.03, "title": "Step 6", "text": "Enter the app subnet, 10.230.2.0/24. The web subnet is not on the list."}, {"t": 40.42, "title": "Save", "text": "Select Save. Kube-OVN updates the subnet's rules at once, without restarting any virtual machine."}, {"t": 48.24, "title": "Test from the web tier", "text": "Go to Virtual Machines and open the console of demo-web."}, {"t": 52.12, "title": "Step 9", "text": ""}, {"t": 54.16, "title": "Step 10", "text": ""}, {"t": 56.94, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 60.56, "title": "Step 12", "text": ""}, {"t": 63.16, "title": "Web to database", "text": "Request the database tier's port 5432."}, {"t": 70.46, "title": "Dropped", "text": "The connection times out. The web subnet is not allowed into the private subnet."}, {"t": 75.52, "title": "Test from the app tier", "text": "Now open the console of demo-app."}, {"t": 78.58, "title": "Step 17", "text": ""}, {"t": 81.38, "title": "Step 18", "text": "Log in the same way."}, {"t": 83.17, "title": "Step 19", "text": ""}, {"t": 85.83, "title": "App to database", "text": "Send the same request."}, {"t": 89.58, "title": "Allowed", "text": "The answer arrives. The app subnet is on the allow list, so the app tier still reaches the database."}, {"t": 96.5, "title": "Wrap-up", "text": "The database subnet is private: the app tier still reaches it, the web tier is dropped. Next, you limit traffic down to single ports with access control lists."}], "recorded": "2026-11-14 18:28", "version": "SUSE Virtualization v1.10", "video": "v/83-kubeovn-private-subnet/video.mp4?v=1794698935", "poster": "v/83-kubeovn-private-subnet/poster.jpg?v=1794698935", "vtt": "v/83-kubeovn-private-subnet/captions.vtt?v=1794698935", "num": 55}, {"id": "84-kubeovn-three-tier-acls", "title": "Microsegment a three-tier app", "category": "Kube-OVN", "order": 84, "summary": "Add access control lists to the app and database subnets of a Kube-OVN VPC, so the web tier reaches the app tier only on port 8080 and the app tier reaches the database only on port 5432.", "level": "advanced", "cluster": "far-edge", "prereqs": ["81-kubeovn-microsegmentation"], "intro": "Here, you microsegment a three-tier application. Access control lists on two subnets let each tier talk to the next one on a single port, and drop everything else.", "duration": 189.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you microsegment a three-tier application. Access control lists on two subnets let each tier talk to the next one on a single port, and drop everything else."}, {"t": 11.41, "title": "The plan", "text": "The VPC demo-3tier holds a web, an app, and a database subnet, one virtual machine each. The goal: web may reach app only on port 8080, app may reach the database only on port 5432, and nothing else crosses tiers."}, {"t": 25.2, "title": "App tier rules", "text": "Start with the app tier. Open the action menu of demo-app and select Edit Config, then the Access Control List tab."}, {"t": 32.83, "title": "Step 4", "text": ""}, {"t": 34.84, "title": "Step 5", "text": ""}, {"t": 36.5, "title": "Step 6", "text": "Add the first rule."}, {"t": 38.29, "title": "Step 7", "text": "Choose Allow-related, so replies come back,"}, {"t": 42.86, "title": "Step 8", "text": "and To-lport, for traffic arriving at the subnet's ports."}, {"t": 47.48, "title": "Step 9", "text": ""}, {"t": 49.09, "title": "Step 10", "text": "With priority 1010, the match lets the web subnet in on TCP port 8080."}, {"t": 54.27, "title": "Step 11", "text": "Add a second rule, with the action Drop and the same direction,"}, {"t": 58.14, "title": "Step 12", "text": ""}, {"t": 60.55, "title": "Step 13", "text": ""}, {"t": 62.92, "title": "Step 14", "text": ""}, {"t": 64.57, "title": "Step 15", "text": "with the lower priority 1000, for all other traffic from the web subnet."}, {"t": 69.27, "title": "Step 16", "text": "Select Save."}, {"t": 71.85, "title": "Database tier rules", "text": "Now the database tier. Edit demo-db the same way, and add two rules on its Access Control List tab."}, {"t": 79.8, "title": "Step 19", "text": ""}, {"t": 81.81, "title": "Step 20", "text": ""}, {"t": 83.46, "title": "Step 21", "text": ""}, {"t": 85.12, "title": "Step 22", "text": ""}, {"t": 87.5, "title": "Step 23", "text": ""}, {"t": 89.87, "title": "Step 24", "text": ""}, {"t": 91.53, "title": "Step 25", "text": "The first rule allows the app subnet on TCP port 5432, at priority 1010."}, {"t": 97.67, "title": "Step 26", "text": ""}, {"t": 99.31, "title": "Step 27", "text": ""}, {"t": 101.68, "title": "Step 28", "text": ""}, {"t": 104.07, "title": "Step 29", "text": ""}, {"t": 105.72, "title": "Step 30", "text": "The second drops everything else from the web and app subnets, at priority 1000."}, {"t": 111.12, "title": "Step 31", "text": "Select Save."}, {"t": 113.7, "title": "Test from the web tier", "text": "Open the console of demo-web."}, {"t": 116.81, "title": "Step 34", "text": ""}, {"t": 119.66, "title": "Step 35", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 123.28, "title": "Step 36", "text": ""}, {"t": 125.89, "title": "Web to app on 8080", "text": "Request the app tier on port 8080."}, {"t": 129.55, "title": "Step 38", "text": "The app answers. This is the one path the web tier is allowed."}, {"t": 133.53, "title": "Everything else dropped", "text": "Now ping the app tier, and try the database directly."}, {"t": 143.8, "title": "Step 40", "text": "Both fail. Ping to the app tier is dropped, and the web tier can't reach the database at all."}, {"t": 149.41, "title": "Test from the app tier", "text": "Then open the console of demo-app."}, {"t": 152.61, "title": "Step 43", "text": ""}, {"t": 155.4, "title": "Step 44", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 159.02, "title": "Step 45", "text": ""}, {"t": 161.63, "title": "App to database", "text": "Request the database on port 5432, then ping it."}, {"t": 169.29, "title": "One port per path", "text": "The database answers on port 5432, and the ping is dropped. Each tier reaches the next one on one port only."}, {"t": 178.7, "title": "Wrap-up", "text": "Each tier now reaches the next one on exactly one port, and the web tier can't touch the database. Next, you publish a virtual machine to the outside with a DNAT rule."}], "recorded": "2026-11-14 19:45", "version": "SUSE Virtualization v1.10", "video": "v/84-kubeovn-three-tier-acls/video.mp4?v=1794703554", "poster": "v/84-kubeovn-three-tier-acls/poster.jpg?v=1794703554", "vtt": "v/84-kubeovn-three-tier-acls/captions.vtt?v=1794703554", "num": 56}, {"id": "85-kubeovn-dnat-port-forward", "title": "Publish a VM with DNAT", "category": "Kube-OVN", "order": 85, "summary": "Give a VPC NAT gateway a second external IP and add a destination NAT rule, so a web server inside a Kube-OVN VPC is reachable from the external network on port 8080.", "level": "advanced", "cluster": "far-edge", "prereqs": ["35-kubeovn-vpc-nat-gateway"], "intro": "Publish a web server that lives inside a virtual private cloud. A destination NAT rule on the VPC's NAT gateway forwards an external IP and port to the virtual machine.", "duration": 150.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you publish a web server that lives inside a virtual private cloud. A destination NAT rule on the VPC's NAT gateway forwards an external IP and port to the virtual machine."}, {"t": 11.43, "title": "The NAT gateway", "text": "Under Overlay Networks, NAT and Internet, the VPC demo-3tier already has the NAT gateway demo-gw, built as in the NAT gateway video. It connects the web subnet to the external subnet."}, {"t": 24.12, "title": "A new external IP", "text": "The web server needs its own external IP. Go to External IPs,"}, {"t": 29.47, "title": "Step 3", "text": "and then Create."}, {"t": 31.52, "title": "Name", "text": "Name it demo-web-eip."}, {"t": 34.19, "title": "NAT gateway", "text": "Select the NAT gateway demo-gw,"}, {"t": 37.95, "title": "External subnet", "text": "and the external subnet."}, {"t": 40.98, "title": "V4 IP", "text": "Pick the address, 172.31.250.100, so that it is easy to remember."}, {"t": 47.04, "title": "Step 8", "text": "Select Create."}, {"t": 49.73, "title": "Step 9", "text": "The gateway takes the address and answers for it on the external subnet."}, {"t": 54.19, "title": "Destination rule", "text": "Now forward a port. Select Destination Rules,"}, {"t": 57.85, "title": "Step 11", "text": "and then Create."}, {"t": 59.9, "title": "Name", "text": "Name it demo-web-dnat."}, {"t": 62.4, "title": "EIP", "text": "Select the external IP demo-web-eip."}, {"t": 66.89, "title": "External port", "text": "Clients connect to external port 8080,"}, {"t": 70.32, "title": "Internal target", "text": "and the gateway forwards them to demo-web, 10.230.1.10,"}, {"t": 76.19, "title": "Step 16", "text": "on its internal port 80."}, {"t": 78.63, "title": "Protocol", "text": "The protocol is TCP."}, {"t": 81.41, "title": "Step 18", "text": "Select Create."}, {"t": 83.75, "title": "Rule ready", "text": "The rule shows the external IP it listens on."}, {"t": 87.2, "title": "A client outside the VPC", "text": "demo-outside sits on the external subnet, outside the VPC. In this lab, that subnet stands in for an underlay VLAN, because the host has only one network card."}, {"t": 96.52, "title": "Step 22", "text": "Open its console."}, {"t": 98.83, "title": "Step 23", "text": ""}, {"t": 101.56, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 105.23, "title": "Step 25", "text": ""}, {"t": 107.83, "title": "The VPC stays private", "text": "First, try the web server's own address, 10.230.1.10."}, {"t": 116.69, "title": "Step 27", "text": "There is no route to it from outside. The VPC's addresses are private."}, {"t": 121.35, "title": "Through the external IP", "text": "Now request the external IP, 172.31.250.100, on port 8080."}, {"t": 128.98, "title": "Published", "text": "The page from demo-web arrives. The gateway translated the external IP and port to the virtual machine inside the VPC."}, {"t": 138.54, "title": "Wrap-up", "text": "The web server inside the VPC now answers on the external IP, port 8080, and nothing else of the VPC is exposed. Next, you connect two VPCs with peering."}], "recorded": "2026-11-14 19:59", "version": "SUSE Virtualization v1.10", "video": "v/85-kubeovn-dnat-port-forward/video.mp4?v=1794704431", "poster": "v/85-kubeovn-dnat-port-forward/poster.jpg?v=1794704431", "vtt": "v/85-kubeovn-dnat-port-forward/captions.vtt?v=1794704431", "num": 57}, {"id": "86-kubeovn-security-groups", "title": "Firewall one VM with a security group", "category": "Kube-OVN", "order": 86, "summary": "Create a Kube-OVN security group that admits only the app subnet on port 5432, bind it to the database virtual machine's network port, and compare it with subnet-wide ACLs.", "level": "advanced", "cluster": "far-edge", "prereqs": ["84-kubeovn-three-tier-acls"], "intro": "This video shows how to protect a single virtual machine with a Kube-OVN security group. Where an access control list applies to a whole subnet, a security group follows one network port.", "duration": 155.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you protect a single virtual machine with a Kube-OVN security group. Where an access control list applies to a whole subnet, a security group follows one network port."}, {"t": 11.26, "title": "Security groups", "text": "Kube-OVN security groups have no menu entry or form yet, but the UI lists them on their resource page, kubeovn.io.securitygroup, and creates them from YAML."}, {"t": 20.01, "title": "Create from YAML", "text": "Select Create from YAML."}, {"t": 22.91, "title": "The rules", "text": "Paste the security group demo-db-sg. Its one ingress rule allows TCP port 5432 from the app subnet, 10.230.2.0/24. Everything else coming in is denied. The egress rule lets the machine answer and reach out."}, {"t": 38.09, "title": "Step 4", "text": "Select Create."}, {"t": 40.44, "title": "Created", "text": "The security group exists, but no port uses it yet."}, {"t": 44.21, "title": "Bind it to demo-db", "text": "Bind it to the database virtual machine. Open the action menu of demo-db,"}, {"t": 50.16, "title": "Step 8", "text": "and select Edit YAML."}, {"t": 52.93, "title": "Port annotations", "text": "Kube-OVN reads per-port settings from annotations on the virtual machine template. This one already pins the address on the demo-db-net network."}, {"t": 61.4, "title": "Step 10", "text": "Add two more for the same network: port_security true turns on filtering for the port, and security_groups names demo-db-sg."}, {"t": 70.15, "title": "Step 11", "text": "Select Save."}, {"t": 72.32, "title": "Restart", "text": "The port picks up the annotations when the virtual machine starts again, so restart demo-db."}, {"t": 78.79, "title": "Step 13", "text": ""}, {"t": 80.91, "title": "Step 14", "text": "Confirm with Apply."}, {"t": 84.96, "title": "Step 17", "text": "demo-db is running again, with the same address."}, {"t": 88.41, "title": "Test from the web tier", "text": "Open the console of demo-web."}, {"t": 91.53, "title": "Step 20", "text": ""}, {"t": 94.38, "title": "Step 21", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 98.05, "title": "Step 22", "text": ""}, {"t": 100.69, "title": "Web is blocked", "text": "Ping demo-db, then request its port 5432."}, {"t": 111.73, "title": "Step 24", "text": "Both fail. The web subnet is not in the security group's rule."}, {"t": 116.38, "title": "Test from the app tier", "text": "Then open the console of demo-app."}, {"t": 119.57, "title": "Step 27", "text": ""}, {"t": 122.3, "title": "Step 28", "text": "Log in the same way."}, {"t": 124.09, "title": "Step 29", "text": ""}, {"t": 126.69, "title": "App gets port 5432 only", "text": "Request port 5432 from the app tier, then ping."}, {"t": 134.67, "title": "One port, one source", "text": "The database answers on port 5432, and the ping is dropped. The rule follows demo-db's port, so it would protect the machine on any subnet."}, {"t": 145.12, "title": "Wrap-up", "text": "The security group protects demo-db's port alone: only the app subnet gets in, and only on port 5432. Next, you steer traffic for a whole VPC with policy routes."}], "recorded": "2026-11-14 20:13", "version": "SUSE Virtualization v1.10", "video": "v/86-kubeovn-security-groups/video.mp4?v=1794705280", "poster": "v/86-kubeovn-security-groups/poster.jpg?v=1794705280", "vtt": "v/86-kubeovn-security-groups/captions.vtt?v=1794705280", "num": 58}, {"id": "87-kubeovn-policy-routes", "title": "Block traffic with VPC policy routes", "category": "Kube-OVN", "order": 87, "summary": "Add a policy route to a Kube-OVN VPC router that drops traffic from the web subnet to the database subnet, one rule in one place for the whole VPC.", "level": "advanced", "cluster": "far-edge", "prereqs": ["86-kubeovn-security-groups"], "intro": "Learn how to add a policy route to a VPC. Policy routes act on the VPC router itself, so a single rule can block one subnet from another, for every virtual machine on them.", "duration": 88.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you add a policy route to a VPC. Policy routes act on the VPC router itself, so a single rule can block one subnet from another, for every virtual machine on them."}, {"t": 11.22, "title": "The VPC router", "text": "The VPC demo-3tier routes between its web, app, and database subnets. Policy routes have no form field yet, so add one in the VPC's YAML."}, {"t": 21.07, "title": "Edit YAML", "text": "Open the action menu of demo-3tier,"}, {"t": 24.47, "title": "Step 3", "text": "and select Edit YAML."}, {"t": 27.23, "title": "Empty spec", "text": "The VPC's spec is still empty. It has no static routes and no policies."}, {"t": 31.46, "title": "The policy route", "text": "Add a policy route. Its action is drop, and its match selects traffic from the web subnet, 10.230.1.0/24, to the database subnet, 10.230.3.0/24."}, {"t": 42.74, "title": "Priority", "text": "The priority must be higher than 31000, the priority of the routes that Kube-OVN adds for each subnet, or those routes win."}, {"t": 50.33, "title": "Step 7", "text": "Select Save."}, {"t": 52.91, "title": "Test from the web tier", "text": "Open the console of demo-web."}, {"t": 56.02, "title": "Step 10", "text": ""}, {"t": 58.85, "title": "Log in", "text": "Log in as sles, with the password that cloud-init set."}, {"t": 62.47, "title": "Step 12", "text": ""}, {"t": 65.07, "title": "App yes, database no", "text": "Request the app tier, then the database."}, {"t": 71.7, "title": "Dropped at the router", "text": "The app tier answers, and the database request times out. The VPC router drops it before it reaches the database subnet."}, {"t": 80.59, "title": "Wrap-up", "text": "One policy route on the VPC router keeps the web tier away from the database, while the rest of the VPC routes as before."}], "recorded": "2026-11-14 19:21", "version": "SUSE Virtualization v1.10", "video": "v/87-kubeovn-policy-routes/video.mp4?v=1794702154", "poster": "v/87-kubeovn-policy-routes/poster.jpg?v=1794702154", "vtt": "v/87-kubeovn-policy-routes/captions.vtt?v=1794702154", "num": 59}, {"id": "50-observability-overview", "title": "SUSE Virtualization in SUSE Observability", "category": "Observability", "order": 50, "summary": "Review cluster health, versions, topology, and events of your SUSE Virtualization clusters in SUSE Observability.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["34-suse-observability"], "intro": "See what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place.", "duration": 94.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place."}, {"t": 10.78, "title": "Clusters overview", "text": "The SUSE Virtualization Clusters view lists every cluster that reports to SUSE Observability, one row per cluster."}, {"t": 19.63, "title": "Cluster health", "text": "The Health column rolls up the monitors of each cluster. A cluster with an unhealthy monitor shows Deviating."}, {"t": 27.54, "title": "Versions and capacity", "text": "The columns show the SUSE Virtualization version, hosts, running VMs, KubeVirt and Longhorn versions, and etcd and clock checks."}, {"t": 37.65, "title": "Topology", "text": "Select Topology to see the clusters as components on a map."}, {"t": 42.84, "title": "Cluster topology", "text": "Each tile is a cluster, colored by its health state, so an unhealthy cluster stands out at a glance."}, {"t": 50.13, "title": "Events", "text": "Select Events to list what happened to these clusters in the selected time range."}, {"t": 56.21, "title": "Health changes", "text": "Each event names the cluster, shows the change, such as a health state transition, and when it happened."}, {"t": 63.3, "title": "Time range", "text": "The time range at the bottom applies to every perspective. Move it back to see the clusters as they were."}, {"t": 70.49, "title": "Main menu", "text": "Open the main menu."}, {"t": 73.3, "title": "SUSE Virtualization views", "text": "Expand SUSE Virtualization."}, {"t": 76.73, "title": "Views per resource", "text": "Besides Clusters, this section has views for hosts, virtual machines, volumes, VM networks, and VPCs."}, {"t": 86.66, "title": "Wrap-up", "text": "You reviewed your clusters in SUSE Observability. Next, you explore the topology of a single virtual machine."}], "recorded": "2026-11-13 12:31", "version": "SUSE Virtualization v1.10", "video": "v/50-observability-overview/video.mp4?v=1794630921", "poster": "v/50-observability-overview/poster.jpg?v=1794630921", "vtt": "v/50-observability-overview/captions.vtt?v=1794630921", "num": 60}, {"id": "51-vm-topology", "title": "Explore virtual machine topology", "category": "Observability", "order": 51, "summary": "Open a virtual machine in SUSE Observability and follow its relations to the host, volumes, and VM network.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["50-observability-overview"], "intro": "Open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective.", "duration": 88.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective."}, {"t": 10.26, "title": "Main menu", "text": "Open the main menu."}, {"t": 12.92, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 16.34, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 19.39, "title": "Open a VM", "text": "The view lists the VMs of every connected cluster. Open the VM named kasm, which runs on the far-edge cluster."}, {"t": 29.27, "title": "VM properties", "text": "Highlights opens first. The About card shows the VM's status, host, IP address, vCPUs, memory, and guest operating system."}, {"t": 40.04, "title": "Related resources", "text": "Related resources lists what the VM uses, such as its VM network, its disks, the Longhorn volume, and the virt-launcher pod."}, {"t": 49.83, "title": "Topology", "text": "Select Topology to draw these relations as a map."}, {"t": 54.35, "title": "VM topology", "text": "The VM sits in the Selection row. Its outgoing relations point to its VM network, its host, and its persistent volume claim."}, {"t": 64.33, "title": "Health on the map", "text": "Each component is colored by its health, so a problem in the storage or on the host shows next to the VM."}, {"t": 72.65, "title": "Guest cluster nodes", "text": "A VM that Rancher creates for a guest cluster is also a Kubernetes node, so its map shows the pods inside."}, {"t": 79.27, "title": "Wrap-up", "text": "Each virtual machine is a component with relations to its host, storage, and network. Next, you investigate an unhealthy virtual machine."}], "recorded": "2026-11-13 12:34", "version": "SUSE Virtualization v1.10", "video": "v/51-vm-topology/video.mp4?v=1794630930", "poster": "v/51-vm-topology/poster.jpg?v=1794630930", "vtt": "v/51-vm-topology/captions.vtt?v=1794630930", "num": 61}, {"id": "52-vm-health-monitor", "title": "Investigate an unhealthy virtual machine", "category": "Observability", "order": 52, "summary": "Find a Deviating virtual machine in SUSE Observability, check its metrics, and open the monitor and remediation guide behind its health state.", "level": "intermediate", "cluster": "suse-observability", "prereqs": ["51-vm-topology"], "intro": "Learn how to find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state.", "duration": 107.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state."}, {"t": 10.02, "title": "Main menu", "text": "Open the main menu."}, {"t": 12.73, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 16.12, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 19.28, "title": "A Deviating VM", "text": "This VM shows Deviating. It runs on a host of the harvester-north cluster."}, {"t": 25.63, "title": "Usage metrics", "text": "To the right, the CPU Usage, Memory Usage, and Disk Usage columns show current metrics for each VM."}, {"t": 33.33, "title": "Open the VM", "text": "Open the Deviating VM."}, {"t": 36.98, "title": "Unhealthy monitor", "text": "On the Highlights page, the Monitors card shows which check failed. Here, it is VM disk filling up."}, {"t": 44.41, "title": "Metrics", "text": "Before you open the monitor, select Metrics to see the VM's charts."}, {"t": 50.15, "title": "Guest filesystems", "text": "Guest shows filesystem usage inside the VM, from the QEMU guest agent. Other groups cover network, storage, memory, and CPU."}, {"t": 60.72, "title": "Back to Highlights", "text": "Return to Highlights."}, {"t": 63.62, "title": "Open the monitor", "text": "Select the VM disk filling up monitor."}, {"t": 68.7, "title": "What the monitor checks", "text": "The panel explains the check. It fires when the fullest writable filesystem in the VM is more than eighty percent used."}, {"t": 77.57, "title": "Triggering evidence", "text": "The triggering evidence plots that metric against its threshold. The health state shows Deviating since the trigger time."}, {"t": 85.9, "title": "Remediation guide", "text": "Below, the monitor links a remediation guide with suggested next steps. Review them against your own environment before you act."}, {"t": 96.18, "title": "Close the panel", "text": "Close the panel when you are done."}, {"t": 100.34, "title": "Wrap-up", "text": "You traced an unhealthy virtual machine to the monitor behind its state. Next, you right-size virtual machines."}], "recorded": "2026-11-13 12:37", "version": "SUSE Virtualization v1.10", "video": "v/52-vm-health-monitor/video.mp4?v=1794630944", "poster": "v/52-vm-health-monitor/poster.jpg?v=1794630944", "vtt": "v/52-vm-health-monitor/captions.vtt?v=1794630944", "num": 62}, {"id": "53-vm-rightsizing", "title": "Right-size virtual machines", "category": "Observability", "order": 53, "summary": "Use the VM right-sizing dashboard in SUSE Observability to find oversized, undersized, and idle virtual machines and what they cost.", "level": "intermediate", "cluster": "suse-observability", "prereqs": ["52-vm-health-monitor"], "intro": "Here, you use the VM right-sizing dashboard in SUSE Observability to find virtual machines that are oversized, undersized, or idle.", "duration": 97.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use the VM right-sizing dashboard in SUSE Observability to find virtual machines that are oversized, undersized, or idle."}, {"t": 11.66, "title": "VM right-sizing", "text": "This dashboard compares the vCPUs and memory each VM is allocated with what it uses, and what the difference costs."}, {"t": 21.21, "title": "Filters", "text": "The Cluster and VM filters scope every panel. Here, it covers all VMs of the harvester-north cluster."}, {"t": 29.83, "title": "Savings", "text": "The Savings row estimates the monthly saving from right-sizing running VMs and from removing idle and stopped ones."}, {"t": 38.66, "title": "Scroll down", "text": "Scroll down for the numbers behind the savings."}, {"t": 42.28, "title": "Step 6", "text": ""}, {"t": 44.28, "title": "What to give back", "text": "The dashboard counts the vCPUs and memory to give back, and the VMs that are undersized, idle, or stopped."}, {"t": 53.2, "title": "Days of data", "text": "Days of data shows how long the measurements cover. Less than a week can miss weekly peaks."}, {"t": 59.66, "title": "What to change", "text": "Per VM, you see allocated and recommended vCPUs and what to give back, with memory below."}, {"t": 67.24, "title": "Per VM evidence", "text": "Scroll further down."}, {"t": 69.47, "title": "Step 11", "text": ""}, {"t": 71.42, "title": "Evidence", "text": "The evidence panels show the measurements behind each recommendation, such as CPU at the ninety-fifth percentile."}, {"t": 79.65, "title": "Step 13", "text": ""}, {"t": 81.6, "title": "Utilisation over time", "text": "At the bottom, charts plot utilisation per VM over time against amber and red threshold lines."}, {"t": 90.47, "title": "Wrap-up", "text": "To apply a recommendation, edit the VM's CPU and memory in SUSE Virtualization, then restart the VM."}], "recorded": "2026-11-13 12:42",
