 "version": "SUSE Virtualization v1.10", "video": "v/53-vm-rightsizing/video.mp4?v=1794630956", "poster": "v/53-vm-rightsizing/poster.jpg?v=1794630956", "vtt": "v/53-vm-rightsizing/captions.vtt?v=1794630956", "num": 63}, {"id": "54-monitoring-grafana-tour", "title": "Tour the monitoring dashboards and Grafana", "category": "Observability", "order": 54, "summary": "Enable the monitoring stack, let it collect metrics for a few minutes, then tour the cluster and virtual machine metrics in the UI, the Harvester and node dashboards in Grafana, and a PromQL query in Prometheus.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["32-monitoring-vm-metrics"], "intro": "In this video, you turn on the monitoring stack, let it collect metrics for a while, and then tour what it gives you: metrics in the UI, dashboards in Grafana, and queries in Prometheus.", "duration": 179.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you turn on the monitoring stack, let it collect metrics for a while, and then tour what it gives you: metrics in the UI, dashboards in Grafana, and queries in Prometheus."}, {"t": 11.13, "title": "The monitoring add-on", "text": "Under Advanced, Add-ons, the rancher-monitoring add-on is disabled."}, {"t": 15.6, "title": "Enable", "text": "Open its action menu,"}, {"t": 17.99, "title": "Step 3", "text": "and select Enable. It deploys Prometheus, Grafana, Alertmanager, and the exporters that collect host and virtual machine metrics."}, {"t": 28.02, "title": "Deployed", "text": "A few minutes later, the add-on reports Deploy Successful."}, {"t": 33.88, "title": "Ten minutes later", "text": "Let it collect for about ten minutes, the part of the recording that was fast-forwarded. Then open Dashboard."}, {"t": 41.61, "title": "Cluster metrics", "text": "Below the capacity summary, select Cluster Metrics."}, {"t": 47.37, "title": "Step 9", "text": "The panels chart the hosts' CPU utilization, load average, and memory over the last few minutes. These panels come from Grafana, embedded in the UI."}, {"t": 57.16, "title": "Virtual machine metrics", "text": "Virtual Machine Metrics puts the busiest virtual machines side by side."}, {"t": 63.66, "title": "Step 12", "text": "CPU, memory, and storage traffic for each virtual machine. demo-load runs a cycle of CPU, memory, and disk work, so its lines rise and fall."}, {"t": 73.35, "title": "One virtual machine", "text": "For a single virtual machine, open demo-load from Virtual Machines,"}, {"t": 77.73, "title": "Step 15", "text": "and select its Virtual Machine Metrics tab."}, {"t": 82.53, "title": "Step 17", "text": "Gauges show its current CPU and memory use, and the graphs show storage traffic, latency, and operations per second. The bursts of disk writes are easy to spot."}, {"t": 93.35, "title": "Open Grafana", "text": "To work with the dashboards directly, open the add-on's configuration, under Add-ons, Edit Config, and select the Grafana tab."}, {"t": 100.8, "title": "Step 20", "text": "The link opens Grafana in a new window."}, {"t": 105.1, "title": "Grafana", "text": "This Grafana instance comes with the monitoring stack, with dashboards for virtual machines, hosts, Kubernetes, and the monitoring stack itself."}, {"t": 112.78, "title": "Harvester VM Dashboard", "text": "Open Harvester VM Dashboard."}, {"t": 116.69, "title": "Step 24", "text": "It charts CPU usage for every virtual machine in the cluster,"}, {"t": 120.6, "title": "Step 25", "text": "memory usage,"}, {"t": 122.32, "title": "Step 26", "text": "and storage and network traffic further down. The repeating pattern of demo-load stands out among the other workloads."}, {"t": 128.66, "title": "Host dashboards", "text": "For the hosts, go to Dashboards and search for Node Exporter, Nodes."}, {"t": 134.01, "title": "Step 29", "text": "Open it."}, {"t": 137.1, "title": "Node Exporter", "text": "Node Exporter reports what the host's operating system sees, CPU usage and load,"}, {"t": 142.65, "title": "Step 32", "text": "memory,"}, {"t": 144.3, "title": "Step 33", "text": "and disk and network activity, for each host in the cluster."}, {"t": 148.18, "title": "Prometheus queries", "text": "Behind every panel is a PromQL query. Prometheus, linked from the add-on's Prometheus tab, has its own query page. This query adds up the CPU each virtual machine used over the last five minutes."}, {"t": 160.45, "title": "Step 36", "text": "Select Execute,"}, {"t": 162.32, "title": "Step 37", "text": "and switch to Graph."}, {"t": 164.67, "title": "CPU per VM", "text": "One line per virtual machine, in CPU cores. Any metric in Grafana can be explored this way."}, {"t": 171.87, "title": "Wrap-up", "text": "Monitoring is on, and the same metrics are available in the UI, in Grafana dashboards, and in Prometheus queries."}], "recorded": "2026-11-14 21:14", "version": "SUSE Virtualization v1.10", "video": "v/54-monitoring-grafana-tour/video.mp4?v=1794708916", "poster": "v/54-monitoring-grafana-tour/poster.jpg?v=1794708916", "vtt": "v/54-monitoring-grafana-tour/captions.vtt?v=1794708916", "num": 64}, {"id": "60-gpu-guest-cluster", "title": "Provision a GPU Kubernetes cluster on SUSE Virtualization", "category": "AI Workloads", "order": 60, "summary": "From Rancher, create an RKE2 guest cluster whose worker VMs get NVIDIA GPUs by PCI passthrough.", "level": "advanced", "cluster": "ranchero-dev", "prereqs": ["24-rancher-guest-cluster", "30-gpu-passthrough"], "intro": "Use Rancher to create an RKE2 cluster on SUSE Virtualization with a GPU worker pool. The pool's machines get an NVIDIA GPU by PCI passthrough, picked in the Rancher 2.16 form.", "duration": 187.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use Rancher to create an RKE2 cluster on SUSE Virtualization with a GPU worker pool. The pool's machines get an NVIDIA GPU by PCI passthrough, picked in the Rancher 2.16 form."}, {"t": 15.01, "title": "Create a cluster", "text": "In Rancher, open Cluster Management and select Create."}, {"t": 19.47, "title": "SUSE Virtualization provider", "text": "Select SUSE Virtualization as the provider."}, {"t": 23.26, "title": "Cloud credential", "text": "Choose the cloud credential for harvester-ai, the SUSE Virtualization cluster with the GPUs."}, {"t": 29.37, "title": "Step 4", "text": ""}, {"t": 31.56, "title": "Cluster name", "text": "Name the cluster demo-ai."}, {"t": 33.88, "title": "Control plane pool", "text": "The first pool runs etcd, the control plane and regular workloads. Give it four CPUs,"}, {"t": 41.1, "title": "Step 7", "text": "and eight gigabytes of memory."}, {"t": 43.37, "title": "Step 8", "text": "Place the virtual machines in the demo namespace,"}, {"t": 47.32, "title": "Step 9", "text": "set the default user of the Ubuntu cloud image,"}, {"t": 51.19, "title": "Step 10", "text": "pick the Ubuntu 24.04 image,"}, {"t": 55.16, "title": "Step 11", "text": "give it a forty gigabyte disk,"}, {"t": 57.46, "title": "Step 12", "text": "and attach it to a VM network that reaches Rancher."}, {"t": 61.32, "title": "Static address", "text": "The DHCP pool of this lab network is full, so each pool gets a fixed address. Select Show Advanced,"}, {"t": 68.38, "title": "Step 14", "text": "and enter cloud-init network data with a static address, gateway and DNS servers for the control plane machine."}, {"t": 76.65, "title": "GPU worker pool", "text": "Add a second machine pool for the GPU workers."}, {"t": 79.63, "title": "Step 16", "text": "Name it gpu and keep one machine."}, {"t": 82.08, "title": "Worker role only", "text": "Rancher gives the new pool only the Worker role. Keep it: GPU workers run workloads, not etcd or the control plane."}, {"t": 89.63, "title": "Step 18", "text": "Give the GPU workers eight CPUs,"}, {"t": 93.15, "title": "Step 19", "text": "twenty-four gigabytes of memory,"}, {"t": 95.5, "title": "Step 20", "text": "and an eighty gigabyte disk for the GPU driver, the inference images and the model files."}, {"t": 100.97, "title": "Step 21", "text": ""}, {"t": 102.65, "title": "PCI device picker", "text": "Under the advanced settings, the PCI Devices picker is new in Rancher 2.16. This recording uses a Rancher 2.16 dashboard build."}, {"t": 112.23, "title": "Step 23", "text": "Add a row."}, {"t": 114.27, "title": "Step 24", "text": "Pick the NVIDIA T400. The host's A2 is reserved by a stopped virtual machine, so the picker does not offer it."}, {"t": 122.34, "title": "Step 25", "text": "Devices in the same IOMMU group must be selected together, so add a second row"}, {"t": 127.71, "title": "Step 26", "text": "for the T400's audio function."}, {"t": 131.11, "title": "Step 27", "text": "The pool copied the network data of the first pool. Give the GPU worker its own address."}, {"t": 139.41, "title": "Kubernetes version", "text": "Under Cluster Configuration, keep the default RKE2 version and the SUSE Virtualization cloud provider."}, {"t": 146.03, "title": "Create", "text": "Select Create."}, {"t": 150.01, "title": "Cluster provisioned", "text": "Rancher created both node virtual machines on harvester-ai, installed RKE2 and joined them. Both machines are Running."}, {"t": 157.4, "title": "Step 34", "text": "The GPU worker has only the worker role."}, {"t": 161.82, "title": "The GPU worker VM", "text": "In SUSE Virtualization, harvester-ai runs both node virtual machines in the demo namespace. Open the GPU worker."}, {"t": 169.61, "title": "Step 38", "text": ""}, {"t": 171.69, "title": "The T400 is attached", "text": "Its device allocation annotation shows the NVIDIA T400 and its audio function, passed through from the host."}, {"t": 179.77, "title": "Wrap-up", "text": "The cluster has a control plane node and a GPU worker that owns the NVIDIA T400. Next, you deploy SUSE AI on it."}], "recorded": "2026-11-14 00:08", "version": "SUSE Virtualization v1.10", "video": "v/60-gpu-guest-cluster/video.mp4?v=1794632947", "poster": "v/60-gpu-guest-cluster/poster.jpg?v=1794632947", "vtt": "v/60-gpu-guest-cluster/captions.vtt?v=1794632947", "num": 65}, {"id": "61-suse-ai-on-harvester", "title": "Deploy SUSE AI on the GPU cluster", "category": "AI Workloads", "order": 61, "summary": "Install SUSE AI on the guest cluster and serve a model with vLLM.", "level": "advanced", "cluster": "ranchero", "prereqs": ["60-gpu-guest-cluster"], "intro": "Here, you use SUSE AI Factory in Rancher to deploy an AI stack on the GPU cluster: the NVIDIA GPU Operator, vLLM serving a model, and Open WebUI.", "duration": 124.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you use SUSE AI Factory in Rancher to deploy an AI stack on the GPU cluster: the NVIDIA GPU Operator, vLLM serving a model, and Open WebUI."}, {"t": 12.0, "title": "SUSE AI Factory", "text": "In Rancher, SUSE AI Factory deploys AI stacks from blueprints. Each blueprint bundles Helm charts with tested values."}, {"t": 19.99, "title": "Step 2", "text": "Show all catalogs, including custom blueprints,"}, {"t": 23.57, "title": "Step 3", "text": "and search for the blueprint prepared for this lab."}, {"t": 26.81, "title": "The blueprint", "text": "It bundles the NVIDIA GPU Operator, vLLM from the SUSE Application Collection serving Qwen 2.5 0.5B Instruct, and Open WebUI."}, {"t": 34.68, "title": "Step 5", "text": "Select Install."}, {"t": 36.99, "title": "Namespace", "text": "Keep the instance name and deploy into the suse-ai namespace."}, {"t": 41.26, "title": "Step 7", "text": ""}, {"t": 43.32, "title": "Target cluster", "text": "Fleet deploys the bundle to the clusters you select. Clear the cluster the wizard preselects,"}, {"t": 48.86, "title": "Step 9", "text": "and select demo-ai, the GPU cluster on SUSE Virtualization."}, {"t": 53.89, "title": "Step 10", "text": ""}, {"t": 56.03, "title": "Component values", "text": "You can override each component's Helm values here. Keep the blueprint defaults."}, {"t": 62.01, "title": "Step 12", "text": ""}, {"t": 64.11, "title": "Review", "text": "Review the plan. The GPU Operator goes to its own namespace, vLLM and Open WebUI to suse-ai, all on demo-ai."}, {"t": 73.46, "title": "Install", "text": "Select Install."}, {"t": 75.37, "title": "Step 15", "text": ""}, {"t": 77.72, "title": "Workload created", "text": "Open Workloads. The new AI workload is listed, and Fleet rolls out the three components to demo-ai."}, {"t": 85.46, "title": "Running", "text": "The GPU Operator set up the NVIDIA driver on the GPU worker, and vLLM downloaded the model and loaded it onto the T400. The workload is Running."}, {"t": 94.82, "title": "Step 19", "text": "Select Open in Rancher to open the suse-ai namespace on demo-ai."}, {"t": 100.47, "title": "Step 20", "text": "Open its Workloads tab."}, {"t": 103.26, "title": "vLLM serves the model", "text": "The vLLM engine for Qwen 2.5 0.5B Instruct is Active, with the image from the SUSE Application Collection, next to the router and Open WebUI."}, {"t": 114.53, "title": "Wrap-up", "text": "SUSE AI runs on the guest cluster and vLLM serves the model on the passed-through GPU. Next, you query it and watch its metrics."}], "recorded": "2026-11-14 00:40", "version": "SUSE Virtualization v1.10", "video": "v/61-suse-ai-on-harvester/video.mp4?v=1794634866", "poster": "v/61-suse-ai-on-harvester/poster.jpg?v=1794634866", "vtt": "v/61-suse-ai-on-harvester/captions.vtt?v=1794634866", "num": 66}, {"id": "62-query-and-observe-model", "title": "Query the model and watch GPU metrics", "category": "AI Workloads", "order": 62, "summary": "Send prompts to the served model and follow GPU and vLLM metrics in SUSE Observability.", "level": "advanced", "cluster": "suse-observability", "prereqs": ["61-suse-ai-on-harvester", "50-observability-overview"], "intro": "Chat with the model that vLLM serves on the GPU cluster, then follow the GPU and vLLM metrics of that work in SUSE Observability.", "duration": 104.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you chat with the model that vLLM serves on the GPU cluster, then follow the GPU and vLLM metrics of that work in SUSE Observability."}, {"t": 10.91, "title": "Step 1", "text": "Open WebUI from the SUSE AI stack greets you with its release notes. Close them."}, {"t": 16.33, "title": "Open WebUI", "text": "Open WebUI runs on demo-ai and talks to the vLLM router. The model it offers is Qwen 2.5 0.5B Instruct."}, {"t": 23.51, "title": "Send a prompt", "text": "Ask the model a question and press Enter."}, {"t": 28.63, "title": "The answer", "text": "vLLM generates the answer on the NVIDIA T400 that SUSE Virtualization passes through to the GPU worker."}, {"t": 36.1, "title": "Step 6", "text": "Send a second, longer prompt to give the GPU more work."}, {"t": 39.96, "title": "Step 8", "text": "The second answer streams in the same way."}, {"t": 48.34, "title": "SUSE Observability", "text": "An OpenTelemetry Collector on demo-ai sends vLLM and GPU metrics to SUSE Observability. Under SUSE AI, the vLLM engine of demo-ai is listed."}, {"t": 58.64, "title": "GPU memory", "text": "In the metrics explorer, query the GPU memory in use that the NVIDIA DCGM exporter reports for demo-ai."}, {"t": 64.99, "title": "Step 14", "text": ""}, {"t": 66.64, "title": "Step 15", "text": ""}, {"t": 68.7, "title": "Step 16", "text": "Narrow the time range to the last fifteen minutes."}, {"t": 72.0, "title": "Step 17", "text": ""}, {"t": 73.74, "title": "Step 18", "text": "vLLM keeps a little over three of the T400's four gigabytes in use, for the model weights and its KV cache."}, {"t": 80.21, "title": "Tokens per second", "text": "Now query vLLM's own metric, the generated tokens per second."}, {"t": 84.36, "title": "Step 20", "text": ""}, {"t": 85.97, "title": "Step 21", "text": ""}, {"t": 87.61, "title": "Step 22", "text": "The token rate rises while the model generates the answers you just sent, and falls back to zero when it is idle."}, {"t": 95.4, "title": "Wrap-up", "text": "The model answers from the passed-through GPU, and SUSE Observability shows the GPU and vLLM metrics. Next, you add a GPU worker."}], "recorded": "2026-11-14 00:51", "version": "SUSE Virtualization v1.10", "video": "v/62-query-and-observe-model/video.mp4?v=1794635496", "poster": "v/62-query-and-observe-model/poster.jpg?v=1794635496", "vtt": "v/62-query-and-observe-model/captions.vtt?v=1794635496", "num": 67}, {"id": "63-scale-gpu-workers", "title": "Add a GPU worker to the AI cluster", "category": "AI Workloads", "order": 63, "summary": "Grow the demo-ai guest cluster from one to two GPU workers from Rancher, and watch the new worker join with its own GPU.", "level": "advanced", "cluster": "ranchero-dev", "prereqs": ["60-gpu-guest-cluster"], "intro": "This video shows how to grow the demo-ai cluster from one GPU worker to two. The host's second GPU is an NVIDIA A2, a different model than the T400, so it gets its own machine pool.", "duration": 116.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you grow the demo-ai cluster from one GPU worker to two. The host's second GPU is an NVIDIA A2, a different model than the T400, so it gets its own machine pool."}, {"t": 11.74, "title": "One GPU worker", "text": "demo-ai has a control plane node and one GPU worker, which owns the host's NVIDIA T400."}, {"t": 17.81, "title": "Edit the cluster", "text": "To add GPU capacity, open the cluster's action menu and select Edit Config."}, {"t": 23.37, "title": "Step 3", "text": ""}, {"t": 25.42, "title": "New machine pool", "text": "The A2 is a different GPU model, so add a new machine pool for it."}, {"t": 29.32, "title": "Step 5", "text": "Name the pool gpu-a2 and keep one machine."}, {"t": 32.9, "title": "Step 6", "text": "The new pool gets only the Worker role, which is what a GPU worker needs."}, {"t": 37.37, "title": "Worker size", "text": "Give the worker eight CPUs,"}, {"t": 40.04, "title": "Step 8", "text": "sixteen gigabytes of memory,"}, {"t": 42.59, "title": "Step 9", "text": "and an eighty gigabyte disk for the driver and the model files."}, {"t": 46.7, "title": "Step 10", "text": ""}, {"t": 48.4, "title": "Pick the A2", "text": "Under the advanced settings, the PCI Devices picker lists the GPUs that are free on the host."}, {"t": 53.96, "title": "Step 12", "text": "Add a row to the device list,"}, {"t": 56.58, "title": "Step 13", "text": "and pick the NVIDIA A2. It is alone in its IOMMU group, so one row is enough."}, {"t": 63.24, "title": "Static address", "text": "The pool copied the network data of another pool. The lab's DHCP pool is full, so give this worker its own static address."}, {"t": 71.57, "title": "Save", "text": "Save the configuration. Rancher scales the cluster from one GPU worker to two."}, {"t": 78.95, "title": "The worker joins", "text": "Rancher created the worker virtual machine with the A2 passed through, installed RKE2 and joined it to demo-ai."}, {"t": 86.08, "title": "Two GPU workers", "text": "demo-ai now runs two GPU workers next to its control plane node, one per GPU model."}, {"t": 92.1, "title": "The A2 is attached", "text": "In SUSE Virtualization, open the new worker's virtual machine on harvester-ai."}, {"t": 97.66, "title": "Step 22", "text": "Its device allocation annotation shows the NVIDIA A2, passed through from the host to the new worker."}, {"t": 105.87, "title": "Wrap-up", "text": "demo-ai now has two GPU workers, one with the T400 and one with the A2, both passed through from SUSE Virtualization. You manage GPU capacity from Rancher."}], "recorded": "2026-11-14 07:58", "version": "SUSE Virtualization v1.10", "video": "v/63-scale-gpu-workers/video.mp4?v=1794661357", "poster": "v/63-scale-gpu-workers/poster.jpg?v=1794661357", "vtt": "v/63-scale-gpu-workers/captions.vtt?v=1794661357", "num": 68}, {"id": "70-terraform-vm", "title": "Create a virtual machine with Terraform", "category": "Automation", "order": 70, "summary": "Use the Harvester Terraform provider to define an image, a network and a VM as code, apply it, and change it with a plan.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm", "19-vlan-network"], "intro": "Learn how to describe an image, a network and a virtual machine as code with the Harvester Terraform provider, create them in SUSE Virtualization, change the virtual machine with a plan, and remove everything again.", "duration": 136.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you describe an image, a network and a virtual machine as code with the Harvester Terraform provider, create them in SUSE Virtualization, change the virtual machine with a plan, and remove everything again."}, {"t": 14.57, "title": "The provider", "text": "main.tf pins the Harvester provider and points it at a kubeconfig. Here it belongs to an account that can only use the demo namespace."}, {"t": 22.75, "title": "An image", "text": "The first resource is an image. The cluster downloads the openSUSE Leap cloud image from this address."}, {"t": 29.74, "title": "A network", "text": "The second is a VLAN network, VLAN one hundred on the management cluster network, with its subnet and gateway."}, {"t": 36.48, "title": "A virtual machine", "text": "The virtual machine uses both. One CPU, two gigabytes of memory, a ten gigabyte disk from the image, a NIC on the network, and cloud-init user data."}, {"t": 46.62, "title": "terraform init", "text": "terraform init downloads the provider version that main.tf asks for."}, {"t": 52.84, "title": "terraform apply", "text": "terraform apply first computes a plan. Each plus sign is an attribute of a resource that does not exist yet."}, {"t": 58.91, "title": "Three resources created", "text": "The plan adds three resources. Terraform creates the network and the image first, then the virtual machine that needs them."}, {"t": 66.21, "title": "The VM in the UI", "text": "In the UI, demo-tf-vm is running with one CPU and two gigabytes of memory, just as main.tf describes it."}, {"t": 73.34, "title": "The network", "text": "The Virtual Machine Networks page lists demo-tf-net, the VLAN network with VLAN ID one hundred."}, {"t": 79.63, "title": "Change the code", "text": "Now change the code. In main.tf, the CPU count goes from one to two, and the memory from two to four gigabytes."}, {"t": 86.9, "title": "terraform plan", "text": "terraform plan compares the code with the cluster. The tilde marks an in-place update of the virtual machine: CPU and memory."}, {"t": 94.92, "title": "Step 24", "text": "Nothing is added or destroyed. One resource changes."}, {"t": 100.47, "title": "Apply the change", "text": "terraform apply makes the change. Because restart_after_update is set, the provider restarts the virtual machine so the new size takes effect."}, {"t": 108.28, "title": "New size in the UI", "text": "In the UI, the details of demo-tf-vm now show two virtual CPUs and four gigabytes of memory, after the restart."}, {"t": 117.84, "title": "terraform destroy", "text": "When you no longer need it, terraform destroy removes the virtual machine, its disk, the network and the image."}, {"t": 125.85, "title": "Wrap-up", "text": "One file now describes the image, the network and the virtual machine, and Terraform keeps the cluster in line with it. Next, you bootstrap a Linux virtual machine with cloud-init."}], "recorded": "2026-11-14 00:53", "version": "SUSE Virtualization v1.10", "video": "v/70-terraform-vm/video.mp4?v=1794635625", "poster": "v/70-terraform-vm/poster.jpg?v=1794635625", "vtt": "v/70-terraform-vm/captions.vtt?v=1794635625", "num": 69}, {"id": "71-cloud-init-linux", "title": "Bootstrap a Linux VM with cloud-init", "category": "Automation", "order": 71, "summary": "Create a Linux VM whose users, packages and first-boot commands come from cloud-init user data, and check the result inside the guest.", "level": "beginner", "cluster": "far-edge", "prereqs": ["04-create-vm", "05-vm-console"], "intro": "Give a new Linux virtual machine cloud-init user data that creates a user, installs packages and runs a command at first boot. Then check the result inside the guest.", "duration": 136.3, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you give a new Linux virtual machine cloud-init user data that creates a user, installs packages and runs a command at first boot. Then you check the result inside the guest."}, {"t": 13.06, "title": "Create a virtual machine", "text": "On the Virtual Machines page, select Create to start a new virtual machine."}, {"t": 18.62, "title": "Basics", "text": "Choose the demo namespace for this virtual machine,"}, {"t": 22.36, "title": "Step 3", "text": "and give it the name demo-cloudinit, so you can find it later."}, {"t": 25.74, "title": "Step 4", "text": "Give the virtual machine one virtual CPU to start with,"}, {"t": 29.81, "title": "Step 5", "text": "and two gigabytes of memory, enough for this small test."}, {"t": 33.79, "title": "Boot image", "text": "Open the Volumes tab to choose the boot image."}, {"t": 36.91, "title": "Step 7", "text": "Select the openSUSE Leap cloud image. It ships with cloud-init, which reads the user data at first boot."}, {"t": 46.53, "title": "Cloud-init user data", "text": "Then open Advanced Options, where the Cloud Configuration section holds the user data."}, {"t": 51.78, "title": "Step 9", "text": "The default user data only installs the guest agent. Replace it with your own."}, {"t": 56.53, "title": "Users, packages, commands", "text": "The users key adds a user named tux with a password. The packages key installs three packages, and runcmd writes a login message and starts the guest agent."}, {"t": 66.07, "title": "Create", "text": "Select Create, and the cluster creates the virtual machine with this user data."}, {"t": 72.9, "title": "First boot", "text": "The virtual machine is running. On its first boot, cloud-init now applies the user data inside the guest."}, {"t": 81.01, "title": "Open the console", "text": "When first boot is done, open the Console menu in its row"}, {"t": 84.96, "title": "Step 15", "text": "and select Open in WebVNC to see the guest screen."}, {"t": 90.02, "title": "Log in as the new user", "text": "At the login prompt, type tux, the user that cloud-init created,"}, {"t": 95.89, "title": "Step 17", "text": "and the password from the user data."}, {"t": 99.94, "title": "The login message", "text": "The login works, and the message from the runcmd command appears right after it."}, {"t": 104.68, "title": "Check user and packages", "text": "Now check the user and the packages. tux is in the wheel group, and all three packages are installed."}, {"t": 111.96, "title": "cloud-init status", "text": "cloud-init status confirms that first boot finished, with no errors."}, {"t": 118.47, "title": "Configured from user data", "text": "Back in the Virtual Machines list, demo-cloudinit keeps running, set up entirely from its user data."}, {"t": 125.72, "title": "Wrap-up", "text": "cloud-init created the user, installed the packages and ran the command on first boot, with no manual steps. Next, you prepare a Windows image with sysprep."}], "recorded": "2026-11-14 02:47", "version": "SUSE Virtualization v1.10", "video": "v/71-cloud-init-linux/video.mp4?v=1794642456", "poster": "v/71-cloud-init-linux/poster.jpg?v=1794642457", "vtt": "v/71-cloud-init-linux/captions.vtt?v=1794642457", "num": 70}, {"id": "72-sysprep-windows-image", "title": "Prepare a Windows image with sysprep", "category": "Automation", "order": 72, "summary": "Build a Windows VM from an ISO with an answer file that installs drivers and Cloudbase-Init and runs sysprep, export its disk as an image, and deploy a new VM from it.", "level": "intermediate", "cluster": "harvester-ai", "prereqs": ["10-windows-vm"], "intro": "Here, you build a generalized Windows image in SUSE Virtualization: an answer file installs and syspreps a build machine, you export its disk, and deploy a new machine from it.", "duration": 320.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you build a generalized Windows image in SUSE Virtualization: an answer file installs and syspreps a build machine, you export its disk, and deploy a new machine from it."}, {"t": 12.02, "title": "The build VM", "text": "Start with a build virtual machine. On the create page, choose the demo namespace,"}, {"t": 17.8, "title": "Step 2", "text": "and name the machine demo-win-build."}, {"t": 20.34, "title": "Step 3", "text": "Select Use the virtual machine template to start from a ready layout."}, {"t": 26.16, "title": "Windows ISO template", "text": "Choose windows-iso-medium-template. It brings the installer CD-ROM, the VMDP driver CD, a root disk and the Hyper-V settings."}, {"t": 36.2, "title": "Step 5", "text": "Lower the memory to eight gigabytes, which is enough for the build."}, {"t": 39.87, "title": "Step 6", "text": "Set OS Type to Windows. This adds the Windows Unattended and Sysprep section to Advanced Options."}, {"t": 47.07, "title": "The answer file", "text": "Open Advanced Options and scroll to the Windows sysprep section."}, {"t": 50.76, "title": "Step 8", "text": "Select demo-unattend. It holds the self-contained Server 2025 answer file from the harvester-windows-cloudbase repository, unchanged."}, {"t": 59.54, "title": "Step 9", "text": "The answer file installs Windows, then a first-logon script adds the VMDP drivers and Cloudbase-Init, cleans up, and runs sysprep."}, {"t": 70.01, "title": "ISO and root disk", "text": "On the Volumes tab, set the installer image and the root disk size."}, {"t": 74.21, "title": "Step 11", "text": "then search the Image list for the Windows Server 2025 evaluation ISO"}, {"t": 79.51, "title": "Step 12", "text": "and select it. It was uploaded under Images earlier."}, {"t": 84.19, "title": "Step 13", "text": "Shrink the root disk to thirty-six gigabytes. The image keeps this size, and drive C grows on every deployed copy."}, {"t": 91.82, "title": "Unattended build", "text": "Select Create, and the build runs on its own from here, without any clicks."}, {"t": 98.2, "title": "Step 15", "text": "demo-win-build is running. Windows Setup reads the answer file from a small CD that the cluster attached."}, {"t": 105.62, "title": "Step 17", "text": "To watch the install, open the Console menu of demo-win-build"}, {"t": 110.22, "title": "Step 18", "text": "and select Open in WebVNC to see the Windows screen."}, {"t": 116.15, "title": "Step 19", "text": "Windows Setup installs the operating system with no questions on screen, because the answer file already answers them."}, {"t": 127.17, "title": "Generalized and off", "text": "After about twenty minutes, sysprep generalized the system and shut it down. The machine is off, and its disk is the golden image."}, {"t": 135.94, "title": "Export the disk", "text": "On the Volumes page, open the action menu of the build machine's root disk."}, {"t": 141.02, "title": "Step 25", "text": "Select Export Image to copy this disk into a new image."}, {"t": 145.5, "title": "Step 26", "text": "In the dialog, choose the demo namespace for the new image,"}, {"t": 149.99, "title": "Step 27", "text": "and name the image demo-win-golden, short and without spaces."}, {"t": 154.45, "title": "Step 28", "text": "Set the storage class explicitly to lvm-thin, or the image lands on the default class."}, {"t": 160.54, "title": "Step 29", "text": "Then select Create to start copying the disk into the image."}, {"t": 166.24, "title": "Deploy a new VM", "text": "The image is ready. Now create a virtual machine from it, again in the demo namespace,"}, {"t": 171.95, "title": "Step 33", "text": "and name it demo-win-web. This name becomes the Windows hostname."}, {"t": 176.5, "title": "Step 34", "text": "Use a virtual machine template again,"}, {"t": 179.49, "title": "Step 35", "text": "this time windows-image-template, made for prepared Windows images. It needs no installer ISO."}, {"t": 187.24, "title": "Step 36", "text": "Lower the memory to eight gigabytes for this test server."}, {"t": 190.91, "title": "Boot from the image", "text": "On the Volumes tab, the root disk from the template has no image yet."}, {"t": 195.14, "title": "Step 38", "text": "Remove this placeholder disk,"}, {"t": 197.65, "title": "Step 39", "text": "and add the image as a new disk instead. Select Add a Virtual Machine Image."}, {"t": 202.96, "title": "Step 40", "text": "In the Image list, search for demo-win-golden, the image you just exported,"}, {"t": 207.66, "title": "Step 41", "text": "and select it for the new root disk."}, {"t": 210.61, "title": "The cloud-config", "text": "In Advanced Options, the template's cloud-config is already filled in. Cloudbase-Init reads it on the first boot."}, {"t": 217.22, "title": "Step 43", "text": "It sets the time zone to UTC. Cloudbase-Init takes the hostname from the virtual machine name, and grows drive C to the disk."}, {"t": 224.09, "title": "First boot", "text": "Select Create. The cluster clones the image into the new root disk and starts the machine."}, {"t": 231.83, "title": "Step 45", "text": "demo-win-web is running. Windows finishes setup on its own, and Cloudbase-Init applies the hostname and the cloud-config."}, {"t": 241.42, "title": "Check the new VM", "text": "When setup is done, open the Console menu of demo-win-web"}, {"t": 246.5, "title": "Step 48", "text": "and select Open in WebVNC. No setup screens are waiting, only the lock screen."}, {"t": 253.26, "title": "Step 49", "text": "Send Control Alt Delete from the toolbar to open the sign-in,"}, {"t": 256.82, "title": "Step 50", "text": "and confirm it in the dialog."}, {"t": 262.12, "title": "Step 51", "text": "The generalized image has no Administrator password yet, so Windows asks you to set one at the first sign-in."}, {"t": 268.35, "title": "Step 52", "text": "Press Enter to accept, and Windows shows the new password fields."}, {"t": 274.43, "title": "Step 53", "text": "Type a new password,"}, {"t": 276.46, "title": "Step 54", "text": "move to the confirmation field,"}, {"t": 278.98, "title": "Step 55", "text": "and type it again, then press Enter."}, {"t": 284.93, "title": "Step 56", "text": "Windows confirms that the password changed. Press Enter to sign in."}, {"t": 290.84, "title": "Hostname", "text": "You are on the desktop. Open the Run dialog with Windows plus R."}, {"t": 296.11, "title": "Step 59", "text": "Run a command prompt that prints the computer name."}, {"t": 301.17, "title": "Step 60", "text": "The computer name is demo-win-web, the name you gave the virtual machine. Setup finished without any prompts."}, {"t": 309.82, "title": "Wrap-up", "text": "The new virtual machine came from the generalized image and finished setup on its own, with the hostname from its name. Next, you resize virtual machines through GitOps."}], "recorded": "2026-11-14 11:52", "version": "SUSE Virtualization v1.10", "video": "v/72-sysprep-windows-image/video.mp4?v=1794679846", "poster": "v/72-sysprep-windows-image/poster.jpg?v=1794679846", "vtt": "v/72-sysprep-windows-image/captions.vtt?v=1794679846", "num": 71}, {"id": "73-gitops-vm-resize", "title": "Resize VMs through GitOps with Rancher Fleet", "category": "Automation", "order": 73, "summary": "Change a VM manifest in Git, get it reviewed and merged, and watch Rancher Fleet apply it to the cluster with CPU and memory hot-plug.", "level": "advanced", "cluster": "ranchero", "prereqs": ["11-hotplug-cpu-memory"], "intro": "Resize a virtual machine on SUSE Virtualization through Git: the change is reviewed and merged, and Rancher Fleet applies it with CPU and memory hot-plug.", "duration": 117.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you resize a virtual machine on SUSE Virtualization through Git: the change is reviewed and merged, and Rancher Fleet applies it with CPU and memory hot-plug."}, {"t": 11.74, "title": "Starting size", "text": "The virtual machine demo-web-01 runs with one vCPU and two gigabytes of memory. Rancher Fleet created it from a manifest in Git."}, {"t": 20.35, "title": "Resize request", "text": "In the Git repository, the request form turned a resize request into this pull request, opened by the GitHub Actions bot."}, {"t": 27.73, "title": "Open the pull request", "text": "Open the pull request to see what was asked for, and by whom."}, {"t": 32.16, "title": "Request details", "text": "The request records who asked, the change ticket with its reason, and that it applies when the pull request merges."}, {"t": 38.03, "title": "Code owner review", "text": "The code owners file routes the review to the team that owns the virtual machines, here the repository owner."}, {"t": 44.02, "title": "Policy check and plan", "text": "The validate check tested the manifest against the policy limits and posted a plan: two vCPUs and four gigabytes after the merge."}, {"t": 51.96, "title": "Files changed", "text": "Open Files changed to see the exact edit to the manifest."}, {"t": 56.76, "title": "The diff", "text": "Only two lines change: CPU sockets go from one to two, and guest memory from two to four gigabytes."}, {"t": 64.1, "title": "Back to the conversation", "text": "Return to the conversation. In the meantime, the code owner reviewed the change from their own account."}, {"t": 71.11, "title": "Approved", "text": "The approval, with its comment, is now part of the pull request's history, next to the plan and the passing check."}, {"t": 77.79, "title": "Merged", "text": "The code owner then merged it into the branch that Fleet watches. That commit is now the desired state."}, {"t": 84.09, "title": "New size", "text": "Back on the virtual machine, the flavor now reads two vCPUs and four gigabytes. The cluster adds them with a live migration."}, {"t": 92.47, "title": "Live migration", "text": "Open the Migration tab to see how the new size reached the running virtual machine."}, {"t": 97.52, "title": "Applied without a reboot", "text": "An automated workload update live-migrated the virtual machine to another node with the extra CPU and memory. It never restarted."}, {"t": 107.68, "title": "Wrap-up", "text": "The resize went from a reviewed pull request to the running virtual machine without a reboot. Git keeps the record of who asked, who approved, and what changed."}], "recorded": "2026-11-14 00:51", "version": "SUSE Virtualization v1.10", "video": "v/73-gitops-vm-resize/video.mp4?v=1794658390", "poster": "v/73-gitops-vm-resize/poster.jpg?v=1794658390", "vtt": "v/73-gitops-vm-resize/captions.vtt?v=1794658390", "num": 72}, {"id": "74-salt-states-mlm", "title": "Reuse Salt states with SUSE Multi-Linux Manager", "category": "Automation", "order": 74, "summary": "Bootstrap a VM with cloud-init, register it with an activation key, apply an existing Salt state from SUSE Multi-Linux Manager, and correct drift.", "level": "advanced", "cluster": "far-edge", "prereqs": ["71-cloud-init-linux"], "intro": "In this video, a new virtual machine on SUSE Virtualization registers itself with Multi-Linux Manager, gets WordPress from an existing Salt state, and has a manual change corrected.", "duration": 140.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, a new virtual machine on SUSE Virtualization registers itself with Multi-Linux Manager, gets WordPress from an existing Salt state, and has a manual change corrected."}, {"t": 11.9, "title": "A new virtual machine", "text": "demo-wp-01 is a new Leap 16.1 virtual machine with two CPUs and four gigabytes of memory. Nobody has logged in to it."}, {"t": 20.2, "title": "Bootstrap with cloud-init", "text": "Open Advanced Options to see the cloud-init user data that ran on its first boot."}, {"t": 25.18, "title": "Step 3", "text": "It writes Salt grains, then runs the bootstrap script from Multi-Linux Manager, which registers the machine with activation key 1-wordpress."}, {"t": 33.95, "title": "Accept the Salt key", "text": "In Multi-Linux Manager, the Salt Keys page lists the new minion as pending. Nothing is managed until an administrator accepts its key."}, {"t": 42.13, "title": "Step 6", "text": "Accept the key to approve this machine. Registration and the first Salt run start right away."}, {"t": 49.84, "title": "Registered system", "text": "The machine is now a registered Salt system. Its base channel, the WordPress channel for SLES 16.1, comes from the activation key."}, {"t": 57.54, "title": "Step 10", "text": ""}, {"t": 59.53, "title": "Automatic highstate", "text": "Open the Events tab and its History to see what happened after you accepted the key."}, {"t": 65.14, "title": "Step 12", "text": ""}, {"t": 67.13, "title": "Step 13", "text": "Right after registration, the server applied the highstate by itself, so the wordpress state ran without any extra step."}, {"t": 74.27, "title": "WordPress is running", "text": "WordPress now runs on the virtual machine, built entirely by the Salt state. Note the site title in the header."}, {"t": 80.8, "title": "Step 17", "text": ""}, {"t": 82.79, "title": "Cause drift", "text": "To simulate a manual change on the machine, open Remote Command on the system's Details tab."}, {"t": 88.76, "title": "Step 19", "text": "The script changes the site title with the WordPress command line tool, as an administrator logged in to the machine might."}, {"t": 95.19, "title": "Step 20", "text": "Schedule it to run now. Salt runs the script on the machine within seconds."}, {"t": 100.49, "title": "Step 23", "text": "The site title changed. The machine has drifted from what the Salt state describes."}, {"t": 105.86, "title": "Step 25", "text": ""}, {"t": 107.87, "title": "Apply the highstate", "text": "To correct it, open the States tab. The Highstate page shows the wordpress state assigned to this system."}, {"t": 114.38, "title": "Step 27", "text": "Select Apply Highstate. Salt compares the machine with the state and changes only what differs."}, {"t": 122.94, "title": "Drift corrected", "text": "The managed title is back. The highstate found the difference and set the title to the value in the state."}, {"t": 129.73, "title": "Wrap-up", "text": "The same Salt state built the site and put it back after a manual change, and the system history records each run. Schedule the highstate as a recurring action to correct drift on its own."}], "recorded": "2026-11-14 07:54", "version": "SUSE Virtualization v1.10", "video": "v/74-salt-states-mlm/video.mp4?v=1794660958", "poster": "v/74-salt-states-mlm/poster.jpg?v=1794660958", "vtt": "v/74-salt-states-mlm/captions.vtt?v=1794660958", "num": 73}]; const COLORS = {"Getting Started": "#30BA78", "Virtual Machines": "#2453FF", "Storage": "#FE7C3F", "Backup & Recovery": "#E9B500", "Networking": "#7F3FBF", "Live Migration": "#00A3A3", "Rancher Integration": "#0C322C", "Day-2 Operations": "#C13B78", "Add-ons": "#3F8FDB", "Scale & Limits": "#6B6B6B", "Ecosystem": "#8A5A00", "Observability": "#0F7B6C", "Automation": "#5B3FA0", "Disaster Recovery": "#B3261E", "Kube-OVN": "#1F6FB2", "AI Workloads": "#76B900"}; const TRACKS = ["Getting Started", "Virtual Machines", "Storage", "Backup & Recovery", "Networking", "Live Migration", "Rancher Integration", "Day-2 Operations", "Add-ons", "Scale & Limits", "Disaster Recovery", "Ecosystem", "Kube-OVN", "Observability", "AI Workloads", "Automation"];
const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
let cur = null, filter = null, query = '';
const matches = d => !query || (d.title + ' ' + d.summary + ' ' + d.category + ' ' +
  (d.chapters || []).map(c => c.title + ' ' + c.text).join(' ')).toLowerCase().includes(query);
const seen = new Set(JSON.parse(localStorage.getItem('sv-seen') || '[]'));
const fmt = s => s == null ? '' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function order() { return DATA.filter(d => !filter || d.category === filter); }
function renderNav() {
  const f = document.getElementById('filters');
  const cats = TRACKS.filter(t => DATA.some(d => d.category === t));
  f.innerHTML = `<span class="chip ${!filter ? 'on' : ''}" data-c="">All</span>` +
    cats.map(c => `<span class="chip ${filter === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</span>`).join('');
  f.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { filter = ch.dataset.c || null; renderNav(); });
  const t = document.getElementById('tracks'); t.innerHTML = '';
  for (const c of cats) {
    if (filter && filter !== c) continue;
    const items = DATA.filter(d => d.category === c && matches(d));
    if (!items.length) continue;
    const mins = Math.round(items.reduce((a, d) => a + (d.duration || 0), 0) / 60);
    t.insertAdjacentHTML('beforeend', `<div class="track" style="--c:${COLORS[c] || '#888'}"><h3><i style="background:${COLORS[c]}"></i>${esc(c)}<small>${items.length} · ${mins} min</small></h3>
      <ol class="tl">${items.map(d => `<li data-id="${d.id}" class="${d.video ? '' : 'soon'} ${seen.has(d.id) ? 'seen' : ''} ${cur && cur.id === d.id ? 'active' : ''}">
      <span class="dot"></span><div class="t">${String(d.num).padStart(2, '0')} · ${esc(d.title)}</div>
      <div class="m">${d.video ? fmt(d.duration) : 'coming soon'} · ${esc(d.level)}</div></li>`).join('')}</ol></div>`);
  }
  t.querySelectorAll('li').forEach(li => li.onclick = () => show(li.dataset.id, true));
  const rec = DATA.filter(d => d.video).length;
  document.getElementById('progress').textContent = `${seen.size} of ${rec} watched · ${rec}/${DATA.length} recorded`;
}
function show(id, play) {
  cur = byId[id]; location.hash = id;
  const p = document.getElementById('player');
  if (cur.video) {
    p.innerHTML = `<video id="v" controls preload="metadata" ${cur.poster ? `poster="${cur.poster}"` : ''} ${play ? 'autoplay' : ''}>
      <source src="${cur.video}" type="video/mp4">${cur.vtt ? `<track kind="captions" srclang="en" label="English" src="${cur.vtt}">` : ''}</video>`;
    const v = document.getElementById('v');
    v.ontimeupdate = () => { const lis = [...document.querySelectorAll('#chapters li')];
      lis.forEach((li, i) => { const t = +li.dataset.t, n = lis[i + 1] ? +lis[i + 1].dataset.t : 1e9;
        li.classList.toggle('now', v.currentTime >= t && v.currentTime < n); }); };
    v.onended = () => { seen.add(cur.id); localStorage.setItem('sv-seen', JSON.stringify([...seen])); renderNav();
      if (document.getElementById('autoplay').checked) step(1, true); };
  } else p.innerHTML = `<div class="soonbox">Coming soon — ${esc(cur.title)}</div>`;

    .filter(Boolean).map(x => `<span class="tag">${esc(x)}</span>`).join('');
  document.getElementById('chapters').innerHTML = (cur.chapters.length ? cur.chapters : [{t: 0, title: 'Introduction', text: cur.intro}])
    .map(c => `<li data-t="${c.t}"><span class="ts">${fmt(c.t)}</span><div><div class="ct">${esc(c.title)}</div><div class="cx">${esc(c.text)}</div></div></li>`).join('');
  document.querySelectorAll('#chapters li').forEach(li => li.onclick = () => { const v = document.getElementById('v');
    if (v) { v.currentTime = +li.dataset.t; v.play(); } });
  const pre = (cur.prereqs || []).filter(x => byId[x]);
  const after = DATA.filter(d => (d.prereqs || []).includes(cur.id));
  document.getElementById('side').innerHTML =
    (pre.length ? `<div class="box"><h4>Watch first</h4>${pre.map(x => `<a data-id="${x}">${esc(byId[x].title)}</a>`).join('')}</div>` : '') +
    (after.length ? `<div class="box"><h4>Builds on this</h4>${after.map(d => `<a data-id="${d.id}">${esc(d.title)}</a>`).join('')}</div>` : '') +
    `<div class="box"><h4>Recorded on</h4>${esc(cur.cluster || '')}${cur.recorded ? ' · ' + esc(cur.recorded) : ''}</div>`;

  renderNav();
