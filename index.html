hine traffic, and attach a spare network interface of the host to it.", "duration": 89.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Create a cluster network, a dedicated path for virtual machine traffic, and attach a spare network interface of the host to it."}, {"t": 8.88, "title": "The mgmt network", "text": "Under Networks, Cluster Network Configuration, the built-in mgmt network carries management traffic on every host."}, {"t": 17.76, "title": "Create a cluster network", "text": "To separate virtual machine traffic, select Create a Cluster Network."}, {"t": 23.46, "title": "Name", "text": "Name the cluster network."}, {"t": 25.81, "title": "Create", "text": "Select Create."}, {"t": 28.27, "title": "Empty cluster network", "text": "The new cluster network has no network configuration yet, so no host interface carries its traffic."}, {"t": 35.67, "title": "Create a network config", "text": "Select Create Network Configuration."}, {"t": 39.26, "title": "Name", "text": "Name the network configuration."}, {"t": 42.08, "title": "Node selector", "text": "On the Node Selector tab, keep Select all nodes, so every host joins this cluster network."}, {"t": 48.91, "title": "Uplink", "text": "On the Uplink tab, choose the host interfaces for the cluster network."}, {"t": 54.4, "title": "Uplink NIC", "text": "Select a spare network interface. The list only shows interfaces that are free on all selected nodes."}, {"t": 62.72, "title": "Bond options", "text": "The interface becomes a bond, active-backup by default. Add a second NIC later for redundancy."}, {"t": 70.05, "title": "Create", "text": "Select Create."}, {"t": 72.92, "title": "Uplink is active", "text": "The network configuration is active. The cluster network now has an uplink on every host and is ready for VLAN networks."}, {"t": 83.32, "title": "Wrap-up", "text": "The cluster network is ready. Next, you create a VLAN virtual machine network on it."}], "recorded": "2026-11-13 14:39", "version": "SUSE Virtualization v1.10", "video": "v/18-cluster-network/video.mp4?v=1794997830", "poster": "v/18-cluster-network/poster.jpg?v=1794997830", "vtt": "v/18-cluster-network/captions.vtt?v=1794997830", "num": 18}, {"id": "19-vlan-network", "title": "Create a VLAN virtual machine network", "category": "Networking", "order": 19, "summary": "Create a VLAN-backed virtual machine network on a cluster network so that virtual machines can join an existing VLAN.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["18-cluster-network"], "intro": "Learn how to create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network.", "duration": 60.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Learn how to create a virtual machine network that puts virtual machines on VLAN one hundred of the management cluster network."}, {"t": 7.26, "title": "Create a network", "text": "Under Networks, Virtual Machine Networks, select Create."}, {"t": 11.96, "title": "Namespace", "text": "Choose the namespace that the network belongs to."}, {"t": 16.28, "title": "Name", "text": "Give it a name."}, {"t": 18.2, "title": "L2 VLAN type", "text": "The type is L2VlanNetwork, a layer two network tagged with a VLAN ID."}, {"t": 24.31, "title": "Access mode", "text": "Keep Access mode, so each virtual machine interface carries this one VLAN."}, {"t": 29.88, "title": "VLAN ID", "text": "Enter VLAN ID one hundred."}, {"t": 32.87, "title": "Cluster network", "text": "Select the cluster network that carries the VLAN. Here it is mgmt, the management network."}, {"t": 40.84, "title": "Create", "text": "Select Create."}, {"t": 43.3, "title": "Network is ready", "text": "The new network is listed with its type, VLAN ID, and cluster network. Virtual machines can now attach to it."}, {"t": 53.06, "title": "Wrap-up", "text": "Virtual machines can now use VLAN one hundred. Next, you create an overlay network that needs no VLAN on the switch."}], "recorded": "2026-11-12 22:26", "version": "SUSE Virtualization v1.10", "video": "v/19-vlan-network/video.mp4?v=1794997833", "poster": "v/19-vlan-network/poster.jpg?v=1794997833", "vtt": "v/19-vlan-network/captions.vtt?v=1794997833", "num": 19}, {"id": "20-overlay-network", "title": "Create an overlay network with Kube-OVN", "category": "Networking", "order": 20, "summary": "Create an overlay virtual machine network and give it a Kube-OVN subnet, so virtual machines get a private network that needs no switch configuration.", "level": "advanced", "cluster": "far-edge", "prereqs": ["19-vlan-network"], "intro": "Here, you create an overlay virtual machine network and a Kube-OVN subnet for it. Overlay traffic is tunneled between hosts, so the switches need no VLANs.", "duration": 100.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Here, you create an overlay virtual machine network and a Kube-OVN subnet for it. Overlay traffic is tunneled between hosts, so the switches need no VLANs."}, {"t": 10.3, "title": "Create a network", "text": "Under Networks, Virtual Machine Networks, select Create."}, {"t": 15.01, "title": "Namespace", "text": "Choose the namespace,"}, {"t": 18.0, "title": "Name", "text": "and give the network a name."}, {"t": 20.51, "title": "Overlay type", "text": "Set the type to OverlayNetwork. An overlay network needs no VLAN ID and no cluster network."}, {"t": 28.81, "title": "Create", "text": "Select Create."}, {"t": 31.28, "title": "Overlay network", "text": "The network exists, but it has no IP range yet. A Kube-OVN subnet provides one."}, {"t": 37.88, "title": "Overlay Networks", "text": "Open Overlay Networks,"}, {"t": 40.73, "title": "Virtual Private Cloud", "text": "and select Virtual Private Cloud. The default VPC, ovn-cluster, holds the built-in subnets."}, {"t": 48.47, "title": "Create a subnet", "text": "In the ovn-cluster VPC, select Create Subnet."}, {"t": 53.07, "title": "Subnet name", "text": "Name the subnet."}, {"t": 55.05, "title": "CIDR block", "text": "Enter a CIDR block that does not overlap with other networks."}, {"t": 60.03, "title": "Provider", "text": "As the provider, select the overlay network you just created. This binds the subnet to it."}, {"t": 67.3, "title": "Gateway", "text": "Leave the gateway IP empty. Kube-OVN uses the first address of the block."}, {"t": 73.25, "title": "DHCP", "text": "Enable DHCP, so virtual machines on this network receive their addresses automatically."}, {"t": 80.61, "title": "Create", "text": "Select Create."}, {"t": 83.05, "title": "Subnet is active", "text": "The subnet is active, with its CIDR block and the overlay network as its provider."}, {"t": 90.89, "title": "Wrap-up", "text": "Virtual machines can now attach to the demo-overlay network and get addresses from its subnet. Next, you hot-plug a network interface."}], "recorded": "2026-11-12 22:29", "version": "SUSE Virtualization v1.10", "video": "v/20-overlay-network/video.mp4?v=1794997934", "poster": "v/20-overlay-network/poster.jpg?v=1794997934", "vtt": "v/20-overlay-network/captions.vtt?v=1794997934", "num": 20}, {"id": "21-hotplug-nic", "title": "Hot-plug a network interface", "category": "Networking", "order": 21, "summary": "Add a second network interface to a running virtual machine without restarting it.", "level": "advanced", "cluster": "disaster-recovery", "prereqs": ["19-vlan-network", "04-create-vm"], "intro": "Add a second network interface to a running virtual machine. SUSE Virtualization plugs it in without a restart.", "duration": 72.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Add a second network interface to a running virtual machine. SUSE Virtualization plugs it in without a restart."}, {"t": 7.44, "title": "Open the VM actions", "text": "The virtual machine is running. Open its action menu,"}, {"t": 12.14, "title": "Edit the configuration", "text": "and select Edit Config."}, {"t": 14.98, "title": "Networks tab", "text": "Open the Networks tab."}, {"t": 1 Introduction", "text": "This video shows how to give live migration traffic its own network in SUSE Virtualization, so moving virtual machines does not compete with other management traffic."}, {"t": 10.26, "title": "vm-migration-network", "text": "Under Advanced, Settings, find vm-migration-network. It has no value, so migrations share the management network."}, {"t": 18.89, "title": "Open actions", "text": "Open its actions menu,"}, {"t": 21.74, "title": "Edit Setting", "text": "and select Edit Setting."}, {"t": 25.04, "title": "Enable", "text": "Select Enabled."}, {"t": 27.61, "title": "Cluster network", "text": "Choose the cluster network that carries the traffic. These nodes have one network interface, so pick mgmt."}, {"t": 36.7, "title": "VLAN ID", "text": "Enter a VLAN ID that the physical switch carries between all nodes, here nine nine nine."}, {"t": 43.54, "title": "IP range", "text": "Enter an unused IP range. Each node gets an address from it for migration traffic."}, {"t": 50.14, "title": "Exclude IPs", "text": "Optionally, exclude addresses that are already in use,"}, {"t": 54.38, "title": "Excluded IP", "text": "such as a gateway address."}, {"t": 56.83, "title": "Save", "text": "Select Save."}, {"t": 59.25, "title": "Show the value", "text": "The setting is now marked Modified. Select Show to see its value."}, {"t": 65.04, "title": "Migration network set", "text": "The setting now shows the cluster network, VLAN, and IP range. New live migrations use this dedicated network."}, {"t": 75.1, "title": "Wrap-up", "text": "Live migrations now use the dedicated network. Next, you live-migrate a virtual machine."}], "recorded": "2026-11-12 21:22", "version": "SUSE Virtualization v1.10", "video": "v/22-live-migration-network/video.mp4?v=1794998037", "poster": "v/22-live-migration-network/poster.jpg?v=1794998037", "vtt": "v/22-live-migration-network/captions.vtt?v=1794998037", "num": 22}, {"id": "23-live-migrate-vm", "title": "Live-migrate a virtual machine", title": "Wrap-up", "text": "The cluster is imported. Next, you provision a Kubernetes guest cluster on it from Rancher."}], "recorded": "2026-11-13 12:48", "version": "SUSE Virtualization v1.9 \u00b7 SUSE Rancher Prime v2.15", "video": "v/23b-import-harvester-into-rancher/video.mp4?v=1794998142", "poster": "v/23b-import-harvester-into-rancher/poster.jpg?v=1794998142", "vtt": "v/23b-import-harvester-into-rancher/captions.vtt?v=1794998142", "num": 24}, {"id": "24-rancher-guest-cluster", "title": "Provision a Kubernetes cluster on SUSE Virtualization from Rancher", "category": "Rancher Integration", "order": 24, "summary": "Use Rancher to create an RKE2 Kubernetes cluster whose nodes are virtual machines on SUSE Virtualization.", "level": "advanced", "cluster": "ranchero", "prereqs": ["04-create-vm", "19-vlan-network"], "intro": "Learn how to use Rancher to provision an RKE2 Kubernetes cluster on SUSE Virtualization. Rancher creates the node virtual machines for you.", "duration": 99.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Learn how to use Rancher to provision an RKE2 Kubernetes cluster on SUSE Virtualization. Rancher creates the node virtual machines for you."}, {"t": 10.06, "title": "Create a cluster", "text": "In Rancher, open Cluster Management and select Create."}, {"t": 14.7, "title": "Harvester provider", "text": "Select Harvester, the provider for SUSE Virtualization."}, {"t": 19.59, "title": "Cloud credential", "text": "Choose the cloud credential for the SUSE Virtualization cluster that hosts the nodes, here far-edge."}, {"t": 27.17, "title": "Step 4", "text": ""}, {"t": 29.28, "title": "Cluster name", "text": "Name the cluster."}, {"t": 31.38, "title": "Machine pool", "text": "One machine pool with one machine runs etcd, the control plane, and workloads. That is enough for a test cluster."}, {"t": 39.7, "title": "CPUs", "text": "Give each machine four CPUs,"}, {"t": 42.65, "title": "Memory (GiB)", "text": "and eight gigabytes of memory."}, {"t": 45.24, "title": "Namespace", "text": "Choose the namespace for the virtual machines on SUSE Virtualization,"}, {"t": 51.15, "title": "SSH user", "text": "and the default user of the cloud image."}, {"t": 54.21, "title": "Image", "text": "Pick an Ubuntu cloud image that exists on the cluster,"}, {"t": 59.03, "title": "Disk (GiB)", "text": "and set the root disk to twenty gigabytes."}, {"t": 62.18, "title": "Network", "text": "Attach the machines to a VM network that can reach Rancher."}, {"t": 67.5, "title": "Kubernetes version", "text": "Under Cluster Configuration, keep the default RKE2 version and the Harvester cloud provider."}, {"t": 74.95, "title": "Create", "text": "Select Create."}, {"t": 77.35, "title": "Provisioning", "text": "The cluster appears in the list. Rancher starts provisioning it."}, {"t": 83.53, "title": "Node VM on far-edge", "text": "On far-edge, SUSE Virtualization now runs the node virtual machine that Rancher created."}, {"t": 91.97, "title": "Wrap-up", "text": "Rancher keeps provisioning the cluster until it is Active. You manage it from Cluster Management like any other cluster."}], "recorded": "2026-11-12 22:38", "version": "SUSE Virtualization v1.10", "video": "v/24-rancher-guest-cluster/video.mp4?v=1794998119", "poster": "v/24-rancher-guest-cluster/poster.jpg?v=1794998119", "vtt": "v/24-rancher-guest-cluster/captions.vtt?v=1794998119", "num": 25}, {"id": "24c-liz-rancher-ai", "title": "Troubleshoot with Liz, the Rancher AI assistant", "category": "Rancher Integration", "order": 24.7, "summary": "Ask Liz in Rancher to investigate an issue, read a log and create a VM, and see which MCP tools it uses.", "level": "intermediate", "cluster": "ranchero", "prereqs": ["23b-import-harvester-into-rancher"], "intro": "Ask Liz, the AI assistant in Rancher, to troubleshoot a virtual machine, read a log, and create a new VM on SUSE Virtualization.", "duration": 148.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Ask Liz, the AI assistant in Rancher, to troubleshoot a virtual machine, read a log, and create a new VM on SUSE Virtualization."}, {"t": 9.35, "title": "Find the demo VMs", "text": "This is the harvester-ai cluster inside Rancher. Filter the virtual machine list for the two demo VMs."}, {"t": 17.34, "title": "A VM that does not start", "text": "The VM demo-liz-app does not start. It stays Pending, and the list does not show the reason."}, {"t": 23.43, "title": "Open Liz", "text": "Open Liz from the header. Liz calls MCP tools that read and change resources with your own Rancher permissions."}, {"t": 30.78, "title": "Virtualization agent", "text": "Choose the Virtualization agent. Its tools list and inspect VMs, volumes, images, and networks, and create or delete VMs."}, {"t": 40.56, "title": "Step 5", "text": ""}, {"t": 42.25, "title": "Ask why it fails", "text": "Ask Liz why demo-liz-app does not start, and name the namespace and the cluster."}, {"t": 49.32, "title": "Tool calls", "text": "Each button is a resource that one of Liz's tool calls returned, so you can open exactly what it looked at."}, {"t": 55.0, "title": "The root cause", "text": "Liz reads the VM conditions and the volume list. The VM's disk points at a volume, demo-liz-app-data, that does not exist."}, {"t": 63.54, "title": "Rancher agent for logs", "text": "The Virtualization agent has no log tool, so switch to the Rancher agent. Its inspect pod tool returns a pod's log."}, {"t": 71.69, "title": "Step 11", "text": ""}, {"t": 73.34, "title": "Read a VM log", "text": "Ask for the log of the virt-launcher pod, the pod that runs the VM demo-liz-web."}, {"t": 82.39, "title": "The log summary", "text": "Liz finds the pod, reads its log, and summarizes how the VM booted and whether any lines point to a problem."}, {"t": 89.37, "title": "Create a VM", "text": "To create a VM, switch back to the Virtualization agent."}, {"t": 93.76, "title": "Step 16", "text": ""}, {"t": 95.41, "title": "Describe the new VM", "text": "Describe the VM you want, with one CPU, two gigabytes of memory, a ten gigabyte disk, an Ubuntu image, and a VM network."}, {"t": 107.22, "title": "Confirm before it changes", "text": "Creating a VM changes the cluster, so Liz stops and shows what the create tool will apply. Nothing happens until you confirm."}, {"t": 115.31, "title": "Confirm", "text": "Confirm the request to let Liz create the virtual machine."}, {"t": 122.49, "title": "Liz reports the result", "text": "Liz reports the new VM with its size, disk, image, and network."}, {"t": 127.07, "title": "Check in the UI", "text": "Close Liz and check the result where it matters, in the virtual machine list of the cluster."}, {"t": 132.58, "title": "The new VM runs", "text": "The list now shows demo-liz-new, the VM that Liz created. It is Running."}, {"t": 140.29, "title": "Wrap-up", "text": "Liz works through MCP tools with your Rancher permissions and asks before it changes anything. Always check its answers against the cluster."}], "recorded": "2026-11-14 02:01", "version": "SUSE Virtualization v1.10", "video": "v/24c-liz-rancher-ai/video.mp4?v=1794998290", "poster": "v/24c-liz-rancher-ai/poster.jpg?v=1794998290", "vtt": "v/24c-liz-rancher-ai/captions.vtt?v=1794998290", "num": 26}, {"id": "25-storage-migration", "title": "Migrate a running virtual machine's volume to another storage class", "category": "Day-2 Operations", "order": 25, "summary": "Move the disk of a running virtual machine from Longhorn to Portworx with online storage migration, without stopping it.", "level": "advanced", "cluster": "disaster-recovery", "prereqs": ["17-storage-class", "23-live-migrate-vm"], "intro": "Here, you move the disk of a running virtual machine from Longhorn to Portworx with storage migration. The guest keeps running while its data moves.", "duration": 109.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Here, you move the disk of a running virtual machine from Longhorn to Portworx with storage migration. The guest keeps running while its data moves."}, {"t": 9.13, "title": "Volume on Longhorn", "text": "The running virtual machine demo-smig boots from demo-smig-disk-0. Its storage class is a Longhorn class, made for the image."}, {"t": 18.94, "title": "Create the target volume", "text": "First, create the target volume. Select Create."}, {"t": 23.27, "title": "Namespace", "text": "Use the same namespace as the virtual machine,"}, {"t": 27.7, "title": "Name", "text": "and name the volume demo-smig-px."}, {"t": 31.3, "title": "Portworx storage class", "text": "Choose the Portworx storage class px-csi-replicated."}, {"t": 36.58, "title": "Size", "text": "Set the size to ten gigabytes, the same as the source volume."}, {"t": 41.22, "title": "Create", "text": "Select Create."}, {"t": 43.71, "title": "Target volume ready", "text": "The new volume is ready and not attached to any virtual machine."}, {"t": 48.56, "title": "Virtual Machines", "text": "Now open the Virtual Machines page."}, {"t": 51.91, "title": "Open actions", "text": "Open the actions menu for demo-smig,"}, {"t": 55.45, "title": "Storage Migration", "text": "and select Storage Migration."}, {"t": 58.66, "title": "Source volume", "text": "For the source volume, choose demo-smig-disk-0."}, {"t": 63.42, "title": "Target volume", "text": "For the target volume, choose demo-smig-px. The list shows only volumes that no virtual machine uses."}, {"t": 72.39, "title": "Apply", "text": "Select Apply."}, {"t": 75.54, "title": "Migrating", "text": "SUSE Virtualization live-migrates the virtual machine to another node and copies the disk to the new volume."}, {"t": 85.22, "title": "Still running", "text": "The migration is complete. The virtual machine kept running and now runs on a different node."}, {"t": 91.96, "title": "Volumes", "text": "Check the Volumes page."}, {"t": 94.78, "title": "Disk on Portworx", "text": "demo-smig-px, on the Portworx storage class, is now the disk of demo-smig."}, {"t": 102.26, "title": "Wrap-up", "text": "The virtual machine now runs from a Portworx volume and never stopped. Next, you hot-plug a CD-ROM."}], "recorded": "2026-11-13 12:35", "version": "SUSE Virtualization v1.10", "video": "v/25-storage-migration/video.mp4?v=1794998257", "poster": "v/25-storage-migration/poster.jpg?v=1794998257", "vtt": "v/25-storage-migration/captions.vtt?v=1794998258", "num": 27}, {"id": "26-cdrom-hotplug", "title": "Insert and eject a CD-ROM image on a running virtual machine", "category": "Day-2 Operations", "order": 26, "summary": "Insert an ISO image into the empty CD-ROM drive of a running virtual machine, then eject it, without a restart.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["02-upload-image", "12-hotplug-volume"], "intro": "Insert an ISO image into the CD-ROM drive of a running virtual machine and eject it again, without restarting the virtual machine.", "duration": 76.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Insert an ISO image into the CD-ROM drive of a running virtual machine and eject it again, without restarting the virtual machine."}, {"t": 9.22, "title": "Open the virtual machine", "text": "The virtual machine demo-cdrom is running. Open it."}, {"t": 13.86, "title": "Volumes tab", "text": "Select the Volumes tab."}, {"t": 16.78, "title": "Empty CD-ROM drive", "text": "Below the root disk, the virtual machine has a CD-ROM drive on the SATA bus. It shows No media."}, {"t": 24.73, "title": "Insert Image", "text": "Select Insert Image."}, {"t": 27.54, "title": "Pick the ISO image", "text": "Keep the drive name, cdrom, and choose the Alpine Linux ISO image."}, {"t": 33.76, "title": "Apply", "text": "Select Apply."}, {"t": 37.78, "title": "ISO inserted", "text": "The drive now holds the Alpine ISO image. It was attached live, and the virtual machine is still running."}, {"t": 45.72, "title": "Eject Image", "text": "When you no longer need the media, select Eject Image."}, {"t": 50.23, "title": "Confirm the eject", "text": "Confirm that you want to eject the image from the cdrom drive."}, {"t": 55.11, "title": "Drive empty again", "text": "The drive shows No media again. The drive itself stays in place, ready for the next image."}, {"t": 61.64, "title": "Never restarted", "text": "Throughout both changes, the virtual machine kept running."}, {"t": 67.5, "title": "Wrap-up", "text": "You inserted and ejected an ISO image while the virtual machine kept running. Next, you work with volume snapshots and images."}], "recorded": "2026-11-13 14:48", "version": "SUSE Virtualization v1.10", "video": "v/26-cdrom-hotplug/video.mp4?v=1794998377", "poster": "v/26-cdrom-hotplug/poster.jpg?v=1794998377", "vtt": "v/26-cdrom-hotplug/captions.vtt?v=1794998377", "num": 28}, {"id": "27-volume-operations", "title": "Snapshot, restore, and export a volume", "category": "Day-2 Operations", "order": 27, "summary": "Take a snapshot of a volume, restore it to a new volume, and export the volume to a reusable image.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["12-hotplug-volume", "17-storage-class"], "intro": "This video shows how to take a snapshot of a volume, restore it to a new volume, and export the volume to an image for new virtual machines.", "duration": 96.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "This video shows how to take a snapshot of a volume, restore it to a new volume, and export the volume to an image for new virtual machines."}, {"t": 8.77, "title": "Open the action menu", "text": "On the Volumes page, open the action menu of the two gigabyte volume demo-data."}, {"t": 15.08, "title": "Take Snapshot", "text": "Select Take Snapshot."}, {"t": 17.74, "title": "Name the snapshot", "text": "Name the snapshot demo-data-snap,"}, {"t": 20.61, "title": "Create the snapshot", "text": "and select Create."}, {"t": 23.4, "title": "Open the volume", "text": "Open the volume to see its snapshots."}, {"t": 26.94, "title": "Snapshots tab", "text": "Select the Snapshots tab."}, {"t": 30.05, "title": "Snapshot ready", "text": "The snapshot is ready to use. Open its action menu."}, {"t": 35.33, "title": "Restore", "text": "Select Restore."}, {"t": 37.68, "title": "New volume name", "text": "Restoring creates a new volume and leaves the original untouched. Name it demo-data-restored."}, {"t": 44.82, "title": "Storage class", "text": "Keep the default storage class."}, {"t": 47.65, "title": "Create the volume", "text": "Select Create."}, {"t": 50.08, "title": "Restored volume", "text": "On the Volumes page, the restored two gigabyte volume demo-data-restored sits next to the original."}, {"t": 56.63, "title": "Open the action menu", "text": "Next, export the original volume to an image. Open its action menu,"}, {"t": 62.25, "title": "Export Image", "text": "and select Export Image."}, {"t": 64.88, "title": "Image name", "text": "Keep the namespace demo, and name the image demo-data-image."}, {"t": 70.47, "title": "Storage class", "text": "Choose the storage class for the image, here longhorn-v2."}, {"t": 75.05, "title": "Export", "text": "Select Create to start the export."}, {"t": 79.27, "title": "Image ready", "text": "On the Images page, demo-data-image is active. You can now create new virtual machines from it, or download it."}, {"t": 88.18, "title": "Wrap-up", "text": "You now have a snapshot, a restored copy, and an image of the volume. Next, you control where virtual machines run."}], "recorded": "2026-11-13 16:49", "version": "SUSE Virtualization v1.10", "video": "v/27-volume-operations/video.mp4?v=1794998398", "poster": "v/27-volume-operations/poster.jpg?v=1794998398", "vtt": "v/27-volume-operations/captions.vtt?v=1794998398", "num": 29}, {"id": "28-vm-scheduling-rules", "title": "Control where virtual machines run with scheduling rules", "category": "Day-2 Operations", "order": 28, "summary": "Restrict a new virtual machine to chosen hosts with a node rule, and keep it away from another virtual machine with anti-affinity.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["04-create-vm", "23-live-migrate-vm"], "intro": "Learn how to create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine.", "duration": 131.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Learn how to create a virtual machine with two scheduling rules: a node rule limits its hosts, and an anti-affinity rule keeps it apart from another virtual machine."}, {"t": 9.6, "title": "First VM on ser5-green", "text": "The virtual machine demo-sched-1 runs on ser5-green. The second virtual machine must not share its host."}, {"t": 18.0, "title": "Create a virtual machine", "text": "Select Create."}, {"t": 20.43, "title": "Namespace", "text": "Choose the demo namespace,"}, {"t": 23.72, "title": "Name", "text": "and name it demo-sched-2."}, {"t": 26.39, "title": "CPU", "text": "Give it one CPU"}, {"t": 28.79, "title": "Memory (GiB)", "text": "and two gigabytes of memory."}, {"t": 31.39, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 33.77, "title": "Boot image", "text": "select the openSUSE Leap image for the boot disk."}, {"t": 38.41, "title": "Node Scheduling", "text": "Open the Node Scheduling tab. By default, the virtual machine can run on any available node."}, {"t": 45.68, "title": "Scheduling rules", "text": "Select Run virtual machine on nodes matching scheduling rules."}, {"t": 50.57, "title": "Add Node Selector", "text": "Add a node selector. Its priority stays Required, so the rule must be met."}, {"t": 56.78, "title": "Add Rule", "text": "Add a rule."}, {"t": 59.06, "title": "Node label key", "text": "For the key, use the node label kubernetes.io/hostname."}, {"t": 63.98, "title": "Allowed hosts", "text": "Keep the operator in list, and enter ser5-green and ser5-purple. The virtual machine can run only on these two hosts."}, {"t": 73.16, "title": "Virtual Machine Scheduling", "text": "Next, open the Virtual Machine Scheduling tab."}, {"t": 76.83, "title": "Add Workload Selector", "text": "Add a workload selector."}, {"t": 79.64, "title": "Anti-Affinity", "text": "Set the type to Anti-Affinity, and keep the priority Required."}, {"t": 84.99, "title": "Add Rule", "text": "Add a rule that selects the other virtual machine."}, {"t": 88.95, "title": "Label key", "text": "Every virtual machine carries the label harvesterhci.io/vmName."}, {"t": 94.95, "title": "Label value", "text": "Set its value to demo-sched-1."}, {"t": 98.26, "title": "Topology key", "text": "With the topology key kubernetes.io/hostname, the two virtual machines never share a host."}, {"t": 105.44, "title": "Create", "text": "Select Create."}, {"t": 109.46, "title": "Different hosts", "text": "demo-sched-2 runs on ser5-purple. The node rule allowed ser5-green and ser5-purple, and anti-affinity ruled out ser5-green."}, {"t": 121.74, "title": "Wrap-up", "text": "Both rules are part of the virtual machine and also apply when it restarts or migrates. Next, you put a host into maintenance mode."}], "recorded": "2026-11-13 12:44", "version": "SUSE Virtualization v1.10", "video": "v/28-vm-scheduling-rules/video.mp4?v=1794998514", "poster": "v/28-vm-scheduling-rules/poster.jpg?v=1794998514", "vtt": "v/28-vm-scheduling-rules/captions.vtt?v=1794998514", "num": 30}, {"id": "29-host-maintenance-mode", "title": "Put a host into maintenance mode", "category": "Day-2 Operations", "order": 29, "summary": "Enable maintenance mode on a host so its virtual machines live-migrate away, then return the host to service.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["23-live-migrate-vm"], "intro": "Put a host into maintenance mode. Its virtual machines live-migrate to other hosts, so you can service the host without downtime.", "duration": 88.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Put a host into maintenance mode. Its virtual machines live-migrate to other hosts, so you can service the host without downtime."}, {"t": 8.97, "title": "VM on ser5-purple", "text": "The virtual machine demo-maint is running on the host ser5-purple."}, {"t": 14.17, "title": "Hosts", "text": "Open the Hosts page."}, {"t": 17.05, "title": "ser5-purple is Active", "text": "ser5-purple is Active. Suppose it needs a firmware update or new hardware."}, {"t": 23.09, "title": "Open actions", "text": "Open its actions menu,"}, {"t": 25.94, "title": "Enable Maintenance Mode", "text": "and select Enable Maintenance Mode."}, {"t": 29.37, "title": "Keep Force cleared", "text": "Leave Force cleared. Virtual machines that can live-migrate move to other hosts. Force would shut down the ones that cannot."}, {"t": 38.17, "title": "Apply", "text": "Select Apply."}, {"t": 42.2, "title": "Host in maintenance", "text": "SUSE Virtualization live-migrates the virtual machines away and drains the host. ser5-purple is now in maintenance mode."}, {"t": 51.82, "title": "Virtual Machines", "text": "Back on the Virtual Machines page,"}, {"t": 55.23, "title": "VM moved", "text": "demo-maint kept running. It now runs on another host."}, {"t": 59.51, "title": "Hosts", "text": "When the work on the host is done, return to the Hosts page,"}, {"t": 64.2, "title": "Open actions", "text": "open the actions menu for ser5-purple,"}, {"t": 68.23, "title": "Disable Maintenance Mode", "text": "and select Disable Maintenance Mode."}, {"t": 71.5, "title": "Host Active again", "text": "ser5-purple is Active again and accepts new workloads. The virtual machine stays on its new host."}, {"t": 80.5, "title": "Wrap-up", "text": "The host went into maintenance and came back while the virtual machine kept running. Next, you pass a GPU through to a virtual machine."}], "recorded": "2026-11-13 13:02", "version": "SUSE Virtualization v1.10", "video": "v/29-host-maintenance-mode/video.mp4?v=1794998505", "poster": "v/29-host-maintenance-mode/poster.jpg?v=1794998505", "vtt": "v/29-host-maintenance-mode/captions.vtt?v=1794998505", "num": 31}, {"id": "30-gpu-passthrough", "title": "Pass a GPU through to a virtual machine", "category": "Add-ons", "order": 30, "summary": "Review a GPU enabled for PCI passthrough and attach it, with its audio function, to a virtual machine.", "level": "advanced", "cluster": "far-edge", "prereqs": ["04-create-vm", "11-hotplug-cpu-memory"], "intro": "In this video, you review a GPU that is enabled for PCI passthrough and attach it to a virtual machine, giving the guest direct access to the physical device.", "duration": 121.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review a GPU that is enabled for PCI passthrough and attach it to a virtual machine, giving the guest direct access to the physical device."}, {"t": 10.18, "title": "PCI Devices", "text": "Under Advanced, PCI Devices lists every PCI device on each host. Filter the list for NVIDIA."}, {"t": 17.44, "title": "The GPU", "text": "This NVIDIA Quadro P1000 GPU has passthrough enabled. The host no longer uses it, so a virtual machine can."}, {"t": 24.75, "title": "Its audio function", "text": "The GPU's audio function sits in the same IOMMU group, so it is enabled too. Pass both to the same virtual machine."}, {"t": 33.1, "title": "How it was enabled", "text": "An enabled device's action menu offers Disable Passthrough. Other devices offer Enable Passthrough, which is how this GPU was claimed."}, {"t": 41.04, "title": "Step 5", "text": ""}, {"t": 42.99, "title": "Open actions", "text": "On the Virtual Machines page, open the action menu of demo-gpu,"}, {"t": 48.27, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 51.08, "title": "PCI Devices tab", "text": "Select the PCI Devices tab."}, {"t": 53.84, "title": "Pick the GPU", "text": "In Available PCI Devices, choose the GPU,"}, {"t": 58.31, "title": "Pick its audio function", "text": "and its audio function."}, {"t": 61.67, "title": "Step 12", "text": ""}, {"t": 63.34, "title": "Compatible host", "text": "Both devices sit on host p5820, so the form lists it as the compatible host. The virtual machine will run there."}, {"t": 71.34, "title": "Save", "text": "Select Save."}, {"t": 73.86, "title": "Save and Restart", "text": "A PCI device is attached at boot, so select Save and Restart."}, {"t": 80.82, "title": "Running with the GPU", "text": "The virtual machine restarted on host p5820 and is running again, now with the GPU attached."}, {"t": 87.17, "title": "Open the console", "text": "To check from inside the guest, open the console,"}, {"t": 91.59, "title": "Step 19", "text": "in WebVNC."}, {"t": 94.94, "title": "Log in", "text": "Log in as sles,"}, {"t": 96.84, "title": "Step 21", "text": "with the password that cloud-init set."}, {"t": 100.58, "title": "lspci in the guest", "text": "List the PCI devices of the guest and filter for NVIDIA."}, {"t": 105.59, "title": "GPU visible", "text": "The guest lists the Quadro P1000 GPU and its audio function as its own PCI devices."}, {"t": 114.47, "title": "Wrap-up", "text": "The virtual machine runs with the physical GPU passed through. Next, you use local LVM storage."}], "recorded": "2026-11-13 17:02", "version": "SUSE Virtualization v1.10", "video": "v/30-gpu-passthrough/video.mp4?v=1794998633", "poster": "v/30-gpu-passthrough/poster.jpg?v=1794998633", "vtt": "v/30-gpu-passthrough/captions.vtt?v=1794998633", "num": 32}, {"id": "31-lvm-local-storage", "title": "Use local LVM storage for virtual machines", "category": "Add-ons", "order": 31, "summary": "Enable the LVM add-on, turn a spare host disk into a volume group, and run a virtual machine on a local LVM volume.", "level": "advanced", "cluster": "far-edge", "prereqs": ["17-storage-class", "04-create-vm"], "intro": "Enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it.", "duration": 195.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Enable the LVM add-on, turn a spare disk into an LVM volume group, and give a virtual machine a fast local volume from it."}, {"t": 8.3, "title": "LVM add-on", "text": "Under Advanced, Add-ons, open the action menu of harvester-csi-driver-lvm."}, {"t": 15.49, "title": "Enable", "text": "Select Enable. SUSE Virtualization deploys the LVM CSI driver."}, {"t": 23.46, "title": "Add-on deployed", "text": "The add-on reports Deploy Successful."}, {"t": 28.11, "title": "Edit the host", "text": "Next, give LVM a disk. On the Hosts page, open the action menu of host p5820,"}, {"t": 36.41, "title": "Edit Config", "text": "and select Edit Config."}, {"t": 39.47, "title": "Storage tab", "text": "Select the Storage tab."}, {"t": 42.55, "title": "Add Disk", "text": "Select Add Disk,"}, {"t": 44.87, "title": "Pick /dev/sdc", "text": "and choose the spare disk, /dev/sdc, one hundred twelve gigabytes."}, {"t": 51.37, "title": "Provisioner LVM", "text": "Change the provisioner from Longhorn to LVM."}, {"t": 55.97, "title": "New volume group", "text": "For Volume Group, select Create New."}, {"t": 60.28, "title": "Name it demo-vg", "text": "Name the volume group demo-vg,"}, {"t": 63.42, "title": "Create", "text": "and select Create."}, {"t": 65.79, "title": "Save", "text": "Select Save. SUSE Virtualization adds the disk to the new volume group."}, {"t": 72.41, "title": "Open the host", "text": "Open the host,"}, {"t": 74.94, "title": "Storage tab", "text": "and its Storage tab."}, {"t": 77.59, "title": "Disk provisioned", "text": "The disk /dev/sdc is now provisioned with LVM. Next, create a storage class on the volume group."}, {"t": 86.52, "title": "Create a storage class", "text": "On the Storage Classes page, select Create."}, {"t": 90.47, "title": "Name", "text": "Name it demo-lvm."}, {"t": 93.32, "title": "Provisioner LVM", "text": "Choose the LVM provisioner."}, {"t": 97.05, "title": "Node", "text": "LVM volumes are local, so the class is tied to one host. Choose node p5820,"}, {"t": 105.44, "title": "Volume group", "text": "and the volume group demo-vg."}, {"t": 109.22, "title": "dm-thin", "text": "Keep the volume group type dm-thin. Thin volumes allocate space on write and support snapshots and clones."}, {"t": 117.43, "title": "Create", "text": "Select Create."}, {"t": 119.89, "title": "LVM storage class", "text": "The new storage class uses the LVM provisioner."}, {"t": 124.31, "title": "Create a virtual machine", "text": "Now create a virtual machine that uses it. On the Virtual Machines page, select Create."}, {"t": 131.56, "title": "Namespace and name", "text": "Choose the namespace demo,"}, {"t": 135.06, "title": "Step 32", "text": "and name it demo-lvm-vm."}, {"t": 137.84, "title": "CPU and memory", "text": "Give it one CPU"}, {"t": 140.25, "title": "Step 34", "text": "and two gigabytes of memory."}, {"t": 142.84, "title": "Volumes", "text": "On the Volumes tab,"}, {"t": 145.3, "title": "Boot image", "text": "pick the openSUSE Leap image for the root disk."}, {"t": 149.9, "title": "Add a data volume", "text": "Then select Add Volume for a second disk."}, {"t": 153.41, "title": "LVM storage class", "text": "Set its storage class to demo-lvm,"}, {"t": 157.81, "title": "Size", "text": "and its size to two gigabytes."}, {"t": 160.44, "title": "Create", "text": "Select Create."}, {"t": 164.51, "title": "Running", "text": "The virtual machine is scheduled on host p5820, where the volume group lives, and it is running."}, {"t": 172.21, "title": "Open the virtual machine", "text": "Open the virtual machine,"}, {"t": 175.1, "title": "Volumes tab", "text": "and its Volumes tab."}, {"t": 177.83, "title": "Local LVM volume", "text": "Below the root disk, the two gigabyte data volume comes from demo-lvm, a thin logical volume on the local disk."}, {"t": 188.41, "title": "Wrap-up", "text": "The virtual machine runs with a local LVM volume. Next, you monitor virtual machine metrics."}], "recorded": "2026-11-13 13:02", "version": "SUSE Virtualization v1.10", "video": "v/31-lvm-local-storage/video.mp4?v=1794998713", "poster": "v/31-lvm-local-storage/poster.jpg?v=1794998713", "vtt": "v/31-lvm-local-storage/captions.vtt?v=1794998713", "num": 33}, {"id": "32-monitoring-vm-metrics", "title": "Enable monitoring and view VM metrics", "category": "Add-ons", "order": 32, "summary": "Enable the rancher-monitoring add-on and view the CPU, memory, and storage metrics of a virtual machine and of the cluster.", "level": "beginner", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "Here, you enable the monitoring add-on in SUSE Virtualization, then view the metrics that it collects for a running virtual machine.", "duration": 99.1, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Here, you enable the monitoring add-on in SUSE Virtualization, then view the metrics that it collects for a running virtual machine."}, {"t": 7.68, "title": "Add-ons", "text": "Add-ons, under Advanced, lists optional components. The rancher-monitoring add-on is disabled."}, {"t": 14.83, "title": "Open actions", "text": "Open its actions menu."}, {"t": 17.66, "title": "Enable", "text": "Select Enable. SUSE Virtualization deploys Prometheus, Grafana, and Alertmanager into the cluster."}, {"t": 26.78, "title": "Deployed", "text": "After a few minutes, the add-on state changes to Deploy Successful."}, {"t": 33.03, "title": "Virtual machines", "text": "Next, open Virtual Machines."}, {"t": 36.17, "title": "Open the VM", "text": "Select the running virtual machine demo-metrics."}, {"t": 40.42, "title": "Metrics tab", "text": "A new Virtual Machine Metrics tab is now available. Select it."}, {"t": 47.36, "title": "VM metrics", "text": "Grafana panels show this virtual machine's CPU and memory usage, and its storage traffic, latency, and IOPS."}, {"t": 58.61, "title": "Dashboard", "text": "The cluster dashboard also gains metrics. Open Dashboard."}, {"t": 64.03, "title": "Cluster Metrics", "text": "Below the capacity summary, select Cluster Metrics."}, {"t": 69.85, "title": "Cluster metrics", "text": "Cluster Metrics charts CPU utilization, load average, and memory utilization of the hosts."}, {"t": 77.08, "title": "VM metrics overview", "text": "Virtual Machine Metrics compares resource usage across virtual machines."}, {"t": 84.46, "title": "All VMs", "text": "The charts show CPU, memory, and storage usage for up to ten virtual machines."}, {"t": 91.95, "title": "Wrap-up", "text": "Monitoring is enabled and the virtual machine reports its metrics. Next, you balance virtual machines automatically."}], "recorded": "2026-11-13 13:19", "version": "SUSE Virtualization v1.10", "video": "v/32-monitoring-vm-metrics/video.mp4?v=1794998743", "poster": "v/32-monitoring-vm-metrics/poster.jpg?v=1794998743", "vtt": "v/32-monitoring-vm-metrics/captions.vtt?v=1794998743", "num": 34}, {"id": "33-vm-auto-balance", "title": "Balance virtual machines automatically", "category": "Add-ons", "order": 33, "summary": "Review the virtual-machine-auto-balance add-on, which uses the Kubernetes Descheduler to rebalance virtual machines across hosts.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["23-live-migrate-vm"], "intro": "This video reviews the virtual machine auto balance add-on, which uses the Kubernetes Descheduler to move virtual machines away from busy hosts.", "duration": 108.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "This video reviews the virtual machine auto balance add-on, which uses the Kubernetes Descheduler to move virtual machines away from busy hosts."}, {"t": 9.3, "title": "Add-ons", "text": "On the Add-ons page, the virtual-machine-auto-balance add-on is enabled. It runs the Kubernetes Descheduler."}, {"t": 17.47, "title": "Open the add-on", "text": "Open the add-on,"}, {"t": 20.14, "title": "Show Configuration", "text": "and select Show Configuration to view its settings."}, {"t": 24.42, "title": "Descheduler policy", "text": "The descheduler policy is in the valuesContent field, further down in the YAML."}, {"t": 30.95, "title": "Descheduler policy", "text": ""}, {"t": 32.62, "title": "valuesContent", "text": "The valuesContent field holds the descheduler settings and its policy."}, {"t": 37.82, "title": "Every five minutes", "text": "The descheduler runs every five minutes."}, {"t": 41.11, "title": "Eviction limit", "text": "Each run evicts at most five pods from a host."}, {"t": 44.87, "title": "Only virtual machines", "text": "The label selector limits evictions to virt-launcher pods, so only virtual machines move. Each eviction becomes a live migration."}, {"t": 54.74, "title": "System namespaces excluded", "text": "System namespaces are excluded from eviction."}, {"t": 58.51, "title": "Low thresholds", "text": "The LowNodeUtilization plugin compares reserved CPU and memory. A host below thirty percent of both counts as underutilized."}, {"t": 68.32, "title": "Target thresholds", "text": "A host above fifty percent counts as overutilized. The descheduler evicts virtual machines from it, so they move to underutilized hosts."}, {"t": 78.55, "title": "Close", "text": "Close the panel."}, {"t": 80.99, "title": "Hosts", "text": "Open the Hosts page to compare these thresholds with the reserved resources."}, {"t": 87.28, "title": "No host underutilized", "text": "Every host reserves more than thirty percent of its CPU. No host is underutilized, so the descheduler moves nothing."}, {"t": 97.17, "title": "Wrap-up", "text": "The descheduler checks the hosts every five minutes and live-migrates virtual machines only when a host crosses the thresholds. Next, you connect the cluster to SUSE Observability."}], "recorded": "2026-11-13 12:52", "version": "SUSE Virtualization v1.10", "video": "v/33-vm-auto-balance/video.mp4?v=1794998831", "poster": "v/33-vm-auto-balance/poster.jpg?v=1794998831", "vtt": "v/33-vm-auto-balance/captions.vtt?v=1794998831", "num": 35}, {"id": "34-suse-observability", "title": "Connect to SUSE Observability", "category": "Add-ons", "order": 34, "summary": "Review the suse-observability-agent add-on that connects the cluster to a SUSE Observability server.", "level": "intermediate", "cluster": "disaster-recovery", "prereqs": ["01-dashboard-tour"], "intro": "Meet the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring.", "duration": 82.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Meet the SUSE Observability agent add-on, which connects a SUSE Virtualization cluster to a SUSE Observability server for centralized monitoring."}, {"t": 9.5, "title": "Add-ons", "text": "On the Add-ons page, the experimental suse-observability-agent add-on is enabled, and its state is Deploy Successful."}, {"t": 18.48, "title": "Open the add-on", "text": "Open the add-on to see its details."}, {"t": 21.91, "title": "Namespace", "text": "The add-on installs the SUSE Observability agents in the suse-observability namespace."}, {"t": 28.72, "title": "Show Configuration", "text": "Select Show Configuration to view the add-on resource as YAML."}, {"t": 34.49, "title": "Configuration YAML", "text": "The configuration opens in a side panel. The last applied configuration shows the add-on as it was first created."}, {"t": 43.11, "title": "Chart and repository", "text": "It installs the suse-observability-agent chart from the SUSE Observability Helm repository."}, {"t": 50.44, "title": "Three values to fill", "text": "Its values start with three empty fields, apiKey, cluster name, and url."}, {"t": 56.85, "title": "Edit YAML", "text": "With Edit YAML, you fill them with the service token, a cluster name, and the receiver URL from SUSE Observability."}, {"t": 66.13, "title": "Close", "text": "This cluster is already connected, so close the panel without changes."}, {"t": 72.86, "title": "Wrap-up", "text": "The agent add-on is enabled and deployed, and it reports this cluster to SUSE Observability. Next, you create a VPC NAT gateway with Kube-OVN."}], "recorded": "2026-11-13 12:56", "version": "SUSE Virtualization v1.10", "video": "v/34-suse-observability/video.mp4?v=1794998831", "poster": "v/34-suse-observability/poster.jpg?v=1794998831", "vtt": "v/34-suse-observability/captions.vtt?v=1794998831", "num": 36}, {"id": "35-kubeovn-vpc-nat-gateway", "title": "Give a VPC internet access with a NAT gateway", "category": "Add-ons", "order": 35, "summary": "Create a custom VPC and subnet, add a VPC NAT gateway with an external IP and a source NAT rule, and reach the internet from a virtual machine in the VPC.", "level": "advanced", "cluster": "far-edge", "prereqs": ["20-overlay-network"], "intro": "Learn how to create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet.", "duration": 267.4, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Learn how to create a virtual private cloud with a subnet, then add a VPC NAT gateway so that virtual machines in the VPC can reach the internet."}, {"t": 8.76, "title": "Create a VPC", "text": "Under Overlay Networks, Virtual Private Cloud lists the VPCs. Select Create."}, {"t": 15.61, "title": "Name", "text": "Name the VPC demo-vpc."}, {"t": 18.66, "title": "Add a static route", "text": "On the Static Routes tab, select Add."}, {"t": 21.95, "title": "Default route", "text": "Route all destinations, zero dot zero dot zero dot zero slash zero,"}, {"t": 27.88, "title": "Next hop", "text": "to 172.31.10.254. The NAT gateway uses this address inside the VPC."}, {"t": 37.19, "title": "Create", "text": "Select Create."}, {"t": 41.57, "title": "Create a subnet", "text": "In the demo-vpc group, select Create Subnet."}, {"t": 46.86, "title": "Name", "text": "Name the subnet demo-vpc-subnet."}, {"t": 50.48, "title": "CIDR block", "text": "Enter the CIDR block 172.31.10.0/24."}, {"t": 56.47, "title": "Provider", "text": "As the provider, select the overlay network demo-vpc-net. The VPC is already set to demo-vpc."}, {"t": 65.76, "title": "Gateway IP", "text": "Set the gateway IP to 172.31.10.1."}, {"t": 70.95, "title": "DHCP", "text": "Enable DHCP, so that virtual machines get an address and a default route."}, {"t": 77.11, "title": "NAT Outgoing", "text": "Enable NAT Outgoing, as the documentation recommends for tenant subnets."}, {"t": 83.29, "title": "Create", "text": "Select Create."}, {"t": 85.75, "title": "Subnet ready", "text": "demo-vpc-subnet now belongs to demo-vpc. Without a gateway, it has no route out of the VPC."}, {"t": 93.88, "title": "NAT & Internet", "text": "Next, open NAT and Internet, under Overlay Networks."}, {"t": 98.87, "title": "Gateways", "text": "Select Gateways,"}, {"t": 101.5, "title": "Create a NAT gateway", "text": "and then Create."}, {"t": 103.88, "title": "Name", "text": "Name the gateway demo-gw."}, {"t": 107.0, "title": "Internal tenant network", "text": "Select the internal tenant network demo-vpc-net,"}, {"t": 111.96, "title": "VPC", "text": "the VPC demo-vpc,"}, {"t": 115.63, "title": "Subnet", "text": "and the subnet demo-vpc-subnet."}, {"t": 119.81, "title": "LAN IP", "text": "The LAN IP is the gateway's address in the subnet, 172.31.10.254, the next hop of the VPC route."}, {"t": 129.76, "title": "External Subnets", "text": "Open the External Subnets tab."}, {"t": 132.64, "title": "External subnet", "text": "Select the external subnet demo-ext-subnet. In this lab, it stands in for an underlay VLAN with outbound NAT through the host."}, {"t": 143.43, "title": "Create", "text": "Select Create."}, {"t": 147.17, "title": "Gateway running", "text": "SUSE Virtualization starts the gateway as a pod with one leg in the VPC subnet and one in the external subnet."}, {"t": 155.87, "title": "External IPs", "text": "Next, give the gateway an external IP. Select External IPs,"}, {"t": 161.7, "title": "Create an external IP", "text": "and then Create."}, {"t": 164.1, "title": "Name", "text": "Name it demo-eip."}, {"t": 166.18, "title": "NAT gateway", "text": "Select the NAT gateway demo-gw,"}, {"t": 170.62, "title": "External subnet", "text": "and the external subnet. Leave V4 IP empty to take the next free address."}, {"t": 177.67, "title": "Create", "text": "Select Create."}, {"t": 180.13, "title": "Source rules", "text": "Finally, add a source NAT rule. Select Source Rules,"}, {"t": 184.91, "title": "Create a source rule", "text": "and then Create."}, {"t": 187.31, "title": "Name", "text": "Name it demo-snat."}, {"t": 189.57, "title": "EIP", "text": "Select the external IP demo-eip."}, {"t": 193.44, "title": "Internal CIDR", "text": "Enter the subnet CIDR, 172.31.10.0/24. Traffic from it leaves with the external IP as its source."}, {"t": 203.62, "title": "Create", "text": "Select Create."}, {"t": 207.66, "title": "VM in the VPC", "text": "To test the path, a small virtual machine, demo-vpc-vm, was attached to the overlay network demo-vpc-net. Open Virtual Machines."}, {"t": 218.97, "title": "Address from the subnet", "text": "Its address comes from demo-vpc-subnet, assigned by the subnet's DHCP service."}, {"t": 225.84, "title": "Console", "text": "Open its console,"}, {"t": 228.43, "title": "Step 45", "text": "in WebVNC."}, {"t": 232.19, "title": "Log in", "text": "Log in as sles,"}, {"t": 234.36, "title": "Step 47", "text": "with the password that cloud-init set."}, {"t": 238.29, "title": "Ping the internet", "text": "Ping a public address on the internet, 8.8.8.8."}, {"t": 248.25, "title": "Internet reachable", "text": "The replies arrive. Traffic leaves the VPC through demo-gw, with demo-eip as its source address."}, {"t": 258.4, "title": "Wrap-up", "text": "The virtual machine in demo-vpc reaches the internet through the NAT gateway. Next, you manage hosts out of band."}], "recorded": "2026-11-13 13:29", "version": "SUSE Virtualization v1.10", "video": "v/35-kubeovn-vpc-nat-gateway/video.mp4?v=1794999071", "poster": "v/35-kubeovn-vpc-nat-gateway/poster.jpg?v=1794999071", "vtt": "v/35-kubeovn-vpc-nat-gateway/captions.vtt?v=1794999071", "num": 37}, {"id": "36-seeder-out-of-band", "title": "Manage hosts out of band with the Seeder add-on", "category": "Add-ons", "order": 36, "summary": "Enable the harvester-seeder add-on and connect a host to its BMC, so that SUSE Virtualization reads hardware details and events over Redfish and offers IPMI power actions.", "level": "advanced", "cluster": "harvester-ai", "prereqs": ["01-dashboard-tour"], "intro": "Here, you enable the harvester-seeder add-on and give a host its BMC address and credentials, so that SUSE Virtualization can manage the hardware out of band.", "duration": 136.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Here, you enable the harvester-seeder add-on and give a host its BMC address and credentials, so that SUSE Virtualization can manage the hardware out of band."}, {"t": 10.38, "title": "Seeder add-on", "text": "Under Advanced, Add-ons, open the action menu of harvester-seeder."}, {"t": 15.33, "title": "Enable", "text": "Select Enable. Seeder talks to the baseboard management controller of each host, over IPMI and Redfish."}, {"t": 24.1, "title": "Add-on deployed", "text": "The add-on reports Deploy Successful."}, {"t": 27.47, "title": "Edit the host", "text": "On the Hosts page, open the action menu of r640-1,"}, {"t": 32.77, "title": "Edit the host", "text": "and select Edit Config."}, {"t": 35.58, "title": "Out-of-band Access", "text": "Open the Out-of-band Access tab. The tab appears once the add-on is enabled."}, {"t": 40.91, "title": "Enable access", "text": "Select Enabled."}, {"t": 43.35, "title": "BMC address", "text": "Enter the address of the host's BMC, here a Dell iDRAC nine."}, {"t": 48.41, "title": "IPMI port", "text": "Enter port six two three, the IPMI over LAN port."}, {"t": 52.47, "title": "Insecure TLS", "text": "Select Insecure TLS, because this iDRAC uses a self-signed certificate."}, {"t": 57.83, "title": "Credentials secret", "text": "The credentials live in a secret. Open the Secret list and choose Create a New."}, {"t": 63.77, "title": "Secret name", "text": "Name the secret demo-idrac-r640. It is created in the default namespace."}, {"t": 69.81, "title": "BMC user", "text": "Enter the user name of a BMC account that may control power,"}, {"t": 73.84, "title": "BMC password", "text": "and its password."}, {"t": 76.06, "title": "Save the secret", "text": "Save the secret."}, {"t": 78.34, "title": "Hardware events", "text": "Event is Enabled, so Seeder polls Redfish for hardware events every hour."}, {"t": 83.46, "title": "Save", "text": "Select Save."}, {"t": 87.43, "title": "Hardware inventory", "text": "The host details now show the manufacturer, serial number, and model that Seeder read from the BMC over Redfish."}, {"t": 94.53, "title": "Out-of-band settings", "text": "The Out-of-band Access tab shows the saved BMC connection."}, {"t": 99.62, "title": "Hardware events", "text": "Open the Events tab."}, {"t": 102.15, "title": "Redfish events", "text": "It lists the hardware events that Seeder reads from Redfish, such as temperature health and failed components. Events are kept for one hour."}, {"t": 110.92, "title": "Power actions", "text": "Open the action menu of the host again."}, {"t": 114.07, "title": "Out-of-band power", "text": "Shut Down, Power On, and Reboot over IPMI appear here once the host is in maintenance mode. This single-node cluster stays running."}, {"t": 122.81, "title": "Step 29", "text": ""}, {"t": 125.78, "title": "Wrap-up", "text": "The host is connected to its BMC. SUSE Virtualization now shows hardware details and events, and offers out-of-band power actions for hosts in maintenance mode."}], "recorded": "2026-11-13 18:20", "version": "SUSE Virtualization v1.10", "video": "v/36-seeder-out-of-band/video.mp4?v=1794998994", "poster": "v/36-seeder-out-of-band/poster.jpg?v=1794998994", "vtt": "v/36-seeder-out-of-band/captions.vtt?v=1794998994", "num": 38}, {"id": "37-migrate-from-vsphere", "title": "Migrate a virtual machine from VMware vSphere", "category": "Add-ons", "order": 37, "summary": "Use the SUSE VM Migration Toolkit add-on to migrate a powered-off Linux virtual machine from VMware vSphere with a cold migration plan.", "level": "intermediate", "cluster": "far-edge", "prereqs": ["04-create-vm"], "intro": "Migrate a Linux virtual machine from VMware vSphere to SUSE Virtualization with a cold migration plan in the SUSE VM Migration Toolkit add-on.", "duration": 182.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Migrate a Linux virtual machine from VMware vSphere to SUSE Virtualization with a cold migration plan in the SUSE VM Migration Toolkit add-on."}, {"t": 10.03, "title": "VM Migration menu", "text": "The SUSE VM Migration Toolkit add-on adds the Virtual Machine Migration menu."}, {"t": 16.97, "title": "Providers", "text": "Select Providers."}, {"t": 19.66, "title": "vSphere provider", "text": "The vsphere provider connects to vCenter and is Ready. The host provider is this cluster, the migration target."}, {"t": 27.62, "title": "Back to the menu", "text": "Expand the Virtual Machine Migration menu again,"}, {"t": 31.92, "title": "Migration Overview", "text": "open Migration Overview, which lists the migration plans,"}, {"t": 36.86, "title": "Create Migration", "text": "and select Create Migration."}, {"t": 39.98, "title": "Source provider", "text": "In step one, select the existing provider vsphere instead of creating a new one."}, {"t": 46.8, "title": "Proceed", "text": "The form fills in the vCenter URL and credentials from the provider. Select Proceed."}, {"t": 53.8, "title": "Find the VM", "text": "Step two lists the virtual machines in vCenter. Search for ubuntu-nfs-src,"}, {"t": 60.47, "title": "Select the VM", "text": "a small, powered-off Ubuntu virtual machine with one CPU, two gigabytes of memory, and a ten gigabyte disk. Select it."}, {"t": 69.67, "title": "Proceed", "text": "Select Proceed."}, {"t": 72.29, "title": "Network mapping", "text": "Step three maps vSphere resources to SUSE Virtualization. Map the port group VM Network to the management network,"}, {"t": 82.27, "title": "Storage mapping", "text": "and the datastore ssd to the harvester-longhorn storage class."}, {"t": 88.22, "title": "Volume mode", "text": "The mapping defaults to Filesystem volumes. Select Edit to change the volume mode."}, {"t": 94.74, "title": "Block volumes", "text": "Choose Block, the volume mode that SUSE Virtualization virtual machine disks normally use. Keep ReadWriteMany for live migration."}, {"t": 105.55, "title": "Apply", "text": "Select Apply Override."}, {"t": 108.08, "title": "Proceed", "text": "Select Proceed."}, {"t": 110.7, "title": "Plan name", "text": "Step four reviews the plan. Name it demo-ubuntu-plan,"}, {"t": 115.72, "title": "Target namespace", "text": "and create the virtual machine in the namespace demo."}, {"t": 120.29, "title": "Cold migration", "text": "This is a cold migration. Source virtual machines are powered off during the copy. This one is already off."}, {"t": 128.3, "title": "Create and Start", "text": "Select Create and Start."}, {"t": 131.37, "title": "Migration running", "text": "The plan starts. Its row shows each step, from disk allocation and guest conversion to the disk copy."}, {"t": 140.25, "title": "Migration finished", "text": "After the copy, the plan shows Succeeded, and the virtual machine exists in SUSE Virtualization."}, {"t": 147.56, "title": "Virtual machines", "text": "Open Virtual Machines."}, {"t": 150.52, "title": "Migrated VM", "text": "ubuntu-nfs-src is in the namespace demo. It is off, like its source in vSphere."}, {"t": 157.28, "title": "Start it", "text": "Open its actions menu,"}, {"t": 160.11, "title": "Step 33", "text": "and select Start."}, {"t": 163.99, "title": "Running", "text": "The migrated Ubuntu virtual machine is running in SUSE Virtualization, converted by virt-v2v for KubeVirt."}, {"t": 174.15, "title": "Wrap-up", "text": "The virtual machine from vSphere now runs in SUSE Virtualization. Next, you find the largest virtual machine you can run."}], "recorded": "2026-11-13 14:06", "version": "SUSE Virtualization v1.10", "video": "v/37-migrate-from-vsphere/video.mp4?v=1794999292", "poster": "v/37-migrate-from-vsphere/poster.jpg?v=1794999292", "vtt": "v/37-migrate-from-vsphere/captions.vtt?v=1794999292", "num": 39}, {"id": "38-largest-vm", "title": "Create the largest virtual machines on a host", "category": "Scale & Limits", "order": 38, "summary": "Create a virtual machine with 512 vCPUs and 160 GiB on one ARM64 host, then 1024 vCPUs and 8 TiB of memory on one x86 host, and learn where those limits come from.", "level": "advanced", "cluster": "altra-ai + harvester-ai", "prereqs": ["04-create-vm"], "intro": "How big can one virtual machine get? You create the largest virtual machine a single ARM64 host in SUSE Virtualization accepts: 512 virtual CPUs and 160 gigabytes of memory.", "duration": 134.9, "chapters": [{"t": 0.0, "title": "Introduction", "text": "How big can one virtual machine get? You create the largest virtual machine a single ARM64 host in SUSE Virtualization accepts: 512 virtual CPUs and 160 gigabytes of memory."}, {"t": 13.85, "title": "Host capacity", "text": "Each host in this cluster is an Ampere Altra server with one hundred sixty cores and about one hundred twenty gigabytes of allocatable memory."}, {"t": 22.54, "title": "Create a virtual machine", "text": "Go to Virtual Machines"}, {"t": 24.8, "title": "Step 3", "text": "and select Create."}, {"t": 35.0, "title": "Basics", "text": "Choose the namespace"}, {"t": 37.73, "title": "Step 5", "text": "and a name."}, {"t": 39.39, "title": "512 vCPUs", "text": "Enter five hundred twelve CPUs. That is the hard ceiling of the ARM64 virt machine type, even on a host with fewer cores."}, {"t": 47.29, "title": "160 GiB memory", "text": "Enter one hundred sixty gigabytes of memory, more than the host can allocate."}, {"t": 52.43, "title": "Memory admission", "text": "Memory is admitted against node allocatable times the memory overcommit ratio, one hundred fifty percent by default."}, {"t": 59.97, "title": "Step 9", "text": "So the virtual machine requests about one hundred seven gigabytes, plus its overhead, which still fits on one host."}, {"t": 66.47, "title": "Boot image", "text": "On the Volumes tab,"}, {"t": 68.31, "title": "Step 11", "text": "select the openSUSE Leap ARM64 cloud image."}, {"t": 73.81, "title": "Console password", "text": "On Advanced Options,"}, {"t": 75.84, "title": "Step 13", "text": "select a cloud configuration template that creates a demo user with a console password."}, {"t": 81.47, "title": "Create", "text": "Select Create."}, {"t": 85.1, "title": "Running", "text": "The virtual machine is running with five hundred twelve CPUs and one hundred sixty gigabytes, on a single host."}, {"t": 92.44, "title": "Open the console", "text": "The guest has finished booting. Open its console."}, {"t": 96.15, "title": "Step 18", "text": ""}, {"t": 99.45, "title": "Log in", "text": "Log in as the demo user"}, {"t": 101.83, "title": "Step 20", "text": "and the password from the template."}, {"t": 106.9, "title": "The guest sees 512 CPUs", "text": "Check the processor count and the memory."}, {"t": 111.61, "title": "Step 22", "text": "The guest reports five hundred twelve processors and about one hundred sixty gigabytes of memory."}, {"t": 118.81, "title": "Wrap-up", "text": "Only a fraction of that memory can ever be backed by real RAM, and those CPUs share ninety-six threads, so treat these values as limits to know, not a sizing target. Next, you pack many small virtual machines onto one host."}], "recorded": "2026-11-13 17:22", "version": "SUSE Virtualization v1.9 (ARM64) + v1.10 (x86_64)", "video": "v/38-largest-vm/video.mp4?v=1794999134", "poster": "v/38-largest-vm/poster.jpg?v=1794999134", "vtt": "v/38-largest-vm/captions.vtt?v=1794999134", "num": 40}, {"id": "39-vm-density", "title": "Fill a host with small virtual machines", "category": "Scale & Limits", "order": 39, "summary": "Raise the overcommit ratios, then add tiny virtual machines in batches of ten with Multiple Instance until the host refuses more.", "level": "advanced", "cluster": "harvester-ai", "prereqs": ["38-largest-vm"], "intro": "Raise the overcommit ratios in SUSE Virtualization and add tiny virtual machines in batches of ten until a single host refuses to take more.", "duration": 172.8, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Raise the overcommit ratios in SUSE Virtualization and add tiny virtual machines in batches of ten until a single host refuses to take more."}, {"t": 9.79, "title": "The overcommit-config setting", "text": "In Advanced, Settings, overcommit-config sets how much CPU, memory, and storage the scheduler may promise beyond physical capacity."}, {"t": 18.26, "title": "Raise the ratios", "text": "Open its action menu and select Edit Setting to change the defaults."}, {"t": 23.04, "title": "Step 3", "text": ""}, {"t": 25.12, "title": "Step 4", "text": "For this demo, raise CPU from one thousand to two thousand percent,"}, {"t": 29.55, "title": "Step 5", "text": "and memory from one hundred fifty to four hundred percent, so each small virtual machine reserves very little."}, {"t": 36.22, "title": "Step 6", "text": "Select Save to apply the new ratios."}, {"t": 40.2, "title": "Batch one", "text": "Now go to Virtual Machines and select Create."}, {"t": 44.13, "title": "Step 9", "text": ""}, {"t": 46.14, "title": "Step 10", "text": "Select Multiple Instance to create several virtual machines from one form."}, {"t": 51.33, "title": "Step 11", "text": "Choose the demo namespace,"}, {"t": 54.5, "title": "Step 12", "text": "the name prefix demo-dense,"}, {"t": 57.65, "title": "Step 13", "text": "and a count of ten, the most the form creates at once."}, {"t": 61.48, "title": "Tiny virtual machines", "text": "Give each virtual machine one CPU"}, {"t": 65.02, "title": "Step 15", "text": "and one gigabyte of memory."}, {"t": 67.52, "title": "Step 16", "text": "On the Volumes tab,"}, {"t": 69.33, "title": "Step 17", "text": "select the small SLES sixteen minimal image. Its LVM thin storage clones each root disk from a snapshot in seconds."}, {"t": 78.03, "title": "Step 18", "text": "The Networks tab keeps the default management network, so no addresses come from the lab DHCP pool."}, {"t": 83.89, "title": "Step 19", "text": "Select Create. The form creates the ten virtual machines one after another."}, {"t": 91.39, "title": "Ten running", "text": "The first ten virtual machines are running."}, {"t": 94.29, "title": "Batch two", "text": "Repeat the form for batch two, with the prefix demo-dense-b and the same tiny settings."}, {"t": 100.68, "title": "Step 23", "text": ""}, {"t": 102.31, "title": "Step 24", "text": ""}, {"t": 104.7, "title": "Step 25", "text": ""}, {"t": 106.31, "title": "Step 26", "text": ""}, {"t": 107.91, "title": "Step 27", "text": ""}, {"t": 109.51, "title": "Step 28", "text": ""}, {"t": 111.12, "title": "Step 29", "text": ""}, {"t": 112.77, "title": "Step 30", "text": ""}, {"t": 115.18, "title": "Step 31", "text": ""}, {"t": 119.14, "title": "Step 33", "text": "Twenty virtual machines are running. From here on, the video cuts between batches."}, {"t": 125.88, "title": "Cut to forty", "text": "Cut. Two more batches of ten, created off camera with the same settings: forty virtual machines are running."}, {"t": 134.66, "title": "Cut to sixty", "text": "Cut again. After two more batches, sixty small virtual machines are running on this one host."}, {"t": 142.01, "title": "The host refuses", "text": "Cut. In the seventh batch, eight virtual machines start, but the host refuses the other two."}, {"t": 147.87, "title": "Step 40", "text": "Their pods are rejected for too many pods. Each virtual machine runs in its own pod, and the host allows two hundred."}, {"t": 154.81, "title": "Final count", "text": "The final count is sixty-eight running virtual machines. The pod limit, not CPU or memory, stopped this host."}, {"t": 163.22, "title": "Wrap-up", "text": "Overcommit lets a host admit many small virtual machines, at the cost of contention under load. Check the pod limit too, and restore the default ratios when you finish testing."}], "recorded": "2026-11-14 04:20", "version": "SUSE Virtualization v1.10 (x86_64)", "video": "v/39-vm-density/video.mp4?v=1794999464", "poster": "v/39-vm-density/poster.jpg?v=1794999464", "vtt": "v/39-vm-density/captions.vtt?v=1794999464", "num": 41}, {"id": "42-harvey-dr", "title": "Fail over VMs to another cluster with harvey", "category": "Disaster Recovery", "order": 42, "summary": "Fail VMs over to a second SUSE Virtualization cluster with harvey, a community DR tool, on Longhorn and on NetApp SnapMirror storage.", "level": "advanced", "cluster": "retail-store", "prereqs": ["04-create-vm"], "intro": "Protect virtual machines with harvey, a command-line disaster recovery tool, and fail them over to a second cluster: first on Longhorn, then on NetApp storage.", "duration": 168.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "Protect virtual machines with harvey, a command-line disaster recovery tool, and fail them over to a second cluster: first on Longhorn, then on NetApp storage."}, {"t": 9.4, "title": "The VM to protect", "text": "On the retail-store cluster, the virtual machine demo-harvey is running. Its disk is a Longhorn volume."}, {"t": 15.94, "title": "Protect the VM", "text": "harvey is a community tool, not a SUSE-supported CLI. It runs on your workstation and talks to both clusters. Run harvey protect for demo-harvey."}, {"t": 27.32, "title": "First backup and restore", "text": "harvey takes a first backup to a shared S3 target and waits until the disaster-recovery cluster restores it."}, {"t": 33.66, "title": "Standby DR volume", "text": "The source volume now backs up every five minutes. On the other cluster, a standby DR volume keeps restoring each backup."}, {"t": 41.37, "title": "Replica VM", "text": "harvey also copies the virtual machine and its cloud-init secret. The replica is created stopped."}, {"t": 47.99, "title": "Open the DR cluster", "text": "On the disaster-recovery cluster, filter the virtual machine list for demo-harvey."}, {"t": 53.19, "title": "The replica waits", "text": "The replica is there, and Off. It uses no compute until you fail over."}, {"t": 58.76, "title": "Replication status", "text": "harvey replication status shows the DR volume in standby and up to date. Lag is the data you would lose right now."}, {"t": 66.26, "title": "Planned failover", "text": "Now run a planned failover of demo-harvey to the disaster-recovery cluster."}, {"t": 72.0, "title": "Stop, sync, promote, start", "text": "harvey stops the VM, takes a final backup, waits for its restore, then promotes the DR volume and starts the VM."}, {"t": 79.03, "title": "Recovery time and point", "text": "The summary shows the total recovery time, split by phase, and a recovery point of zero seconds: no data lost."}, {"t": 86.32, "title": "Running on the DR site", "text": "Back on the disaster-recovery cluster, filter for demo-harvey again."}, {"t": 90.72, "title": "Running on the DR site", "text": "The virtual machine is Running here now, on the restored Longhorn volume."}, {"t": 95.65, "title": "Original stays stopped", "text": "On retail-store, the original is Off, so only one copy runs. harvey reprotect later replicates back the other way."}, {"t": 102.95, "title": "Other storage backends", "text": "harvey is not tied to Longhorn. Its project page lists three backends: NetApp SnapMirror, Portworx async DR, and Longhorn, with V2 still alpha."}, {"t": 113.97, "title": "Protect a NetApp VM", "text": "demo-harvey-na keeps its disk on NetApp storage. The same protect command picks the NetApp backend and mirrors the disk with SnapMirror, through Trident."}, {"t": 122.7, "title": "Two VMs, two backends", "text": "Replication status now lists both virtual machines, each with its own backend: Longhorn for demo-harvey and NetApp for demo-harvey-na."}, {"t": 133.97, "title": "NetApp failover", "text": "The planned failover runs the same phases: stop, a final SnapMirror update, promote the replica volume, and start the VM."}, {"t": 141.77, "title": "Recovery time and point", "text": "The summary again shows the recovery time by phase and a recovery point of zero seconds."}, {"t": 147.38, "title": "Both VMs on the DR site", "text": "On the disaster-recovery cluster, filter the list for demo-harvey once more."}, {"t": 152.34, "title": "Both VMs on the DR site", "text": "Both virtual machines run here now, one on a Longhorn volume and one on a NetApp volume."}, {"t": 158.94, "title": "Wrap-up", "text": "Both virtual machines now run on the disaster-recovery cluster, with no data lost. Next, you fail over a VM with NetApp Trident Protect."}], "recorded": "2026-11-14 13:39", "version": "SUSE Virtualization v1.9 and v1.10", "video": "v/42-harvey-dr/video.mp4?v=1794999443", "poster": "v/42-harvey-dr/poster.jpg?v=1794999443", "vtt": "v/42-harvey-dr/captions.vtt?v=1794999443", "num": 42}, {"id": "44-trident-protect-dr", "title": "Fail over a VM with NetApp Trident Protect", "category": "Disaster Recovery", "order": 44, "summary": "Replicate a VM's NetApp volumes to a second cluster with Trident Protect and SnapMirror, then fail it over.", "level": "advanced", "cluster": "retail-store", "prereqs": ["40-netapp-trident"], "intro": "This video shows how to replicate a virtual machine's NetApp volume to a second SUSE Virtualization cluster with Trident Protect and SnapMirror, then fail the virtual machine over.", "duration": 134.5, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you replicate a virtual machine's NetApp volume to a second SUSE Virtualization cluster with Trident Protect and SnapMirror, then fail the virtual machine over."}, {"t": 10.78, "title": "The VM to protect", "text": "On the retail-store cluster, the virtual machine demo-tp is running. A small service inside writes a timestamp every five seconds."}, {"t": 19.56, "title": "A NetApp volume", "text": "Its only disk, demo-tp-root, is a NetApp iSCSI volume that Trident provisions on the ONTAP system."}, {"t": 29.02, "title": "Define the application", "text": "Trident Protect, a NetApp product, works with applications. Define the VM as one, and snapshot it every five minutes."}, {"t": 37.14, "title": "First snapshot", "text": "After applying both, take a first snapshot right away. It captures the volume and stores the VM definition in the S3 AppVault."}, {"t": 46.53, "title": "AppMirrorRelationship", "text": "On the disaster-recovery cluster, an AppMirrorRelationship names the source application and the same AppVault, and maps the storage class."}, {"t": 55.19, "title": "Mirror established", "text": "After the baseline transfer, the relationship is Established. The DR cluster holds a replica volume, but no virtual machine yet."}, {"t": 63.06, "title": "SnapMirror underneath", "text": "On the DR ONTAP system, the volume is a SnapMirror destination, snapmirrored and healthy."}, {"t": 70.68, "title": "Disable the schedule", "text": "For a planned failover, first disable the schedule on retail-store, so no newer snapshot overtakes the final one."}, {"t": 77.15, "title": "ShutdownSnapshot", "text": "Then take a ShutdownSnapshot. It stops the VM, takes a final snapshot and removes the VM from retail-store."}, {"t": 84.13, "title": "Promote on the DR site", "text": "On the disaster-recovery cluster, promote the relationship with that snapshot. Trident Protect breaks the mirror and recreates the VM."}, {"t": 91.88, "title": "Failover times", "text": "The summary lists how long each phase took, from the first command until the VM runs on the DR site."}, {"t": 98.13, "title": "Running on the DR site", "text": "On the disaster-recovery cluster, filter the virtual machine list for demo-tp."}, {"t": 103.26, "title": "Running on the DR site", "text": "demo-tp is Running here now, recreated from the AppVault on the replicated NetApp volume."}, {"t": 110.32, "title": "No data lost", "text": "Inside the guest, the timestamps stop when the ShutdownSnapshot stopped the VM and resume after the boot on the DR site. Nothing is missing."}, {"t": 118.78, "title": "Gone from retail-store", "text": "Back on retail-store, the virtual machine is gone, so only one copy runs. Its retained volume stays for a later failback."}, {"t": 126.75, "title": "Wrap-up", "text": "demo-tp now runs on the disaster-recovery cluster, with no data lost. Failback works the same way, in the other direction."}], "recorded": "2026-11-14 14:01", "version": "SUSE Virtualization v1.9 and v1.10, Trident 26.06, Trident Protect 26.06", "video": "v/44-trident-protect-dr/video.mp4?v=1794683018", "poster": "v/44-trident-protect-dr/poster.jpg?v=1794683018", "vtt": "v/44-trident-protect-dr/captions.vtt?v=1794683018", "num": 43}, {"id": "45-kasten-dr", "title": "Restore a VM on another cluster with Veeam Kasten", "category": "Disaster Recovery", "order": 45, "summary": "Export a VM backup with Kasten K10 and import and restore it on a second SUSE Virtualization cluster.", "level": "advanced", "cluster": "kasten-harvester-ai", "prereqs": ["41-kasten-backup-restore"], "intro": "Export a virtual machine backup with Veeam Kasten on one SUSE Virtualization cluster, then import it on a second cluster and restore the virtual machine there.", "duration": 198.7, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you export a virtual machine backup with Veeam Kasten on one SUSE Virtualization cluster, then import it on a second cluster and restore the virtual machine there."}, {"t": 11.68, "title": "Step 1", "text": ""}, {"t": 13.37, "title": "The source cluster", "text": "Kasten runs on the source cluster, harves
