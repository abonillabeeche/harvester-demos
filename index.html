", "num": 42}, {"id": "42-harvey-dr", "title": "Fail over VMs to another cluster with harvey", "category": "Ecosystem", "order": 42, "summary": "Protect VMs with replicated storage and fail them over to a second SUSE Virtualization cluster.", "level": "advanced", "cluster": null, "prereqs": [], "intro": "Protect VMs with replicated storage and fail them over to a second SUSE Virtualization cluster.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 43}, {"id": "43-cloudcasa", "title": "Protect VMs with CloudCasa", "category": "Ecosystem", "order": 43, "summary": "Back up SUSE Virtualization VMs with CloudCasa and restore them.", "level": "intermediate", "cluster": null, "prereqs": [], "intro": "Back up SUSE Virtualization VMs with CloudCasa and restore them.", "duration": null, "chapters": [], "recorded": null, "version": "", "video": null, "poster": null, "vtt": null, "num": 44}, {"id": "50-observability-overview", "title": "SUSE Virtualization in SUSE Observability", "category": "Observability", "order": 50, "summary": "Review cluster health, versions, topology, and events of your SUSE Virtualization clusters in SUSE Observability.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["34-suse-observability"], "intro": "In this video, you review what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place.", "duration": 94.0, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you review what SUSE Observability shows for your SUSE Virtualization clusters: health, versions, topology, and events in one place."}, {"t": 10.78, "title": "Clusters overview", "text": "The SUSE Virtualization Clusters view lists every cluster that reports to SUSE Observability, one row per cluster."}, {"t": 19.63, "title": "Cluster health", "text": "The Health column rolls up the monitors of each cluster. A cluster with an unhealthy monitor shows Deviating."}, {"t": 27.54, "title": "Versions and capacity", "text": "The columns show the SUSE Virtualization version, hosts, running VMs, KubeVirt and Longhorn versions, and etcd and clock checks."}, {"t": 37.65, "title": "Topology", "text": "Select Topology to see the clusters as components on a map."}, {"t": 50.13, "title": "Events", "text": "Select Events to list what happened to these clusters in the selected time range."}, {"t": 56.21, "title": "Health changes", "text": "Each event names the cluster, shows the change, such as a health state transition, and when it happened."}, {"t": 63.3, "title": "Time range", "text": "The time range at the bottom applies to every perspective. Move it back to see the clusters as they were."}, {"t": 70.49, "title": "Main menu", "text": "Open the main menu."}, {"t": 73.3, "title": "SUSE Virtualization views", "text": "Expand SUSE Virtualization."}, {"t": 76.73, "title": "Views per resource", "text": "Besides Clusters, this section has views for hosts, virtual machines, volumes, VM networks, and VPCs."}, {"t": 86.66, "title": "Wrap-up", "text": "You reviewed your clusters in SUSE Observability. Next, you explore the topology of a single virtual machine."}], "recorded": "2026-11-13 12:31", "version": "SUSE Virtualization v1.10", "video": "v/50-observability-overview/video.mp4?v=1794611462", "poster": "v/50-observability-overview/poster.jpg?v=1794611462", "vtt": "v/50-observability-overview/captions.vtt?v=1794611462", "num": 45}, {"id": "51-vm-topology", "title": "Explore virtual machine topology", "category": "Observability", "order": 51, "summary": "Open a virtual machine in SUSE Observability and follow its relations to the host, volumes, and VM network.", "level": "beginner", "cluster": "suse-observability", "prereqs": ["50-observability-overview"], "intro": "In this video, you open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective.", "duration": 87.6, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you open a virtual machine in SUSE Observability and follow its relations to its host, storage, and network in the Topology perspective."}, {"t": 11.34, "title": "Main menu", "text": "Open the main menu."}, {"t": 14.0, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 17.42, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 20.47, "title": "Open a VM", "text": "The view lists the VMs of every connected cluster. Open the VM named kasm, which runs on the far-edge cluster."}, {"t": 30.35, "title": "VM properties", "text": "Highlights opens first. The About card shows the VM's status, host, IP address, vCPUs, memory, and guest operating system."}, {"t": 41.12, "title": "Related resources", "text": "Related resources lists what the VM uses, such as its VM network, its disks, the Longhorn volume, and the virt-launcher pod."}, {"t": 50.91, "title": "Topology", "text": "Select Topology to draw these relations as a map."}, {"t": 77.97, "title": "Wrap-up", "text": "Each virtual machine is a component with relations to its host, storage, and network. Next, you investigate an unhealthy virtual machine."}], "recorded": "2026-11-13 12:34", "version": "SUSE Virtualization v1.10", "video": "v/51-vm-topology/video.mp4?v=1794611590", "poster": "v/51-vm-topology/poster.jpg?v=1794611590", "vtt": "v/51-vm-topology/captions.vtt?v=1794611590", "num": 46}, {"id": "52-vm-health-monitor", "title": "Investigate an unhealthy virtual machine", "category": "Observability", "order": 52, "summary": "Find a Deviating virtual machine in SUSE Observability, check its metrics, and open the monitor and remediation guide behind its health state.", "level": "intermediate", "cluster": "suse-observability", "prereqs": ["51-vm-topology"], "intro": "In this video, you find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state.", "duration": 108.2, "chapters": [{"t": 0.0, "title": "Introduction", "text": "In this video, you find an unhealthy virtual machine in SUSE Observability, check its metrics, and open the monitor behind its health state."}, {"t": 10.42, "title": "Main menu", "text": "Open the main menu."}, {"t": 13.13, "title": "SUSE Virtualization", "text": "Expand SUSE Virtualization."}, {"t": 16.52, "title": "Virtual machines", "text": "Select Virtual machines."}, {"t": 19.68, "title": "A Deviating VM", "text": "This VM shows Deviating. It runs on a host of the harvester-north cluster."}, {"t": 26.03, "title": "Usage metrics", "text": "To the right, the CPU Usage, Memory Usage, and Disk Usage columns show current metrics for each VM."}, {"t": 33.73, "title": "Open the VM", "text": "Open the Deviating VM."}, {"t": 37.38, "title": "Unhealthy monitor", "text": "On the Highlights page, the Monitors card shows which check failed. Here, it is VM disk filling up."}, {"t": 44.81, "title": "Metrics", "text": "Before you open the monitor, select Metrics to see the VM's charts."}, {"t": 50.55, "title": "Guest filesystems", "text": "Guest shows filesystem usage inside the VM, from the QEMU guest agent. Other groups cover network, storage, memory, and CPU."}, {"t": 61.12, "title": "Back to Highlights", "text": "Return to Highlights."}, {"t": 64.02, "title": "Open the monitor", "text": "Select the VM disk filling up monitor."}, {"t": 69.1, "title": "What the monitor checks", "text": "The panel explains the check. It fires when the fullest writable filesystem in the VM is more than eighty percent used."}, {"t": 77.97, "title": "Triggering evidence", "text": "The triggering evidence plots that metric against its threshold. The health state shows Deviating since the trigger time."}, {"t": 86.3, "title": "Remediation guide", "text": "Below, the monitor links a remediation guide with suggested next steps. Review them against your own environment before you act."}, {"t": 96.58
